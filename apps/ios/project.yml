# مشروع Xcode يُولَّد من هذا الملف بـ XcodeGen (`xcodegen generate` في apps/ios)؛ ملف .xcodeproj لا يُلتزم به.
name: PostHistory
options:
  bundleIdPrefix: net.palpost
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  PostHistoryKit:
    path: Packages/PostHistoryKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  PostHistory:
    type: application
    platform: iOS
    # عنوان الخادم PH_API_BASE_URL من App/Config/API.xcconfig (ويُستبدل لبناء التجربة بـ API.local.xcconfig).
    configFiles:
      Debug: App/Config/API.xcconfig
      Release: App/Config/API.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: PostHistoryKit
        product: PostHistoryAPI
      - package: PostHistoryKit
        product: AuthCore
      - package: PostHistoryKit
        product: UploadCore
      - package: PostHistoryKit
        product: FormEngine
      - package: PostHistoryKit
        product: DeviceSecurity
      - package: PostHistoryKit
        product: MaterialsCore
      - package: PostHistoryKit
        product: NotificationsCore
      - package: PostHistoryKit
        product: DeviceAttestation
      - package: PostHistoryKit
        product: MediaCore
    # App Attest (SEC-07) وAPNs: بيئة الإنتاج لبناءات TestFlight والمتجر؛ القدرتان تُفعَّلان على المعرّف في بوابة المطوّرين،
    # وعلى الخادم APNS_ENVIRONMENT=production كي تصل رموز أجهزة TestFlight.
    entitlements:
      path: App/PostHistory.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
        aps-environment: production
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ميدان بوست
        # رقم البناء والنسخة من إعدادات البناء: سير الرفع يمرر CURRENT_PROJECT_VERSION وMARKETING_VERSION، وبدونهما يبقى كل بناء «1» فترفض آبل ما بعد الأول.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        # شاشة الإطلاق بلون خلفية الهوية v2 (`bg/base` بوضعيه) فلا يومض لون آخر قبل شاشة الإقلاع (ADR 0088).
        UILaunchScreen:
          UIColorName: vl/bg-base
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # النص المعروض في طلب Face ID؛ ترجمته في App/Resources/InfoPlist.xcstrings.
        NSFaceIDUsageDescription: يستخدم التطبيق Face ID لقفل موادك ورفعك.
        PHAPIBaseURL: $(PH_API_BASE_URL)
        # خطوط الهوية v2 بترخيص OFL 1.1 (App/Resources/Fonts، والتراخيص بجانبها؛ ADR 0088): Rubik للعرض والأرقام،
        # وReadex Pro للنص، وIBM Plex Mono لرقم الإيصال والبصمة. أوزان ثابتة من Google Fonts.
        UIAppFonts:
          - Rubik_600SemiBold.ttf
          - Rubik_700Bold.ttf
          - Rubik_800ExtraBold.ttf
          - ReadexPro_400Regular.ttf
          - ReadexPro_500Medium.ttf
          - ReadexPro_600SemiBold.ttf
          - ReadexPro_700Bold.ttf
          - IBMPlexMono_500Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.palpost.posthistory
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
      # توقيع النسخة يدوي بشهادة التوزيع المحفوظة في مستودع الرفع: التوقيع الآلي في CI ينشئ شهادة تطوير في كل تشغيل
      # فبلغ الحساب حدّها (2026-10-27). الملف يُنشأ ويُجلب بالاسم أدناه (apps/posthistory.yml في مستودع الرفع).
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: Y4R9ZHWK9Y
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: PostHistory AppStore CI
schemes:
  PostHistory:
    build:
      targets:
        PostHistory: all
    run:
      config: Debug
