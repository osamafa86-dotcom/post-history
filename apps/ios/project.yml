# مشروع Xcode يُولَّد من هذا الملف بـ XcodeGen (`xcodegen generate` في apps/ios)؛ ملف .xcodeproj لا يُلتزم به.
name: PostHistory
options:
  bundleIdPrefix: net.palpost
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  PostHistoryKit:
    path: Packages/PostHistoryKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  PostHistory:
    type: application
    platform: iOS
    # عنوان الخادم PH_API_BASE_URL من App/Config/API.xcconfig (ويُستبدل لبناء التجربة بـ API.local.xcconfig).
    configFiles:
      Debug: App/Config/API.xcconfig
      Release: App/Config/API.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: PostHistoryKit
        product: PostHistoryAPI
      - package: PostHistoryKit
        product: AuthCore
      - package: PostHistoryKit
        product: UploadCore
      - package: PostHistoryKit
        product: FormEngine
      - package: PostHistoryKit
        product: DeviceSecurity
      - package: PostHistoryKit
        product: NotificationsCore
      - package: PostHistoryKit
        product: DeviceAttestation
    # App Attest (SEC-07): بيئة الإنتاج لبناءات TestFlight والمتجر؛ القدرة تُفعَّل على المعرّف في بوابة المطوّرين.
    entitlements:
      path: App/PostHistory.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PostHistory
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        PHAPIBaseURL: $(PH_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.palpost.posthistory
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
schemes:
  PostHistory:
    build:
      targets:
        PostHistory: all
    run:
      config: Debug
