# مشروع Xcode يُولَّد من هذا الملف بـ XcodeGen (`xcodegen generate` في apps/ios)؛ ملف .xcodeproj لا يُلتزم به.
name: PostHistory
options:
  bundleIdPrefix: net.palpost
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  PostHistoryKit:
    path: Packages/PostHistoryKit
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  PostHistory:
    type: application
    platform: iOS
    # عنوان الخادم PH_API_BASE_URL من App/Config/API.xcconfig (ويُستبدل لبناء التجربة بـ API.local.xcconfig).
    configFiles:
      Debug: App/Config/API.xcconfig
      Release: App/Config/API.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: PostHistoryKit
        product: PostHistoryAPI
      - package: PostHistoryKit
        product: AuthCore
      - package: PostHistoryKit
        product: UploadCore
      - package: PostHistoryKit
        product: FormEngine
      - package: PostHistoryKit
        product: DeviceSecurity
      - package: PostHistoryKit
        product: MaterialsCore
      - package: PostHistoryKit
        product: NotificationsCore
      - package: PostHistoryKit
        product: DeviceAttestation
      - package: PostHistoryKit
        product: MediaCore
    # App Attest (SEC-07) وAPNs: بيئة الإنتاج لبناءات TestFlight والمتجر؛ القدرتان تُفعَّلان على المعرّف في بوابة المطوّرين،
    # وعلى الخادم APNS_ENVIRONMENT=production كي تصل رموز أجهزة TestFlight.
    entitlements:
      path: App/PostHistory.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
        aps-environment: production
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PostHistory
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # النص المعروض في طلب Face ID؛ ترجمته في App/Resources/InfoPlist.xcstrings.
        NSFaceIDUsageDescription: يستخدم التطبيق Face ID لقفل موادك ورفعك.
        PHAPIBaseURL: $(PH_API_BASE_URL)
        # خطوط نظام التصميم بترخيص OFL 1.1 (App/Resources/Fonts، والتراخيص بجانبها).
        UIAppFonts:
          - NotoSansArabic_400Regular.ttf
          - NotoSansArabic_500Medium.ttf
          - NotoSansArabic_600SemiBold.ttf
          - NotoSansArabic_700Bold.ttf
          - Inter_400Regular.ttf
          - Inter_500Medium.ttf
          - Inter_600SemiBold.ttf
          - Inter_700Bold.ttf
          - IBMPlexMono_400Regular.ttf
          - IBMPlexMono_500Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.palpost.posthistory
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
schemes:
  PostHistory:
    build:
      targets:
        PostHistory: all
    run:
      config: Debug
