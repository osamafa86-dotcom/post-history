name: field-trial

# Field trial environment (ADR 0013): the trial compose with both Caddy edges on 127.0.0.1 / 127.0.0.2 (local CA),
# full tus uploads through each edge, monitoring (infra/observability) with injected failures, a log canary, an
# encrypted backup, a restore drill, and the field-trial acceptance pack through the edge. Runs when infra or the database
# schema changes (a migration can break restore: the 2026-10-20 drill found one).
on:
  pull_request:
    paths:
      - "infra/**"
      - "apps/api/src/db/**"
      - ".github/workflows/field-trial.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  field-trial:
    name: field trial (edges, uploads, backup, restore drill)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    timeout-minutes: 30
    env:
      NO_PROXY: 127.0.0.1,localhost,.localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Validate both Caddyfiles
        run: |
          for f in main ingest; do
            docker run --rm -v "$PWD/infra/field-trial/Caddyfile.$f:/etc/caddy/Caddyfile:ro" \
              -e MAIN_DOMAIN=main.localhost -e INGEST_DOMAIN=ingest.localhost -e MAIN_IP=127.0.0.1 -e INGEST_IP=127.0.0.2 \
              -e ACME_EMAIL=ci@example.invalid -e CADDY_GLOBAL_EXTRA=local_certs -e API_PORT=3000 -e TUSD_PORT=8080 \
              -e INGEST_PORT=8443 caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: Preflight and observability scripts parse
        run: for f in infra/field-trial/preflight.sh infra/observability/*.sh; do bash -n "$f"; done
      # The acceptance pack (tools/acceptance/run.mjs --target) resolves the edge by name, as it would on the host.
      - name: Resolve the edge names to loopback, and FFmpeg for the pack's synthetic clips
        run: |
          echo "127.0.0.1 main.localhost" | sudo tee -a /etc/hosts
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Trial stack smoke, monitoring, log canary, backup, restore drill, acceptance pack through the edge
        run: |
          (cd tools/acceptance && npm ci --no-audit --no-fund)
          TRIAL_ACCEPTANCE=1 ACCEPTANCE_OUT="$RUNNER_TEMP/pack" DRILL_OUT="$RUNNER_TEMP/restore-drill.json" \
            infra/field-trial/smoke-trial.sh
      - name: Print the acceptance pack report
        if: always()
        run: cat "$RUNNER_TEMP/pack/REPORT.md" 2>/dev/null || true
      - name: Print the drill result
        if: always()
        run: cat "$RUNNER_TEMP/restore-drill.json" 2>/dev/null || true
