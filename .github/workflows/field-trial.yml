name: field-trial

# Field trial environment (ADR 0013): the trial compose with both Caddy edges on 127.0.0.1 / 127.0.0.2 (local CA),
# full tus uploads through each edge, an encrypted backup and a restore drill. Runs when infra or the database
# schema changes (a migration can break restore: the 2026-10-20 drill found one). The QA field-trial pack runs through the
# same edge (TRIAL_AFTER_EDGE in smoke-trial.sh) so it is proven across Caddy before it meets the real host.
on:
  pull_request:
    paths:
      - "infra/**"
      - "apps/api/src/db/**"
      - "tools/acceptance/field-trial/**"
      - "tools/acceptance/lib/target.mjs"
      - ".github/workflows/field-trial.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  field-trial:
    name: field trial (edges, uploads, backup, restore drill)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NO_PROXY: 127.0.0.1,localhost,.localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Validate both Caddyfiles
        run: |
          for f in main ingest; do
            docker run --rm -v "$PWD/infra/field-trial/Caddyfile.$f:/etc/caddy/Caddyfile:ro" \
              -e MAIN_DOMAIN=main.localhost -e INGEST_DOMAIN=ingest.localhost -e MAIN_IP=127.0.0.1 -e INGEST_IP=127.0.0.2 \
              -e ACME_EMAIL=ci@example.invalid -e CADDY_GLOBAL_EXTRA=local_certs -e API_PORT=3000 -e TUSD_PORT=8080 \
              -e INGEST_PORT=8443 caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: Preflight script parses
        run: bash -n infra/field-trial/preflight.sh
      - name: Trial stack smoke, backup and restore drill
        run: |
          (cd tools/acceptance && npm ci --no-audit --no-fund)
          DRILL_OUT="$RUNNER_TEMP/restore-drill.json" EDGE_PACK_OUT="$RUNNER_TEMP/pack-edge" \
            TRIAL_AFTER_EDGE="$PWD/tools/acceptance/field-trial/edge-rehearsal.sh" infra/field-trial/smoke-trial.sh
      - name: The acceptance pack ran through the edge (no step failed, every step left a result)
        run: |
          [ -s "$RUNNER_TEMP/pack-edge/REPORT.md" ] || { echo "the pack did not run through the edge (TRIAL_AFTER_EDGE hook missing?)"; exit 1; }
          n="$(find "$RUNNER_TEMP/pack-edge" -name '*.json' | wc -l)"
          [ "$n" -ge 6 ] || { echo "only $n result files"; exit 1; }
          if grep -rlE '"result": "fail"' "$RUNNER_TEMP/pack-edge" --include=*.json; then echo "a pack step failed"; exit 1; fi
      - name: Print the drill result
        if: always()
        run: cat "$RUNNER_TEMP/restore-drill.json" 2>/dev/null || true
      - name: Print the pack report
        if: always()
        run: '[ -f "$RUNNER_TEMP/pack-edge/REPORT.md" ] && head -60 "$RUNNER_TEMP/pack-edge/REPORT.md" || true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: field-trial-edge-pack
          path: ${{ runner.temp }}/pack-edge
          if-no-files-found: ignore
          retention-days: 14
