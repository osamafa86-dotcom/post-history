name: acceptance

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/plan/**', 'docs/security/**', 'docs/ops/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/plan/**', 'docs/security/**', 'docs/ops/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: acceptance (unit tests, results gate, conformance, upload-resume vs tusd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/acceptance/package-lock.json
      - name: Install
        working-directory: tools/acceptance
        run: npm ci
      # Majors are held back in Dependabot until after the field trial: gate high-severity advisories here.
      - name: Audit runtime dependencies (high and above)
        working-directory: tools/acceptance
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests (scripts against mock servers, detectors, conformance, field cards)
        working-directory: tools/acceptance
        run: npm test
      - name: Every measurement result file (schema, naming, honesty, no revealing data)
        working-directory: tools/acceptance
        run: node validate-results.mjs
      - name: Form conformance (forms against upload-form.json, reference vs expectations)
        working-directory: tools/acceptance
        run: node form-conformance/run.mjs
      - name: Unified acceptance report (job summary; the gate reads this table)
        working-directory: tools/acceptance
        run: node report.mjs --summary
      - name: Static pii-leak and tenant-isolation (no result file written)
        working-directory: tools/acceptance
        run: node run.mjs pii-leak tenant-isolation dynamic-fields --dry-run
      - name: Start tusd (official image, file store; the compose tusd needs MinIO and the API hooks)
        run: |
          docker run -d --name tusd -p 8080:8080 tusproject/tusd:v2.10.1 -port=8080 -base-path=/files/
          for i in $(seq 1 30); do
            curl -fsS -X OPTIONS http://127.0.0.1:8080/files/ -H 'Tus-Resumable: 1.0.0' -o /dev/null && exit 0
            sleep 1
          done
          docker logs tusd
          exit 1
      - name: upload-resume against tusd (64 MiB, three interruptions)
        working-directory: tools/acceptance
        env:
          UPLOAD_ENDPOINT: http://127.0.0.1:8080/files/
          UPLOAD_SIZE_MB: "64"
        run: node run.mjs upload-resume --dry-run

  live:
    name: "live acceptance (API + Postgres - pii-leak, tenant-isolation, idempotency, tusd hook, receipt-notification)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: posthistory_test
          POSTGRES_USER: posthistory
          POSTGRES_PASSWORD: ci-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U posthistory -d posthistory_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://posthistory:ci-only@localhost:5432/posthistory_test
      LIVE_REDIS_URL: redis://127.0.0.1:6379
      LIVE_S3_ENDPOINT: http://127.0.0.1:9000
      LIVE_S3_ACCESS_KEY: minio-ci
      LIVE_S3_SECRET_KEY: ci-only-minio-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Start MinIO (the image compose pins, ADR 0004)
        run: |
          docker run -d --name minio --network host -e MINIO_ROOT_USER="$LIVE_S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$LIVE_S3_SECRET_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/live -o /dev/null && exit 0; sleep 1; done
          docker logs minio
          exit 1
      - name: Build the API and migrate the database
        working-directory: apps/api
        run: |
          npm ci
          src/db/migrate.sh up
          npm run build
      - name: Install the acceptance tools
        working-directory: tools/acceptance
        run: npm ci
      - name: Live run (the API starts with throwaway secrets; nothing is written to docs/measurements)
        working-directory: tools/acceptance
        run: node live/run.mjs --dry-run
      - name: upload-resume against tusd on S3 with downloads disabled (hash read from MinIO, as in compose)
        working-directory: tools/acceptance
        env:
          UPLOAD_ENDPOINT: http://127.0.0.1:8081/files/
          UPLOAD_SIZE_MB: "64"
          UPLOAD_S3_ENDPOINT: ${{ env.LIVE_S3_ENDPOINT }}
          UPLOAD_S3_ACCESS_KEY: ${{ env.LIVE_S3_ACCESS_KEY }}
          UPLOAD_S3_SECRET_KEY: ${{ env.LIVE_S3_SECRET_KEY }}
          UPLOAD_S3_BUCKET: tusd-ci
          UPLOAD_S3_PREFIX: tus/
        run: |
          node -e "import('./lib/s3.mjs').then(async (m) => { await m.s3FromEnv(process.env, 'UPLOAD_S3').ensureBucket('tusd-ci'); })"
          docker run -d --name tusd-s3 --network host -e AWS_ACCESS_KEY_ID="$UPLOAD_S3_ACCESS_KEY" -e AWS_SECRET_ACCESS_KEY="$UPLOAD_S3_SECRET_KEY" -e AWS_REGION=us-east-1 \
            tusproject/tusd:v2.10.1 -port=8081 -base-path=/files/ -s3-bucket=tusd-ci -s3-endpoint="$UPLOAD_S3_ENDPOINT" -s3-object-prefix=tus/ \
            -s3-part-size=8388608 -s3-min-part-size=8388608 -disable-download
          for i in $(seq 1 30); do curl -fsS -X OPTIONS http://127.0.0.1:8081/files/ -H 'Tus-Resumable: 1.0.0' -o /dev/null && break; sleep 1; done
          node run.mjs upload-resume --dry-run
