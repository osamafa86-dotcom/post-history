name: acceptance

on:
  push:
    branches: [main]
    paths-ignore: ['docs/security/**', 'docs/ops/**']
  pull_request:
    paths-ignore: ['docs/security/**', 'docs/ops/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    name: acceptance (unit tests, results gate, conformance, upload-resume vs tusd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/acceptance/package-lock.json
      - name: Install
        working-directory: tools/acceptance
        run: npm ci
      # Majors are held back in Dependabot until after the field trial: gate high-severity advisories here.
      - name: Audit runtime dependencies (high and above)
        working-directory: tools/acceptance
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests (scripts against mock servers, detectors, conformance, field cards)
        working-directory: tools/acceptance
        run: npm test
      - name: Every measurement result file (schema, naming, honesty, no revealing data)
        working-directory: tools/acceptance
        run: node validate-results.mjs
      - name: Form conformance (forms against upload-form.json, reference vs expectations)
        working-directory: tools/acceptance
        run: node form-conformance/run.mjs
      - name: Unified acceptance report (job summary; the gate reads this table)
        working-directory: tools/acceptance
        run: node report.mjs --summary
      - name: Static pii-leak and tenant-isolation (no result file written)
        working-directory: tools/acceptance
        run: node run.mjs pii-leak tenant-isolation dynamic-fields --dry-run
      - name: Start tusd (official image, file store; the compose tusd needs MinIO and the API hooks)
        run: |
          docker run -d --name tusd -p 8080:8080 tusproject/tusd:v2.10.1 -port=8080 -base-path=/files/
          for i in $(seq 1 30); do
            curl -fsS -X OPTIONS http://127.0.0.1:8080/files/ -H 'Tus-Resumable: 1.0.0' -o /dev/null && exit 0
            sleep 1
          done
          docker logs tusd
          exit 1
      - name: upload-resume against tusd (64 MiB, three interruptions)
        working-directory: tools/acceptance
        env:
          UPLOAD_ENDPOINT: http://127.0.0.1:8080/files/
          UPLOAD_SIZE_MB: "64"
        run: node run.mjs upload-resume --dry-run

  live:
    name: "live acceptance (API + Postgres - pii-leak, tenant-isolation, idempotency, tusd hook, receipt-notification)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: posthistory_test
          POSTGRES_USER: posthistory
          POSTGRES_PASSWORD: ci-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U posthistory -d posthistory_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://posthistory:ci-only@localhost:5432/posthistory_test
      LIVE_REDIS_URL: redis://127.0.0.1:6379
      LIVE_S3_ENDPOINT: http://127.0.0.1:9000
      LIVE_S3_ACCESS_KEY: minio-ci
      LIVE_S3_SECRET_KEY: ci-only-minio-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Start MinIO (the image compose pins, ADR 0004)
        run: |
          docker run -d --name minio --network host -e MINIO_ROOT_USER="$LIVE_S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$LIVE_S3_SECRET_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/live -o /dev/null && exit 0; sleep 1; done
          docker logs minio
          exit 1
      - name: Build the API and migrate the database
        working-directory: apps/api
        run: |
          npm ci
          src/db/migrate.sh up
          npm run build
      - name: Install the acceptance tools
        working-directory: tools/acceptance
        run: npm ci
      - name: Live run (the API starts with throwaway secrets; nothing is written to docs/measurements)
        working-directory: tools/acceptance
        run: node live/run.mjs --dry-run
      - name: upload-resume against tusd on S3 with downloads disabled (hash read from MinIO, as in compose)
        working-directory: tools/acceptance
        env:
          UPLOAD_ENDPOINT: http://127.0.0.1:8081/files/
          UPLOAD_SIZE_MB: "64"
          UPLOAD_S3_ENDPOINT: ${{ env.LIVE_S3_ENDPOINT }}
          UPLOAD_S3_ACCESS_KEY: ${{ env.LIVE_S3_ACCESS_KEY }}
          UPLOAD_S3_SECRET_KEY: ${{ env.LIVE_S3_SECRET_KEY }}
          UPLOAD_S3_BUCKET: tusd-ci
          UPLOAD_S3_PREFIX: tus/
        run: |
          node -e "import('./lib/s3.mjs').then(async (m) => { await m.s3FromEnv(process.env, 'UPLOAD_S3').ensureBucket('tusd-ci'); })"
          docker run -d --name tusd-s3 --network host -e AWS_ACCESS_KEY_ID="$UPLOAD_S3_ACCESS_KEY" -e AWS_SECRET_ACCESS_KEY="$UPLOAD_S3_SECRET_KEY" -e AWS_REGION=us-east-1 \
            tusproject/tusd:v2.10.1 -port=8081 -base-path=/files/ -s3-bucket=tusd-ci -s3-endpoint="$UPLOAD_S3_ENDPOINT" -s3-object-prefix=tus/ \
            -s3-part-size=8388608 -s3-min-part-size=8388608 -disable-download
          for i in $(seq 1 30); do curl -fsS -X OPTIONS http://127.0.0.1:8081/files/ -H 'Tus-Resumable: 1.0.0' -o /dev/null && break; sleep 1; done
          node run.mjs upload-resume --dry-run

  media-e2e:
    name: "media e2e (full compose stack: upload, worker, proxy, hostile files)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the acceptance tools and FFmpeg (the synthetic clips are made on the runner)
        run: |
          (cd tools/acceptance && npm ci --no-audit --no-fund)
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Compose environment with random secrets and the external verifier
        run: |
          cp infra/compose/.env.example infra/compose/.env
          sed -i -e "s/^TUSD_HOOK_SECRET=.*/TUSD_HOOK_SECRET=$(openssl rand -hex 32)/" \
                 -e "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" \
                 -e "s|^FIELD_ENCRYPTION_KEY=.*|FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)|" \
                 -e "s/^MEDIA_WORKER_TOKEN=.*/MEDIA_WORKER_TOKEN=$(openssl rand -hex 32)/" \
                 -e "s/^UPLOAD_VERIFIER=.*/UPLOAD_VERIFIER=external/" \
                 -e "s/^S3_MEDIA_ACCESS_KEY=.*/S3_MEDIA_ACCESS_KEY=media-worker-ci/" \
                 -e "s/^S3_MEDIA_SECRET_KEY=.*/S3_MEDIA_SECRET_KEY=$(openssl rand -hex 16)/" \
                 -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
                 -e "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 16)/" \
                 -e "s/^S3_SECRET_KEY=.*/S3_SECRET_KEY=$(openssl rand -hex 16)/" infra/compose/.env
      - name: Start the stack (API from source, tusd, MinIO, Redis, Postgres, media worker)
        run: docker compose -f infra/compose/docker-compose.yml --profile api --profile media up -d --wait --build
      - name: Media pipeline end to end (results are printed and kept as an artifact; nothing is written to docs/measurements)
        run: |
          set -a; . infra/compose/.env; set +a
          mkdir -p "$RUNNER_TEMP/out"
          export MEDIA_E2E_API_URL="http://127.0.0.1:$API_PORT/v1" MEDIA_E2E_TUS_URL="http://127.0.0.1:$TUSD_PORT/files/"
          export DATABASE_URL="postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB"
          export S3_ENDPOINT="http://127.0.0.1:$S3_PORT" S3_REGION=us-east-1
          export MEDIA_E2E_LOGS_CMD="docker compose -f infra/compose/docker-compose.yml --profile api --profile media logs --no-color media-worker"
          export MEDIA_E2E_ENV_LABEL="compose on a GitHub-hosted runner: api + tusd + minio + redis + media-worker"
          node tools/acceptance/scripts/media-e2e.mjs --out-dir="$RUNNER_TEMP/out"
      - name: Print the result files (committed to docs/measurements/acceptance/ as written here)
        if: always()
        run: for f in "$RUNNER_TEMP"/out/*.json; do [ -f "$f" ] && { echo "== $(basename "$f")"; cat "$f"; }; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: media-e2e-results
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 14
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --profile api --profile media logs --no-color --tail 200 api media-worker tusd
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml --profile api --profile media down -v
