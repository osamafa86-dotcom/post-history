name: acceptance

on:
  pull_request:
    paths-ignore: ['docs/security/**', 'docs/ops/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Core-gate acceptance (reservation-conflict, optimistic-concurrency, admin-quorum, notification-delivery, download-url) against the
  # server work of #69 and #75, now on main. "0" turns the five back into PENDING (they print it and write nothing).
  CORE_ACCEPTANCE: "1"
  # Local transcription worker (workers/ai, ADR 0020): transcript-draft runs in media e2e with the ai profile, the worker on the production
  # model (faster-whisper large-v3-turbo) with AI_ENABLE_TRANSCRIPT=true. "0" leaves the ai profile out and skips the step.
  AI_ENABLE_TRANSCRIPT: "1"
  # Admin notification rules and real escalation (contract v0.2, #98): notification-delivery creates rules, waits one escalation step (60 s, the
  # contract minimum) and deletes them. On since #98 is on main.
  RULES_ACCEPTANCE: "1"

jobs:
  changes:
    name: changes (which parts of the repository this change touches)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      live: ${{ steps.f.outputs.live }}
      media_e2e: ${{ steps.f.outputs.media_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # a pull_request run is a merge commit: HEAD^1..HEAD is the PR's own change (.github/scripts/changed-paths.sh); a push answers true for everything
      - id: f
        run: |
          .github/scripts/changed-paths.sh \
          live='^(apps/api/|apps/web/|contracts/|tools/acceptance/|\.github/(workflows/acceptance\.yml|scripts/))' \
          media_e2e='^(workers/media/|workers/ai/|apps/api/|tools/acceptance/|infra/compose/|infra/ai/|infra/minio/|\.github/(workflows/acceptance\.yml|scripts/))'

  acceptance:
    name: acceptance (unit tests, results gate, conformance, upload-resume vs tusd)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/acceptance/package-lock.json
      - name: Install
        working-directory: tools/acceptance
        run: npm ci
      # Majors are held back in Dependabot until after the field trial: gate high-severity advisories here.
      - name: Audit runtime dependencies (high and above)
        working-directory: tools/acceptance
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests (scripts against mock servers, detectors, conformance, field cards)
        working-directory: tools/acceptance
        run: npm test
      - name: Every measurement result file (schema, naming, honesty, no revealing data)
        working-directory: tools/acceptance
        run: node validate-results.mjs
      - name: Form conformance (forms against upload-form.json, reference vs expectations)
        working-directory: tools/acceptance
        run: node form-conformance/run.mjs
      - name: Unified acceptance report (job summary; the gate reads this table)
        working-directory: tools/acceptance
        run: node report.mjs --summary
      - name: Static pii-leak and tenant-isolation (no result file written)
        working-directory: tools/acceptance
        run: node run.mjs pii-leak tenant-isolation dynamic-fields --dry-run
      - name: Start tusd (official image, file store; the compose tusd needs MinIO and the API hooks)
        run: |
          docker run -d --name tusd -p 8080:8080 tusproject/tusd:v2.10.1 -port=8080 -base-path=/files/
          for i in $(seq 1 30); do
            curl -fsS -X OPTIONS http://127.0.0.1:8080/files/ -H 'Tus-Resumable: 1.0.0' -o /dev/null && exit 0
            sleep 1
          done
          docker logs tusd
          exit 1
      - name: upload-resume against tusd (64 MiB, three interruptions)
        working-directory: tools/acceptance
        env:
          UPLOAD_ENDPOINT: http://127.0.0.1:8080/files/
          UPLOAD_SIZE_MB: "64"
        run: node run.mjs upload-resume --dry-run

  live:
    name: "live acceptance (API + Postgres - pii-leak, tenant-isolation, idempotency, tusd hook, receipt-notification)"
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.live == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: posthistory_test
          POSTGRES_USER: posthistory
          POSTGRES_PASSWORD: ci-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U posthistory -d posthistory_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://posthistory:ci-only@localhost:5432/posthistory_test
      LIVE_REDIS_URL: redis://127.0.0.1:6379
      LIVE_S3_ENDPOINT: http://127.0.0.1:9000
      LIVE_S3_ACCESS_KEY: minio-ci
      LIVE_S3_SECRET_KEY: ci-only-minio-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Start MinIO (the image compose pins, ADR 0004)
        run: |
          docker run -d --name minio --network host -e MINIO_ROOT_USER="$LIVE_S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$LIVE_S3_SECRET_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9000/minio/health/live -o /dev/null && exit 0; sleep 1; done
          docker logs minio
          exit 1
      - name: Build the API and migrate the database
        working-directory: apps/api
        run: |
          npm ci
          src/db/migrate.sh up
          npm run build
      - name: Install the acceptance tools
        working-directory: tools/acceptance
        run: npm ci
      - name: Web client result on the shared form cases (the file the dynamic-fields gate judges)
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          node --import tsx scripts/form-conformance.ts
      - name: Live run (the API starts with throwaway secrets; nothing is written to docs/measurements)
        working-directory: tools/acceptance
        env:
          DYN_PLATFORM_FILES: ${{ github.workspace }}/apps/web/.artifacts/web.json
        run: |
          set -o pipefail
          node live/run.mjs --dry-run 2>&1 | tee "$RUNNER_TEMP/live.log"
      - name: dynamic-fields gate judged the web client and the live server together (ios and android join when their files are handed over)
        run: |
          grep -E "^reference 57/57; platforms: web 57/57$" "$RUNNER_TEMP/live.log"
          grep -E "^dynamic-fields +partial$" "$RUNNER_TEMP/live.log"
      - name: upload-resume against tusd on S3 with downloads disabled (hash read from MinIO, as in compose)
        working-directory: tools/acceptance
        env:
          UPLOAD_ENDPOINT: http://127.0.0.1:8081/files/
          UPLOAD_SIZE_MB: "64"
          UPLOAD_S3_ENDPOINT: ${{ env.LIVE_S3_ENDPOINT }}
          UPLOAD_S3_ACCESS_KEY: ${{ env.LIVE_S3_ACCESS_KEY }}
          UPLOAD_S3_SECRET_KEY: ${{ env.LIVE_S3_SECRET_KEY }}
          UPLOAD_S3_BUCKET: tusd-ci
          UPLOAD_S3_PREFIX: tus/
        run: |
          node -e "import('./lib/s3.mjs').then(async (m) => { await m.s3FromEnv(process.env, 'UPLOAD_S3').ensureBucket('tusd-ci'); })"
          docker run -d --name tusd-s3 --network host -e AWS_ACCESS_KEY_ID="$UPLOAD_S3_ACCESS_KEY" -e AWS_SECRET_ACCESS_KEY="$UPLOAD_S3_SECRET_KEY" -e AWS_REGION=us-east-1 \
            tusproject/tusd:v2.10.1 -port=8081 -base-path=/files/ -s3-bucket=tusd-ci -s3-endpoint="$UPLOAD_S3_ENDPOINT" -s3-object-prefix=tus/ \
            -s3-part-size=8388608 -s3-min-part-size=8388608 -disable-download
          for i in $(seq 1 30); do curl -fsS -X OPTIONS http://127.0.0.1:8081/files/ -H 'Tus-Resumable: 1.0.0' -o /dev/null && break; sleep 1; done
          node run.mjs upload-resume --dry-run

  media-e2e:
    name: "media e2e (full compose stack: upload, worker, proxy, hostile files)"
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    timeout-minutes: 40  # the ai profile fetches the production weights (1.6 GB) and transcribes six clips
    needs: changes
    if: needs.changes.outputs.media_e2e == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the acceptance tools and FFmpeg (the synthetic clips are made on the runner)
        run: |
          (cd tools/acceptance && npm ci --no-audit --no-fund)
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Compose environment with random secrets and the external verifier
        run: |
          cp infra/compose/.env.example infra/compose/.env
          sed -i -e "s/^TUSD_HOOK_SECRET=.*/TUSD_HOOK_SECRET=$(openssl rand -hex 32)/" \
                 -e "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" \
                 -e "s|^FIELD_ENCRYPTION_KEY=.*|FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)|" \
                 -e "s/^MEDIA_WORKER_TOKEN=.*/MEDIA_WORKER_TOKEN=$(openssl rand -hex 32)/" \
                 -e "s/^UPLOAD_VERIFIER=.*/UPLOAD_VERIFIER=external/" \
                 -e "s|^S3_PUBLIC_ENDPOINT=.*|S3_PUBLIC_ENDPOINT=http://127.0.0.1:9000|" \
                 -e "s/^AI_WORKER_TOKEN=.*/AI_WORKER_TOKEN=$(openssl rand -hex 32)/" \
                 -e "s/^S3_AI_ACCESS_KEY=.*/S3_AI_ACCESS_KEY=ai-worker-ci/" \
                 -e "s/^S3_AI_SECRET_KEY=.*/S3_AI_SECRET_KEY=$(openssl rand -hex 16)/" \
                 -e "s/^S3_MEDIA_ACCESS_KEY=.*/S3_MEDIA_ACCESS_KEY=media-worker-ci/" \
                 -e "s/^S3_MEDIA_SECRET_KEY=.*/S3_MEDIA_SECRET_KEY=$(openssl rand -hex 16)/" \
                 -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
                 -e "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 16)/" \
                 -e "s/^S3_SECRET_KEY=.*/S3_SECRET_KEY=$(openssl rand -hex 16)/" infra/compose/.env
      - name: Start the stack (API from source, tusd, MinIO, Redis, Postgres, media worker)
        run: |
          profiles="--profile api --profile media"
          # The worker reads "true" from .env (workers/ai Config); the workflow switch is "1".
          if [ "$AI_ENABLE_TRANSCRIPT" = 1 ]; then
            profiles="$profiles --profile ai"; sed -i "s/^AI_ENABLE_TRANSCRIPT=.*/AI_ENABLE_TRANSCRIPT=true/" infra/compose/.env
            # Every CPU the runner has for the worker (the media worker is done before each transcription starts). Docker
            # refuses more than the host has; this repository's hosted runner has two, on which large-v3-turbo ran at
            # 1.8-2.2x real time (#116).
            sed -i "s/^AI_WORKER_CPUS=.*/AI_WORKER_CPUS=$(nproc)/" infra/compose/.env
          fi
          unset AI_ENABLE_TRANSCRIPT  # compose prefers the shell to .env: let .env decide
          docker compose -f infra/compose/docker-compose.yml $profiles up -d --wait --build
      - name: Media pipeline end to end (results are printed and kept as an artifact; nothing is written to docs/measurements)
        run: |
          set -a; . infra/compose/.env; set +a
          mkdir -p "$RUNNER_TEMP/out"
          export MEDIA_E2E_API_URL="http://127.0.0.1:$API_PORT/v1" MEDIA_E2E_TUS_URL="http://127.0.0.1:$TUSD_PORT/files/"
          export DATABASE_URL="postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB"
          export S3_ENDPOINT="http://127.0.0.1:$S3_PORT" S3_REGION=us-east-1
          export MEDIA_E2E_LOGS_CMD="docker compose -f infra/compose/docker-compose.yml --profile api --profile media logs --no-color media-worker"
          export MEDIA_E2E_ENV_LABEL="compose on a GitHub-hosted runner: api + tusd + minio + redis + media-worker"
          node tools/acceptance/scripts/media-e2e.mjs --out-dir="$RUNNER_TEMP/out"
      # The export package built by the worker's own code (workers/media/src, the runner's FFmpeg) from synthetic phone and HDR clips.
      - name: cut-export (editing package: streams, rotation, HDR tags, cut points, sequences, no revealing tags; always partial)
        run: node tools/acceptance/scripts/cut-export.mjs --dry-run
      # The link lives 10 minutes by contract: waiting for it to expire (DL_WAIT_EXPIRY=1) is left out of the PR run, so the result is
      # `partial` for that reason alone; run the script by hand with DL_WAIT_EXPIRY=1 for the full check.
      - name: download-url (core gate; signed link for verified derivatives, original is 404)
        if: env.CORE_ACCEPTANCE == '1'
        working-directory: tools/acceptance
        run: |
          set -a; . ../../infra/compose/.env; set +a
          export DL_API_URL="http://127.0.0.1:$API_PORT/v1" DL_TUS_URL="http://127.0.0.1:$TUSD_PORT/files/"
          export DATABASE_URL="postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB"
          export DL_TOKENS="$(node -e "import('./live/seed.mjs').then(async (m) => { const s = await m.seed({ databaseUrl: process.env.DATABASE_URL, apiUrl: process.env.DL_API_URL }); console.log(JSON.stringify({ reporter: s.allTokens.reporter, reporter_b: s.allTokens.reporter_b })); })")"
          ACCEPTANCE_RESULTS_DIR="$RUNNER_TEMP/out" node scripts/download-url.mjs
      - name: transcript-draft (the local transcription worker end to end; skipped until AI_ENABLE_TRANSCRIPT is "1")
        if: env.AI_ENABLE_TRANSCRIPT == '1'
        working-directory: tools/acceptance
        run: |
          # real public Arabic speech, sha256-pinned (the 243 MB archive is downloaded and verified per run; no cache action is pinned in this repo yet); the p95 ratio is information here (shared runner), judged only with TD_TARGET_HOST on the trial host
          export TD_SPEECH_FILE="$(node lib/speech-pin.mjs "$HOME/.cache/td-speech")"
          set -a; . ../../infra/compose/.env; set +a
          export TD_API_URL="http://127.0.0.1:$API_PORT/v1" TD_TUS_URL="http://127.0.0.1:$TUSD_PORT/files/"
          export DATABASE_URL="postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB"
          export TD_TOKENS="$(node -e "import('./live/seed.mjs').then(async (m) => { const s = await m.seed({ databaseUrl: process.env.DATABASE_URL, apiUrl: process.env.TD_API_URL }); console.log(JSON.stringify({ reporter: s.allTokens.reporter })); })")"
          export AI_ENABLE_TRANSCRIPT=1  # .env holds the worker's "true"; the script's switch is "1"
          export TD_EGRESS_CMD="docker compose -f ../../infra/compose/docker-compose.yml --profile api --profile media --profile ai exec -T ai-worker python3 -c \"import socket; socket.create_connection(('1.1.1.1', 443), 3)\""
          ACCEPTANCE_RESULTS_DIR="$RUNNER_TEMP/out" node scripts/transcript-draft.mjs
      - name: Remote session revocation (SEC-01; time to the first refusal on the API and on the upload path)
        run: |
          set -a; . infra/compose/.env; set +a
          export REVOKE_API_URL="http://127.0.0.1:$API_PORT/v1" REVOKE_TUS_URL="http://127.0.0.1:$TUSD_PORT/files/"
          export DATABASE_URL="postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB"
          export REVOKE_ENV_LABEL="compose on a GitHub-hosted runner: api + tusd + minio + redis + postgres"
          node tools/acceptance/scripts/session-revocation.mjs --out-dir="$RUNNER_TEMP/out"
      - name: Field-trial pack rehearsal (the same command a trial host gets, against this stack)
        run: |
          set -a; . infra/compose/.env; set +a
          export DATABASE_URL="postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB"
          FT_ACCOUNTS="$(API_URL="http://127.0.0.1:$API_PORT/v1" node tools/acceptance/field-trial/rehearsal-accounts.mjs)"
          export FT_ACCOUNTS FT_TUS_URL="http://127.0.0.1:$TUSD_PORT/files/"
          node tools/acceptance/run.mjs --target "http://127.0.0.1:$API_PORT" --confirm --out-dir="$RUNNER_TEMP/pack"
      - name: Print the pack report
        if: always()
        run: '[ -f "$RUNNER_TEMP/pack/REPORT.md" ] && head -60 "$RUNNER_TEMP/pack/REPORT.md" || true'
      - name: Print the result files (committed to docs/measurements/acceptance/ as written here)
        if: always()
        run: for f in "$RUNNER_TEMP"/out/*.json; do [ -f "$f" ] && { echo "== $(basename "$f")"; cat "$f"; }; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: media-e2e-results
          path: |
            ${{ runner.temp }}/out
            ${{ runner.temp }}/pack
          if-no-files-found: ignore
          retention-days: 14
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --profile api --profile media --profile ai logs --no-color --timestamps --tail 3000 api media-worker tusd ai-worker
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml --profile api --profile media --profile ai down -v
