name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: contracts (openapi + json schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Lint OpenAPI, compile schemas, validate examples
        run: contracts/scripts/check.sh

  db:
    name: db (migrations up/down + smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: posthistory_test
          POSTGRES_USER: posthistory
          POSTGRES_PASSWORD: ci-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U posthistory -d posthistory_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Migrate up, smoke test, down, up
        env:
          DATABASE_URL: postgres://posthistory:ci-only@localhost:5432/posthistory_test
        run: apps/api/src/db/scripts/check.sh

  api:
    name: api (typecheck, unit, integration on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: posthistory_test
          POSTGRES_USER: posthistory
          POSTGRES_PASSWORD: ci-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U posthistory -d posthistory_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://posthistory:ci-only@localhost:5432/posthistory_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Migrate up (existing migrations as-is)
        run: src/db/migrate.sh up
      - name: Drizzle schema matches migrations (ADR 0001)
        run: scripts/check-drizzle-schema.sh
      - name: Typecheck (types generated from contracts/openapi.yaml)
        run: npm run typecheck
      - name: Unit and integration tests with coverage report
        run: npm run test:coverage
      - name: Build
        run: npm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists PR commits via the API: needs pull-requests:read. Comments disabled (least privilege).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate docker compose file
        run: |
          cp infra/compose/.env.example infra/compose/.env
          docker compose -f infra/compose/docker-compose.yml config > /dev/null
