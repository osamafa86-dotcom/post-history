name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes (which parts of the repository this change touches)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.f.outputs.web }}
      db: ${{ steps.f.outputs.db }}
      api: ${{ steps.f.outputs.api }}
      compose: ${{ steps.f.outputs.compose }}
      media: ${{ steps.f.outputs.media }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # a pull_request run is a merge commit: HEAD^1..HEAD is the PR's own change (.github/scripts/changed-paths.sh); a push answers true for everything
      - id: f
        run: |
          .github/scripts/changed-paths.sh \
          web='^(apps/web/|contracts/|tools/acceptance/form-conformance/|\.github/(workflows/ci\.yml|scripts/))' \
          db='^(apps/api/src/db/|tools/acceptance/|contracts/|\.github/(workflows/ci\.yml|scripts/))' \
          api='^(apps/api/|contracts/|infra/compose/docker-compose\.yml|\.github/(workflows/ci\.yml|scripts/))' \
          compose='^(infra/|apps/api/|workers/media/|tools/acceptance/|\.github/(workflows/ci\.yml|scripts/))' \
          media='^(workers/media/|tools/render-bench/|infra/compose/|\.github/(workflows/ci\.yml|scripts/))'

  web:
    name: web (lint, types, contracts, forms, BFF and browser)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.web == 'true'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WEB_TEST_REDIS_URL: redis://127.0.0.1:6379/1
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated client matches the frozen contract
        run: npm run check:client
      - name: Shared form conformance (web against the same 57-case oracle)
        run: |
          npm ci --prefix ../../tools/acceptance --no-audit --no-fund
          npm run test:conformance
      - run: npm run build
      - name: Browser and BFF tests on synthetic data
        run: |
          npx playwright install --with-deps chromium --only-shell
          npm run test:e2e
      - name: Web measurements match measurement.json
        run: node scripts/validate-measurements.mjs

  contracts:
    name: contracts (openapi + json schemas)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Lint OpenAPI, compile schemas, validate examples
        run: contracts/scripts/check.sh

  db:
    name: db (migrations up/down + smoke test)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.db == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: posthistory_test
          POSTGRES_USER: posthistory
          POSTGRES_PASSWORD: ci-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U posthistory -d posthistory_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Migrate up, smoke test, down, up
        env:
          DATABASE_URL: postgres://posthistory:ci-only@localhost:5432/posthistory_test
        run: apps/api/src/db/scripts/check.sh
      - name: Restore check (pg_dump, then pg_restore into a new database; row counts compared per table)
        env:
          DATABASE_URL: postgres://posthistory:ci-only@localhost:5432/posthistory_test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          # smoke.sql rolls back; committing it leaves the seeded rows the restore has to bring back
          sed 's/^ROLLBACK;$/COMMIT;/' apps/api/src/db/tests/smoke.sql | psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f -
          (cd tools/acceptance && npm ci --no-audit --no-fund)
          mkdir -p "$RUNNER_TEMP/out"
          export RESTORE_DATABASE_URL="$DATABASE_URL" RESTORE_ENV_LABEL="postgres 16 service on a GitHub-hosted runner: pg_dump -Fc then pg_restore into a new database"
          node tools/acceptance/scripts/recovery.mjs --out-dir="$RUNNER_TEMP/out"
          for f in "$RUNNER_TEMP"/out/*.json; do echo "== $(basename "$f")"; cat "$f"; done

  api:
    name: api (typecheck, unit, integration on Postgres and Redis)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    timeout-minutes: 25
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.api == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: posthistory_test
          POSTGRES_USER: posthistory
          POSTGRES_PASSWORD: ci-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U posthistory -d posthistory_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://posthistory:ci-only@localhost:5432/posthistory_test
      REDIS_URL: redis://localhost:6379
      # S3 adapter integration test against the pinned MinIO image (ADR 0004); started in a step below
      # because job services cannot pass MinIO's "server /data" command.
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_ACCESS_KEY: ci-minio
      S3_TEST_SECRET_KEY: ci-minio-secret
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      # Majors are held back in Dependabot until after the field trial: gate high-severity advisories here.
      - name: Audit runtime dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Start MinIO (same image and digest as infra/compose)
        run: |
          image="$(sed -n 's/^ *image: \(pgsty\/minio:.*\)$/\1/p' ../../infra/compose/docker-compose.yml)"
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_TEST_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_TEST_SECRET_KEY" \
            "$image" server /data
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/ready && exit 0; sleep 1; done
          docker logs minio; exit 1
      - name: Migrate up (existing migrations as-is)
        run: src/db/migrate.sh up
      - name: Drizzle schema matches migrations (ADR 0001)
        run: scripts/check-drizzle-schema.sh
      - name: Typecheck (types generated from contracts/openapi.yaml)
        run: npm run typecheck
      - name: Unit and integration tests with coverage report
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Contract coverage (warning only)
        run: npm run contract:coverage

  compose:
    name: compose (config, pull, smoke)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.compose == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Images pinned by digest (ADR 0004)
        run: infra/compose/check-pinned.sh
      - name: Trial host bootstrap and update, dry run in Ubuntu 24.04 without network (ADR 0013)
        run: infra/deploy/test-dry-run.sh
      - name: Validate docker compose file
        run: |
          cp infra/compose/.env.example infra/compose/.env
          sed -i -e "s/^TUSD_HOOK_SECRET=.*/TUSD_HOOK_SECRET=$(openssl rand -hex 32)/" \
                 -e "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" \
                 -e "s|^FIELD_ENCRYPTION_KEY=.*|FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)|" \
                 -e "s/^S3_MEDIA_ACCESS_KEY=.*/S3_MEDIA_ACCESS_KEY=media-worker-ci/" \
                 -e "s/^S3_MEDIA_SECRET_KEY=.*/S3_MEDIA_SECRET_KEY=$(openssl rand -hex 16)/" \
                 -e "s/^S3_AI_ACCESS_KEY=.*/S3_AI_ACCESS_KEY=ai-worker-ci/" \
                 -e "s/^S3_AI_SECRET_KEY=.*/S3_AI_SECRET_KEY=$(openssl rand -hex 16)/" \
                 -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
                 -e "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 16)/" \
                 -e "s/^S3_SECRET_KEY=.*/S3_SECRET_KEY=$(openssl rand -hex 16)/" infra/compose/.env
          docker compose -f infra/compose/docker-compose.yml config -q
          docker compose -f infra/compose/docker-compose.yml --profile api config -q
          docker compose -f infra/compose/docker-compose.yml --profile api --profile media config -q
      # Fails on a tag or digest that does not exist in the registry (ADR 0004).
      - name: Pull images
        run: docker compose -f infra/compose/docker-compose.yml --profile api pull -q
      - name: Smoke test (tusd only via proxy, hook token kept out of logs and responses)
        run: infra/compose/smoke.sh
      - name: Media and AI worker storage users are least-privilege (ADR 0006, ADR 0019)
        run: infra/minio/check-media-policy.sh
      - name: Hook path end to end with the API (SEC-06)
        run: infra/compose/e2e-hooks.sh
      - name: Ingest gate accepts only short attestation tokens bound to the session (ADR 0011)
        run: infra/ingest/test-gate.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Concurrent creates with one upload token yield one upload (SEC-06)
        run: |
          (cd tools/acceptance && npm ci --no-audit --no-fund)
          set -a; . infra/compose/.env; set +a
          DATABASE_URL="postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@127.0.0.1:$POSTGRES_PORT/$POSTGRES_DB" \
          API_URL="http://127.0.0.1:$API_PORT/v1" TUS_URL="http://127.0.0.1:$TUSD_PORT/files/" \
            node infra/compose/e2e-duplicate-create.mjs
      - name: Server and ingest gate together, attestation in test mode, two-key rotation (ADR 0011, SEC-07)
        run: infra/ingest/e2e-attested.sh
      - name: Media worker hardened, on the media network only, reaches /internal/media (ADR 0006)
        run: infra/compose/smoke-media.sh
      - name: Self-hosted error tracking, Sentry-compatible (GlitchTip on 127.0.0.1, registration closed, ADR 0029)
        run: MEASURE_HOST="GitHub-hosted runner (ubuntu-24.04)" infra/observability/smoke-errors.sh
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml --profile api --profile media down -v --remove-orphans

  media:
    name: media (probe, sha256, proxy on synthetic files with FFmpeg 8)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    timeout-minutes: 25
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.media == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Tests run in the worker image itself, so CI uses the same pinned FFmpeg as production.
      - name: Build test image (Python 3.12 + FFmpeg 8.0.1, pinned by digest)
        run: docker build --target test -t media-worker:test workers/media
      # Real Redis and MinIO for the stream -> worker -> internal API -> derived bucket test (ADR 0006).
      - name: Start Redis and MinIO for the integration test
        run: |
          docker network create media-it
          docker run -d --name media-it-redis --network media-it redis:7-alpine
          docker run -d --name media-it-minio --network media-it -e MINIO_ROOT_USER=ci-access \
            -e MINIO_ROOT_PASSWORD=ci-only-secret pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for i in $(seq 1 30); do docker exec media-it-minio mc ready local >/dev/null 2>&1 && break; sleep 1; done
      - name: Pipeline, job and integration tests on synthetic VFR, gapped, offset and tagged clips
        run: |
          docker run --rm --network media-it -e MEDIA_IT_REQUIRED=1 -e MEDIA_IT_REDIS_URL=redis://media-it-redis:6379 \
            -e MEDIA_IT_S3_ENDPOINT=http://media-it-minio:9000 -e MEDIA_IT_S3_ACCESS_KEY=ci-access \
            -e MEDIA_IT_S3_SECRET_KEY=ci-only-secret media-worker:test python -m pytest -q -rs
      - name: Runtime image builds
        run: docker build --target runtime -t media-worker:runtime workers/media
      - name: Proxy A/V sync on synthetic marker clips (tools/render-bench)
        run: |
          docker run --rm -v "$PWD/tools/render-bench:/bench:ro" -w /bench -e PYTHONPATH=/app/src:/bench \
            media-worker:test python -m pytest -q -p no:cacheprovider test_av_sync.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Media and render-bench measurements match measurement.json
        run: |
          npx -y -p ajv-cli@5.0.0 -p ajv-formats@2.1.1 ajv validate --spec=draft2020 -c ajv-formats -s contracts/schemas/measurement.json -d "docs/measurements/media/*.json"
          npx -y -p ajv-cli@5.0.0 -p ajv-formats@2.1.1 ajv validate --spec=draft2020 -c ajv-formats -s contracts/schemas/measurement.json -d "docs/measurements/render-bench/*.json"
