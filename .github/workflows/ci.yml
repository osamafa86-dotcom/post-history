name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: contracts (openapi + json schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Lint OpenAPI, compile schemas, validate examples
        run: contracts/scripts/check.sh

  db:
    name: db (migrations up/down + smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: posthistory_test
          POSTGRES_USER: posthistory
          POSTGRES_PASSWORD: ci-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U posthistory -d posthistory_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Migrate up, smoke test, down, up
        env:
          DATABASE_URL: postgres://posthistory:ci-only@localhost:5432/posthistory_test
        run: apps/api/src/db/scripts/check.sh

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists PR commits via the API: needs pull-requests:read. Comments disabled (least privilege).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  compose:
    name: compose (config, pull, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate docker compose file
        run: |
          cp infra/compose/.env.example infra/compose/.env
          sed -i "s/^TUSD_HOOK_SECRET=.*/TUSD_HOOK_SECRET=$(openssl rand -hex 32)/" infra/compose/.env
          docker compose -f infra/compose/docker-compose.yml config -q
      # Fails on a tag or digest that does not exist in the registry (ADR 0004).
      - name: Pull images
        run: docker compose -f infra/compose/docker-compose.yml pull -q
      - name: Smoke test (tusd only via proxy, hook token kept out of logs and responses)
        run: infra/compose/smoke.sh
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v
