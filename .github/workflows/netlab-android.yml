name: netlab-android

# Stage (a) of field-network-upload for the Android upload core: the app's UploadEngine (apps/android/core) runs
# on the JVM (apps/android/netlab-runner) and is measured by tools/netlab/netlab.py --client-cmd through
# apps/android/netlab/measure.sh, so every metric, the python reference client run first under the same
# conditions (--reference-seconds), the MinIO checksum and the stage (a) verdict come from netlab (ADR 0007).
# - pull_request (Android core, the runner, the measurement script, netlab.py or this file changed): one short
#   scenario (office, 100 MB, 240 s, no reference) proves the runner still works and writes a valid result.
# - workflow_dispatch: the real measurement, one scenario or all three, each with its own size (field-weak at
#   ~40 kbit/s needs about 70 min for 20 MB; field-switch needs >= 300 MB to cross a scheduled disconnect).
# The result is never pass: partial when netlab's stage (a) rule holds, fail when it does not. The result JSON
# is printed, validated against contracts/schemas/measurement.json and uploaded as an artifact to commit to
# docs/measurements/netlab/ (no secrets or revealing data: synthetic file, local compose).
on:
  pull_request:
    paths:
      - "apps/android/core/**"
      - "apps/android/netlab/**"
      - "apps/android/netlab-runner/**"
      - "tools/netlab/netlab.py"
      - ".github/workflows/netlab-android.yml"
  workflow_dispatch:
    inputs:
      scenario:
        description: office | field-switch | field-weak | all
        default: all
      office_mb:
        description: file size for office (stage (a) is 100 MB)
        default: "100"
      field_switch_mb:
        description: file size for field-switch (>= 300 MB crosses the 180 s disconnect period)
        default: "300"
      field_weak_mb:
        description: file size for field-weak (~40 kbit/s; 20 MB is about 70 min)
        default: "20"
      max_seconds:
        description: time box per scenario for the measured client (GitHub job limit is 6h)
        default: "7200"
      reference_seconds:
        description: python reference client first, same conditions, up to this long (0 = no reference, no verdict)
        default: "1200"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-core:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    # Long measurements only when dispatched by hand; the PR smoke is capped to protect the Actions budget.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 350 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ github.event_name == 'pull_request' && fromJSON('["office"]') || (inputs.scenario == 'all' && fromJSON('["office","field-switch","field-weak"]') || fromJSON(format('["{0}"]', inputs.scenario))) }}
    env:
      NO_PROXY: 127.0.0.1,localhost
      SIZE_MB: ${{ github.event_name == 'pull_request' && '100' || (matrix.scenario == 'office' && inputs.office_mb || (matrix.scenario == 'field-switch' && inputs.field_switch_mb || inputs.field_weak_mb)) }}
      MAX_SECONDS: ${{ github.event_name == 'pull_request' && '240' || inputs.max_seconds }}
      REFERENCE_SECONDS: ${{ github.event_name == 'pull_request' && '0' || inputs.reference_seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Containers cannot load kernel modules: sch_netem must be loaded on the runner itself.
      - name: Load sch_netem
        run: |
          sudo modprobe sch_netem || {
            sudo apt-get update -q
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }
          lsmod | grep sch_netem
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Build the runner (generates the API client from contracts/openapi.yaml)
        run: apps/android/netlab/measure.sh build
      - name: Start compose with the netlab overlay
        run: |
          cp infra/compose/.env.example infra/compose/.env
          sed -i "s/^TUSD_HOOK_SECRET=.*/TUSD_HOOK_SECRET=$(openssl rand -hex 32)/" infra/compose/.env
          docker compose -f infra/compose/docker-compose.yml -f tools/netlab/compose.netlab.yml up -d --wait
      - name: Measure with the Android upload core (reference client first, then time-boxed)
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          apps/android/netlab/measure.sh measure "${{ matrix.scenario }}" "$SIZE_MB" "$MAX_SECONDS" "$REFERENCE_SECONDS" \
            "$RUNNER_TEMP/out/$(date -u +%F)-tusd-${{ matrix.scenario }}-${SIZE_MB}mb-android-core-gha.json"
      - name: Print and validate the result file (contracts/schemas/measurement.json)
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/out/*.json; do [ -f "$f" ] && { echo "== $(basename "$f")"; cat "$f"; }; done
          npm --prefix tools/acceptance ci --no-audit --no-fund
          node tools/acceptance/validate-results.mjs "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-upload-core-${{ matrix.scenario }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml -f tools/netlab/compose.netlab.yml down -v
