name: ios

on:
  push:
    branches: [main]
    paths: ["apps/ios/**", "contracts/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["apps/ios/**", "contracts/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

jobs:
  api-client:
    name: ios api client matches contracts/openapi.yaml
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Java 21 is preinstalled on ubuntu-latest; openapi-generator-cli downloads the pinned 7.26.0 jar.
      - name: Regenerate the Swift client (openapi-generator 7.26.0) and require no diff
        run: |
          apps/ios/scripts/generate-api.sh
          git diff --exit-code --stat -- apps/ios/Packages/PostHistoryKit/Sources/PostHistoryAPI

  package-linux:
    name: ios package (swift build + unit tests, Linux)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    container: swift:6.1-noble
    defaults:
      run:
        working-directory: apps/ios/Packages/PostHistoryKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build
      - name: Start tusd v2.10.1 (file store) for the live transport test
        run: |
          # the swift container ships without curl
          apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates > /dev/null
          curl -sSL -o /tmp/tusd.tgz https://github.com/tus/tusd/releases/download/v2.10.1/tusd_linux_amd64.tar.gz
          echo "e8c8d7738275d2d9377db953aecbc242262d3620e77fbd3c1491361d9cea6ac8  /tmp/tusd.tgz" | sha256sum -c -
          tar -xzf /tmp/tusd.tgz -C /tmp
          mkdir -p /tmp/tusd-data
          nohup /tmp/tusd_linux_amd64/tusd -port 8080 -upload-dir /tmp/tusd-data -base-path /files/ > /tmp/tusd.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -X OPTIONS http://127.0.0.1:8080/files/ -H 'Tus-Resumable: 1.0.0' -o /dev/null && exit 0
            sleep 1
          done
          cat /tmp/tusd.log; exit 1
      - name: Unit tests (resume scenarios, auth, form conformance) and live tusd transport test
        env:
          TUSD_URL: http://127.0.0.1:8080/files/
        run: swift test

  ios:
    name: ios (xcodebuild app + package unit tests, macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -version
      - name: Package unit tests
        working-directory: apps/ios/Packages/PostHistoryKit
        run: swift test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Form conformance (ios.json judged by the shared cases through run.mjs --compare)
        run: |
          (cd apps/ios/Packages/PostHistoryKit && swift run form-conformance ../../../../tools/acceptance/form-conformance/cases.json /tmp/ios.json)
          (cd tools/acceptance && npm ci --no-audit --no-fund && node form-conformance/run.mjs --compare=/tmp/ios.json)
      - name: Generate the Xcode project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build the app for the iOS simulator
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build -project PostHistory.xcodeproj -scheme PostHistory \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
