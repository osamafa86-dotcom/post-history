name: secrets

# Secret scanning runs on every push and pull request with no path filter: pasted values land in docs too.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moved to 26.04 (no postgresql-client-16, no Playwright headless shell)
    timeout-minutes: 20
    # gitleaks-action lists PR commits via the API: needs pull-requests:read. Comments disabled (least privilege).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      # The repository is public: no trial or production domain and no public server address in the operations files.
      - name: No domain or public address in the public repository
        run: infra/compose/check-no-hosts.sh
      # ADR 0051 condition 2: the WAL-G restore key (and every other private key) never enters the repository.
      - name: No private key in the repository
        run: infra/compose/check-no-private-keys.sh
      # Owner decision 2026-10-27 (#433, tools/leak-check.md): no domain, public address, email, coordinates, hash or secret
      # outside the scoped allow-list. Findings print file, line and kind only, never the value.
      - name: No revealing data in text outputs (leak-check)
        run: node tools/leak-check.mjs
