      summary: البحث في الكتالوج (ما يراه المشتري)
      description: >-
        الإدراجات `listed` وحدها. يعيد عرض المشتري (`CatalogItem`): عناوين ووصف ولقطات بلغتين، والمدة والدقة، ويوم التصوير
        والمحافظة، واسم الظهور بحسب وضعه، والعروض بأسعارها. لا إحداثيات ولا مدينة ولا معرّف مراسل ولا جهاز ولا حقول
        ديناميكية ولا مصادر. المشترون (`buyer_admin`، `buyer_member`) من مؤسسة `active`؛ غيرها `403 forbidden_scope`.
        البحث النصي بالعربية والإنجليزية.
