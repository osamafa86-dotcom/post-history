    get:
      tags: [uploads]
      summary: جلسة رفع كما يحتاجها عامل الوسائط (داخلي، ADR 0006)
      x-internal: true
      description: >-
        لا يعيد بصمة العميل؛ المقارنة في الخادم. فشل المصادقة أو العنوان `404` كبقية `/internal/*`؛ والجلسة غير
        الموجودة برمز صحيح `410 media_resource_gone`.
      operationId: mediaGetSession
      x-roles: []
      security: [{ mediaWorkerToken: [] }]
      responses:
        "200":
          description: الجلسة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaSession" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/MediaResourceGone" }

  /internal/media/sessions/{upload_session_id}/verification:
    servers:
      - url: http://api.internal:3000
        description: شبكة media الداخلية فقط (ADR 0006)
    parameters:
      - $ref: "#/components/parameters/MediaSessionId"
    post:
      tags: [uploads]
      summary: نتيجة تحقق العامل من الملف (داخلي، ADR 0006)
      x-internal: true
      description: >-
        الخادم يقفل الجلسة ويتحقق من الحجم مقابل الجلسة والتخزين ويقارن `client_sha256` بنفسه (`checksum_mismatch`
        قراره لا قرار العامل) ثم يسجّل التحقق والإيصال وحدث Outbox في معاملة واحدة. متساوٍ الأثر: جلسة قُضي فيها
        تعيد `200` بالنتيجة المسجلة إن وافقت و`409` إن خالفت.
      operationId: mediaPostVerification
      x-roles: []
      security: [{ mediaWorkerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaVerification" }
      responses:
        "200":
          description: النتيجة المسجلة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaVerificationResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/MediaResourceGone" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /internal/media/files/{file_id}:
    servers:
      - url: http://api.internal:3000
        description: شبكة media الداخلية فقط (ADR 0006)
    parameters:
      - name: file_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [uploads]
      summary: ملف مصدر كما يحتاجه العامل لمشتق عند الطلب (داخلي، v0.3)
