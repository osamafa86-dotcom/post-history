          uniqueItems: true
          description: >-
            ما يُسلَّم للمشتري. التفريغ والترجمة لا يُرخَّصان ولا يُصدَّران (threat-model §9.1، R11) حتى ADR للحجب الآلي
            للأسماء؛ `transcript` يُرفض `422`.
          items: { type: string, enum: [original, produced, audio, stills] }
        attribution:
          $ref: "#/components/schemas/LocalizedText"
        prohibitions:
          type: array
          uniqueItems: true
          description: المحظورات؛ `ai_training` محظور دائمًا إلا بإذن مستقل خارج القالب
          items: { type: string, enum: [resale, advertising, ai_training, re_editing] }
        base_price: { $ref: "#/components/schemas/Money" }
        enabled: { type: boolean }

    LicenseTemplateInput:
      description: جسم الطلب؛ لا خصائص غير المعرَّفة
      allOf:
        - $ref: "#/components/schemas/LicenseTemplateFields"
      unevaluatedProperties: false

    LicenseTemplate:
      allOf:
        - $ref: "#/components/schemas/LicenseTemplateFields"
        - type: object
          required: [id, version, created_at, created_by]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1, description: لا يُعدَّل إصدار قائم؛ الاستبدال يكتب إصدارًا جديدًا }
            created_at: { type: string, format: date-time }
            created_by: { type: string, format: uuid }
      unevaluatedProperties: false

    ListingState:
      type: string
      description: مستقلة عن الحالات الثلاث للمادة؛ `listed` يلزمها `rights_state = sellable`
      enum: [draft, listed, suspended]

    ListingOfferInput:
      type: object
      additionalProperties: false
      required: [license_template_id]
      properties:
        license_template_id: { type: string, format: uuid }
        price_override:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: سعر خاص بهذه المادة؛ `null` = السعر الأساسي للقالب

    CatalogListingFields:
      type: object
      required: [title, description, offers, state]
      properties:
        title: { $ref: "#/components/schemas/LocalizedText" }
        description: { $ref: "#/components/schemas/LocalizedText" }
        shot_list:
          type: array
          maxItems: 200
          default: []
          items:
            type: object
            additionalProperties: false
            required: [start_ms, label]
            properties:
              start_ms: { type: integer, minimum: 0 }
              label: { $ref: "#/components/schemas/LocalizedText" }
        offers:
          type: array
          minItems: 1
          maxItems: 10
          description: قالب واحد مرة واحدة على الأكثر؛ القالب المعطّل `422 validation_failed`
          items: { $ref: "#/components/schemas/ListingOfferInput" }
        commercial_allowed:
          type: boolean
          default: false
          description: يسمح عقد المادة بالترخيص التجاري؛ يضبطه مدير النظام وحده، وبدونه لا يُقبل عرض `commercial`
        state: { $ref: "#/components/schemas/ListingState" }

    CatalogListingInput:
      description: جسم الطلب؛ لا خصائص غير المعرَّفة
      allOf:
        - $ref: "#/components/schemas/CatalogListingFields"
      unevaluatedProperties: false

    CatalogListing:
      allOf:
        - $ref: "#/components/schemas/CatalogListingFields"
        - type: object
          required: [id, material_id, material_version, suspended_reason, listed_at, created_at, updated_at, updated_by]
          properties:
            id: { type: string, format: uuid }
            material_id: { type: string, format: uuid }
            material_version: { type: integer, minimum: 1, description: الإصدار المعروض للبيع؛ البيعة تجمّده }
            suspended_reason: { type: [string, "null"], enum: [manual, rights_changed, sensitive_flagged, null] }
            listed_at: { type: [string, "null"], format: date-time, description: أول انتقال إلى `listed` }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            updated_by: { type: string, format: uuid }
      unevaluatedProperties: false

    CatalogOffer:
      type: object
      required: [license_template_id, license_version, type, name, price]
      properties:
        license_template_id: { type: string, format: uuid }
        license_version: { type: integer, minimum: 1 }
        type: { $ref: "#/components/schemas/LicenseType" }
        name: { $ref: "#/components/schemas/LocalizedText" }
        price: { $ref: "#/components/schemas/Money" }

    CatalogItem:
      type: object
      description: >-
        ما يراه المشتري، بقائمة بيضاء مغلقة: لا إحداثيات ولا مدينة ولا معرّف مراسل ولا جهاز ولا حقول ديناميكية ولا مصادر،
        ويوم التصوير بلا ساعة.
      additionalProperties: false
      required: [listing_id, material_version, title, description, shot_list, material_types, governorate, shot_on, duration_ms, width, height, credit, offers, exclusive_available, listed_at]
      properties:
        listing_id: { type: string, format: uuid }
        material_version: { type: integer, minimum: 1 }
        title: { $ref: "#/components/schemas/LocalizedText" }
        description: { $ref: "#/components/schemas/LocalizedText" }
        shot_list:
          type: array
          items:
            type: object
            required: [start_ms, label]
            properties:
              start_ms: { type: integer, minimum: 0 }
              label: { $ref: "#/components/schemas/LocalizedText" }
        material_types:
          type: array
          items: { $ref: "#/components/schemas/MaterialType" }
        governorate: { type: string }
        shot_on: { type: [string, "null"], format: date }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        width: { type: [integer, "null"], minimum: 1 }
        height: { type: [integer, "null"], minimum: 1 }
        credit:
          type: string
          description: >-
            نسب المادة: اسم الشبكة، أو الاسم المعتمد للنشر إن اختار المراسل `real_name`. الاسم المستعار لا يدخل الكتالوج
            (`pseudonym` يُنسب للشبكة)، ولا `reporter_id`.
        offers:
          type: array
          items: { $ref: "#/components/schemas/CatalogOffer" }
        exclusive_available:
          type: boolean
          description: لا عرض حصري لمادة بيعت بترخيص غير حصري أو عليها حصرية نشطة أو محجوزة
        listed_at: { type: string, format: date-time }

    CatalogPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogItem" }
        next_cursor: { type: [string, "null"] }

    BuyerOrganizationStatus:
      type: string
      description: "`pending_verification` لا تشتري؛ `active` تشتري؛ `suspended` يوقف الشراء والتنزيل الجديد"
      enum: [pending_verification, active, suspended]

    BuyerOrganizationFields:
      type: object
      required: [legal_name, display_name, country, billing_email]
      properties:
        legal_name: { type: string, minLength: 1, maxLength: 200, description: الاسم القانوني على الفاتورة }
        display_name: { $ref: "#/components/schemas/LocalizedText" }
        country: { type: string, pattern: "^[A-Z]{2}$", description: بلد التسجيل (ISO 3166-1 alpha-2)، يحدد الفوترة والمزوّد }
        billing_email: { type: string, format: email, maxLength: 254 }
        seats: { type: integer, minimum: 1, maximum: 1000, default: 5, description: الحد الأعلى للأعضاء النشطين؛ يضبطه مدير النظام }
        status:
          $ref: "#/components/schemas/BuyerOrganizationStatus"

    BuyerOrganizationInput:
      description: جسم الطلب؛ لا خصائص غير المعرَّفة
      allOf:
        - $ref: "#/components/schemas/BuyerOrganizationFields"
      unevaluatedProperties: false

    BuyerOrganizationCreate:
      allOf:
        - $ref: "#/components/schemas/BuyerOrganizationFields"
        - type: object
          required: [first_admin_email]
          properties:
            first_admin_email: { type: string, format: email, maxLength: 254 }
      unevaluatedProperties: false

    BuyerOrganizationState:
      type: object
      required: [id, status, seats, active_members, verified_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        active_members: { type: integer, minimum: 0 }
        verified_at: { type: [string, "null"], format: date-time, description: أول انتقال إلى `active` }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BuyerOrganization:
      allOf:
        - $ref: "#/components/schemas/BuyerOrganizationFields"
        - $ref: "#/components/schemas/BuyerOrganizationState"
      unevaluatedProperties: false

    BuyerOrganizationCreated:
      description: رد الإنشاء وحده؛ يحمل رمز دعوة المدير الأول في الرد الأول، ولا يُعاد عند التكرار
      allOf:
        - $ref: "#/components/schemas/BuyerOrganizationFields"
        - $ref: "#/components/schemas/BuyerOrganizationState"
        - $ref: "#/components/schemas/BuyerInviteToken"
      unevaluatedProperties: false

    BuyerInviteToken:
      type: object
      properties:
        invite_token:
          type: string
          minLength: 32
          maxLength: 256
          description: >-
            رمز تعيين كلمة المرور للمدعو، كرمز الاستعادة (`RecoveryApproval.reset_token`): يُعاد مرة واحدة في رد الإنشاء الأول،
            ولا يُعاد عند التكرار بمفتاح منع التكرار، ولا يُسجَّل ولا يُخزَّن إلا ببصمته. يسلّمه المنشئ للمدعو خارج النظام. العميل
            يعرضه مرة ولا يحفظه ولا يضعه في الحافظة.
        invite_token_expires_at: { type: string, format: date-time, description: ≤ 24 ساعة من الإنشاء }
      dependentRequired:
        invite_token: [invite_token_expires_at]
        invite_token_expires_at: [invite_token]

    BuyerOrganizationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BuyerOrganization" }
        next_cursor: { type: [string, "null"] }

    BuyerRole:
      type: string
      enum: [buyer_admin, buyer_member]

    BuyerMemberInvite:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: "#/components/schemas/BuyerRole" }

    BuyerMemberUpdate:
      type: object
      additionalProperties: false
      required: [role, status]
      properties:
        role: { $ref: "#/components/schemas/BuyerRole" }
        status: { type: string, enum: [active, suspended] }

    BuyerMember:
      type: object
      required: [user_id, email, role, status, totp_enabled, created_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/BuyerRole" }
        status: { type: string, enum: [invited, active, suspended] }
        totp_enabled: { type: boolean }
        created_at: { type: string, format: date-time }

    OrderStatus:
      type: string
      description: >-
        `pending_payment` ينتظر الدفع حتى `expires_at`؛ `paid` أكده الإشعار الموقّع وصدرت تراخيصه؛ `cancelled` ألغاه المشتري
        أو أُلغي لضياع الحصرية أو تغيّر الحقوق قبل التأكيد؛ `expired` فات مهلته بلا دفع؛ `refunded` استُرد كاملًا (الجزء 5).
      enum: [pending_payment, paid, cancelled, expired, refunded]

    OrderItemInput:
      type: object
      additionalProperties: false
      required: [listing_id, license_template_id]
      properties:
        listing_id: { type: string, format: uuid }
        license_template_id: { type: string, format: uuid, description: قالب من عروض الإدراج؛ الإصدار الحالي يُجمَّد }

    OrderCreate:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: بند واحد لكل إدراج
          items: { $ref: "#/components/schemas/OrderItemInput" }
        expected_total:
          $ref: "#/components/schemas/Money"
          description: المجموع الذي رآه المشتري؛ إن لم يطابق `409 price_changed` بلا أثر

    OrderItem:
      type: object
      description: >-
        البند مجمّدًا كما وافق عليه المشتري. لا معرّف مادة ولا مراسل (كعرض الكتالوج)؛ العنوان نسخة من الإدراج لحظة الطلب.
      required: [id, listing_id, material_version, license_template_id, license_version, license_type, license_name, title, price, license_id]
      properties:
        id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        material_version: { type: integer, minimum: 1 }
        license_template_id: { type: string, format: uuid }
        license_version: { type: integer, minimum: 1 }
        license_type: { $ref: "#/components/schemas/LicenseType" }
        license_name: { $ref: "#/components/schemas/LocalizedText" }
        title: { $ref: "#/components/schemas/LocalizedText" }
        price: { $ref: "#/components/schemas/Money" }
        license_id: { type: [string, "null"], format: uuid, description: الترخيص الصادر بعد التأكيد }

    Order:
      type: object
      required: [id, organization_id, created_by, status, cancel_reason, total, items, expires_at, paid_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/OrderStatus" }
        cancel_reason: { type: [string, "null"], enum: [buyer, exclusivity_lost, rights_changed, null] }
        total: { $ref: "#/components/schemas/Money" }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderItem" }
        expires_at:
          type: string
          format: date-time
          description: مهلة الدفع؛ 15 دقيقة لطلب فيه بند حصري (حجزه)، و≤ 24 ساعة لغيره
        paid_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrderPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        next_cursor: { type: [string, "null"] }

    CheckoutSession:
      type: object
      required: [checkout_url, provider, expires_at]
      properties:
        checkout_url:
          type: string
          format: uri
          description: صفحة الدفع المستضافة لدى المزوّد؛ لا يُسجَّل ولا يُرسل في حدث أو إشعار
        provider: { type: string, pattern: "^[a-z_]{1,32}$", description: "قيمة من `PaymentProvider`: `sandbox` أو `stripe`" }
        expires_at: { type: string, format: date-time, description: لا تتجاوز مهلة الطلب }

    LicenseTerritory:
      type: object
      description: إقليم الترخيص كما في قالبه
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [worldwide, countries] }
        countries:
          type: array
          minItems: 1
          maxItems: 250
          uniqueItems: true
          description: رموز ISO 3166-1 alpha-2؛ إلزامية مع `countries` وممنوعة مع `worldwide`
          items: { type: string, pattern: "^[A-Z]{2}$" }

    LicenseTerms:
      type: object
      description: شروط إصدار القالب الذي وافق عليه المشتري، مجمّدة في الترخيص (لا السعر الأساسي ولا التفعيل)
      required: [type, name, terms, usage_media, territory, term_days, exclusivity_hours, deliverables, attribution, prohibitions]
      properties:
        type: { $ref: "#/components/schemas/LicenseType" }
        name: { $ref: "#/components/schemas/LocalizedText" }
        terms: { $ref: "#/components/schemas/LocalizedText" }
        usage_media:
          type: array
          items: { type: string, enum: [tv, web, social, documentary, advertising] }
        territory: { $ref: "#/components/schemas/LicenseTerritory" }
        term_days: { type: [integer, "null"], minimum: 1 }
        exclusivity_hours: { type: [integer, "null"], minimum: 24 }
        deliverables:
          type: array
          items: { type: string, enum: [original, produced, audio, stills] }
        attribution: { $ref: "#/components/schemas/LocalizedText" }
        prohibitions:
          type: array
          items: { type: string, enum: [resale, advertising, ai_training, re_editing] }

    LicenseStatus:
      type: string
      description: "`active` ساري؛ `expired` انتهت مدته؛ `revoked` أُبطل (استرداد أو سحب حقوق أو إداري) فيتوقف التنزيل"
      enum: [active, expired, revoked]

    License:
      type: object
      description: >-
        ترخيص صادر برقم فريد. لا يحمل معرّف المادة ولا المراسل (المشتري يرى الإدراج). الشروط والسعر والإصدارات مجمّدة لا
        تتغير؛ الحالة وحدها تتغير.
      required: [id, license_number, order_id, order_item_id, organization_id, listing_id, material_version, title, license_template_id, license_version, terms, price, status, revoked_reason, valid_from, valid_until, exclusive_until, issued_at, delivery_ready]
      properties:
        id: { type: string, format: uuid }
        license_number: { type: string, pattern: "^PH-[0-9]{4}-[0-9A-HJKMNP-TV-Z]{10}$" }
        order_id: { type: string, format: uuid }
        order_item_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        material_version: { type: integer, minimum: 1 }
        title: { $ref: "#/components/schemas/LocalizedText" }
        license_template_id: { type: string, format: uuid }
        license_version: { type: integer, minimum: 1 }
        terms: { $ref: "#/components/schemas/LicenseTerms" }
        price: { $ref: "#/components/schemas/Money" }
        status: { $ref: "#/components/schemas/LicenseStatus" }
        revoked_reason: { type: [string, "null"], enum: [refunded, rights_withdrawn, manual, null] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: [string, "null"], format: date-time, description: "`null` = بلا انتهاء" }
        exclusive_until: { type: [string, "null"], format: date-time, description: نهاية الحصرية لـ `exclusive_temporary` وحده }
        issued_at: { type: string, format: date-time }
        delivery_ready: { type: boolean, description: حزمة التسليم مبنية وجاهزة للتنزيل }

    LicensePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/License" }
        next_cursor: { type: [string, "null"] }

    LicenseDownloadUrl:
      type: object
      required: [url, expires_at, downloads_remaining]
      properties:
        url:
          type: string
          format: uri
          description: رابط موقّع لحزمة التسليم وحدها؛ لا يُسجَّل ولا يُرسل في إشعار أو حدث
        expires_at: { type: string, format: date-time, description: ≤ 24 ساعة من الإصدار }
        downloads_remaining: { type: integer, minimum: 0 }

    LicenseVerification:
      type: object
      description: >-
        صفحة التحقق العامة بلا مصادقة، بقائمة بيضاء مغلقة من ثلاثة حقول: أن الرقم لترخيص قائم، وحالته، ونهايته. لا يُضاف
        إليها حقل يكشف المادة أو نطاق الترخيص (العنوان، النوع، الاستخدام، الإقليم، الحصرية، التواريخ الأخرى) ولا المشتري
        ولا السعر ولا المراسل ولا أي معرّف: من يملك رقمًا متداولًا لا يعرف به ما رُخّص ولا لمن. إضافة حقل هنا تغيير عقد
        بقرار أمن.
      additionalProperties: false
      required: [license_number, status, valid_until]
      properties:
        license_number: { type: string, pattern: "^PH-[0-9]{4}-[0-9A-HJKMNP-TV-Z]{10}$" }
        status: { $ref: "#/components/schemas/LicenseStatus" }
        valid_until: { type: [string, "null"], format: date-time, description: "`null` = بلا انتهاء" }

    PaymentProviderEvent:
      type: object
      additionalProperties: false
      description: >-
        إشعار المزوّد بعد التحقق من توقيعه (صيغة `sandbox`، ADR 0032). لا بيانات بطاقة ولا اسم مشترٍ؛ يُخزَّن هذا وحده لا
        الجسم الخام.
      required: [event_id, type, provider_ref, amount, occurred_at]
      properties:
        event_id: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,128}$", description: فريد لدى المزوّد؛ مفتاح منع التكرار }
        type: { type: string, enum: [payment.succeeded, payment.failed, refund.succeeded, dispute.opened] }
        provider_ref: { type: string, minLength: 1, maxLength: 128, description: مرجع جلسة الدفع لدى المزوّد }
        amount: { $ref: "#/components/schemas/Money" }
        occurred_at: { type: string, format: date-time }

    PaymentProvider:
      type: string
      description: >-
        محوّل الدفع (ADR 0032). `sandbox` المزوّد التجريبي الداخلي في غير الإنتاج؛ `stripe` بوضع الاختبار وحده (مفاتيح
        `sk_test_`، و`livemode: false`) حتى قرار المالك بالمال الحقيقي بعد تجربة الصرف.
      enum: [sandbox, stripe]

    StripeWebhookEvent:
      type: object
      description: >-
        حدث Stripe كما يرسله، بعد التحقق من `Stripe-Signature`. الحقول المعرَّفة وحدها تُقرأ، وما زاد يُتجاهل ولا يُخزَّن
        (قد يحمل بريد المشتري واسمه لدى Stripe). يُخزَّن من الحدث ما في `payment_events` وحده.
      required: [id, object, type, livemode, created, data]
      properties:
        id: { type: string, pattern: "^evt_[A-Za-z0-9]{1,250}$" }
        object: { type: string, const: event }
        type:
          type: string
          description: الأنواع التي يترجمها المحوّل؛ غيرها يُستلم بلا أثر
          minLength: 1
          maxLength: 128
        livemode: { type: boolean, description: "`true` يُرفض `400 live_payments_disabled`" }
        created: { type: integer, minimum: 0 }
        data:
          type: object
          required: [object]
          properties:
            object: { $ref: "#/components/schemas/StripeEventObject" }

    StripeEventObject:
      type: object
      description: >-
        الكائن المعني: جلسة دفع (`checkout.session`)، أو استرداد (`refund`)، أو نزاع (`dispute`). المبلغ بأصغر وحدة
        والعملة بحروف صغيرة كما في Stripe. `metadata.order_id` يضعه المحوّل عند إنشاء الجلسة ولا يُعتمد عليه وحده: المطابقة
        بـ `provider_ref`.
      required: [id, object]
      properties:
        id: { type: string, minLength: 1, maxLength: 255 }
        object: { type: string, enum: [checkout.session, refund, dispute] }
        amount_total: { type: [integer, "null"], minimum: 0, description: "`checkout.session`" }
        amount: { type: integer, minimum: 0, description: "`refund` و`dispute`" }
        currency: { type: string, enum: [usd, ils] }
        payment_status: { type: string, enum: [paid, unpaid, no_payment_required], description: "`checkout.session`" }
        status:
          type: [string, "null"]
          description: >-
            لـ `refund`: `pending` أو `requires_action` (يبقى الاسترداد `pending`)، و`succeeded`، و`failed` أو `canceled`
            (يصير `failed`). ولجلسة الدفع والنزاع حالتهما في Stripe.
        payment_intent: { type: [string, "null"], maxLength: 255 }
        metadata:
          type: object
          properties:
            order_id: { type: string, format: uuid }

    PaymentWebhookAck:
      type: object
      additionalProperties: false
      required: [received]
      properties:
        received: { type: boolean, const: true }

    BuyerMemberCreated:
      description: رد الدعوة وحده؛ يحمل رمز الدعوة في الرد الأول، ولا يُعاد عند التكرار
      allOf:
        - $ref: "#/components/schemas/BuyerMember"
        - $ref: "#/components/schemas/BuyerInviteToken"

    RefundCreate:
      type: object
      additionalProperties: false
      required: [order_item_ids, reason_code]
      properties:
        order_item_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: بنود من الطلب نفسه؛ المبلغ مجموع أسعارها المجمّدة
          items: { type: string, format: uuid }
        reason_code: { $ref: "#/components/schemas/RefundReason" }

    RefundReason:
      type: string
      enum: [buyer_request, duplicate, rights_withdrawn, dispute, exclusivity_lost, other]

    Refund:
      type: object
      required: [id, order_id, order_item_ids, amount, reason_code, status, created_by, created_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        order_item_ids:
          type: array
          items: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        reason_code: { $ref: "#/components/schemas/RefundReason" }
        status:
          type: string
          description: "`pending` طُلب من المزوّد؛ `succeeded` أكده الإشعار الموقّع وكُتب قيده؛ `failed` يحرر البنود لاسترداد جديد"
          enum: [pending, succeeded, failed]
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    CommissionScope:
      type: string
      enum: [material, reporter, material_type, default]

    CommissionRuleFields:
      type: object
      required: [scope, scope_id, license_type, platform_basis_points, effective_from]
      properties:
        scope: { $ref: "#/components/schemas/CommissionScope" }
        scope_id:
          type: [string, "null"]
          maxLength: 64
          description: "`null` للافتراضية؛ معرّف uuid للمادة والمراسل؛ قيمة `MaterialType` لنوع المادة"
        license_type:
          oneOf:
            - $ref: "#/components/schemas/LicenseType"
            - type: "null"
          description: "`null` = كل الأنواع"
        platform_basis_points:
          type: integer
          minimum: 0
          maximum: 10000
          description: حصة المنصة بنقاط أساس من صافي الإيراد بعد رسوم المزوّد والضريبة؛ الباقي للمساهمين بحصصهم
        effective_from: { type: string, format: date-time }

    CommissionRuleInput:
      description: جسم الطلب؛ لا خصائص غير المعرَّفة
      allOf:
        - $ref: "#/components/schemas/CommissionRuleFields"
      unevaluatedProperties: false

    CommissionRule:
      allOf:
        - $ref: "#/components/schemas/CommissionRuleFields"
        - type: object
          required: [id, created_by, created_at]
          properties:
            id: { type: string, format: uuid }
            created_by: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
      unevaluatedProperties: false

    BuyerInviteConflictState:
      type: string
      enum: [pending, suspended, dismissed]

    BuyerInviteConflict:
      type: object
      description: لمدير النظام وحده؛ لا يظهر في أي استجابة للمشتري، فالمؤسسة ترى العضو المدعو البديل كأي عضو مدعو
      required: [id, organization_id, email, existing_user_id, role, state, invited_by, invite_expires_at, created_at, resolved_at, resolved_by]
      properties:
        id: { type: string, format: uuid, description: هو `user_id` الظاهر للعضو المدعو البديل في المؤسسة }
        organization_id: { type: string, format: uuid }
        email: { type: string, format: email }
        existing_user_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/BuyerRole" }
        state: { $ref: "#/components/schemas/BuyerInviteConflictState" }
        invited_by: { type: string, format: uuid }
        invite_expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        resolved_by: { type: [string, "null"], format: uuid }

    BuyerInviteConflictPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BuyerInviteConflict" }
        next_cursor: { type: [string, "null"] }

    BuyerInviteConflictResolve:
      type: object
      additionalProperties: false
      required: [state, totp_code]
      properties:
        state: { type: string, enum: [suspended, dismissed] }
        totp_code: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }

    SignedMoney:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      description: مبلغ بإشارة، موجبه يزيد رصيد صاحبه
      properties:
        amount_minor: { type: integer, minimum: -100000000000, maximum: 100000000000 }
        currency: { $ref: "#/components/schemas/Currency" }

    PayableState:
      type: string
      description: "`pending` في فترة الاسترداد؛ `available` يُطلب صرفه؛ `in_payout` في طلب صرف مفتوح؛ `paid` صُرف"
      enum: [pending, available, in_payout, paid]

    EarningsBalance:
      type: object
      required: [currency, pending, available, in_payout, paid, reserve, requestable, minimum]
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        pending: { $ref: "#/components/schemas/Money" }
        available: { $ref: "#/components/schemas/Money" }
        in_payout: { $ref: "#/components/schemas/Money" }
        paid: { $ref: "#/components/schemas/Money" }
        reserve: { $ref: "#/components/schemas/Money", description: الجزء المحتجز من المتاح بنسبة السياسة }
        requestable: { $ref: "#/components/schemas/Money", description: المتاح بعد الاحتياطي }
        minimum: { $ref: "#/components/schemas/Money", description: أدنى مبلغ طلب صرف بهذه العملة }

    EarningsSummary:
      type: object
      required: [user_id, balances, as_of]
      properties:
        user_id: { type: string, format: uuid }
        balances:
          type: array
          items: { $ref: "#/components/schemas/EarningsBalance" }
        as_of: { type: string, format: date-time }

    EarningsEntry:
      type: object
      description: سطر قيد على أحد حساباتي؛ لا مشترٍ ولا مؤسسة ولا سعر بيع ولا قاعدة عمولة
      required: [id, entry_id, kind, state, amount, reference_type, reference_id, occurred_at]
      properties:
        id: { type: string, pattern: "^[0-9]{1,19}$", description: رقم السطر، مؤشر الصفحات }
        entry_id: { type: string, format: uuid }
        kind: { type: string, enum: [sale, refund, release, payout, correction] }
        state: { $ref: "#/components/schemas/PayableState" }
        amount: { $ref: "#/components/schemas/SignedMoney" }
        reference_type: { type: string, pattern: "^[a-z_]{1,32}$", description: "`order` أو `refund` أو `payout_request` …" }
        reference_id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }

    EarningsEntryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EarningsEntry" }
        next_cursor: { type: [string, "null"] }

    PayoutChannel:
      type: string
      description: "`sandbox` وحده حتى تجربة الصرف (ADR 0033)؛ القناة الحقيقية بـ ADR لكل قناة"
      enum: [sandbox]

    PayoutState:
      type: string
      enum: [requested, approved, processing, paid, failed, rejected, cancelled]

    PayoutReason:
      type: string
      enum: [documents_missing, suspected_fraud, policy, channel_failed, other]

    PayoutRequestCreate:
      type: object
      additionalProperties: false
      required: [amount, channel]
      properties:
        amount: { $ref: "#/components/schemas/Money" }
        channel: { $ref: "#/components/schemas/PayoutChannel" }

    PayoutReject:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code: { $ref: "#/components/schemas/PayoutReason" }

    PayoutRequest:
      type: object
      required: [id, user_id, amount, channel, state, reason_code, approvals_required, approvals, requested_at, decided_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        channel: { $ref: "#/components/schemas/PayoutChannel" }
        state: { $ref: "#/components/schemas/PayoutState" }
        reason_code:
          oneOf:
            - $ref: "#/components/schemas/PayoutReason"
            - type: "null"
          description: للرفض والفشل وحدهما
        approvals_required: { type: integer, enum: [1, 2] }
        approvals:
          type: array
          description: المعتمدون؛ معرّفاتهم للمالية والإدارة، وعددهم وحده لصاحب الطلب
          items:
            type: object
            required: [approved_at]
            properties:
              approver_id: { type: string, format: uuid }
              approved_at: { type: string, format: date-time }
        requested_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    PayoutRequestPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PayoutRequest" }
        next_cursor: { type: [string, "null"] }

    PayoutPolicyFields:
      type: object
      required: [currency, minimum, dual_approval_above, reserve_bps, effective_from]
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        minimum: { $ref: "#/components/schemas/Money", description: أدنى مبلغ طلب، بعملة السياسة }
        dual_approval_above: { $ref: "#/components/schemas/Money", description: ما فوقه يلزمه معتمدان }
        reserve_bps: { type: integer, minimum: 0, maximum: 5000, description: الاحتياطي من المتاح بنقاط أساس }
        effective_from: { type: string, format: date-time }

    PayoutPolicyInput:
      description: جسم الطلب؛ لا خصائص غير المعرَّفة. عملتا المبلغين عملة السياسة (`422`)
      allOf:
        - $ref: "#/components/schemas/PayoutPolicyFields"
      unevaluatedProperties: false

    PayoutPolicy:
      allOf:
        - $ref: "#/components/schemas/PayoutPolicyFields"
        - type: object
          required: [id, created_by, created_at]
          properties:
            id: { type: string, format: uuid }
            created_by: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
      unevaluatedProperties: false

    OutboxEvent:
      $ref: "./schemas/outbox-event.json"

    EventPage:
      type: object
      required: [items, next_after]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OutboxEvent" }
        next_after:
          type: [string, "null"]
          description: يُمرَّر في `after` للصفحة التالية

security:
  - bearerAuth: []
