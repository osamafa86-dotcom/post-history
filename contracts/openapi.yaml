        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [commerce]
      summary: إصدار جديد من قالب ترخيص
      description: >-
        لا يُعدَّل إصدار قائم: الاستبدال يكتب إصدارًا جديدًا ويبقى السابق كما هو، لأن كل بيعة تجمّد الإصدار الذي وافق عليه
        المشتري. العروض في الكتالوج تتبع الإصدار الحالي. النوع لا يتغير بعد الإنشاء (`422 validation_failed`).
