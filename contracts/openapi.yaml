      description: >-
        لبناء `watermarked_preview` من `catalog.listing_changed` وحزمة `export` من `export.requested`: مفتاح تخزين المصدر
        وبصمته. فشل المصادقة أو العنوان `404` كبقية `/internal/*`؛ والملف غير الموجود برمز صحيح `410 media_resource_gone`.
        لا اسم ملف ولا بيانات كاشفة.
      operationId: mediaGetFile
      x-roles: []
      security: [{ mediaWorkerToken: [] }]
      responses:
        "200":
          description: الملف
          content:
