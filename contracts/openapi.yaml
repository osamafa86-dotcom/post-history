        - name: governorate
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: shot_from
          in: query
          schema: { type: string, format: date }
        - name: shot_to
          in: query
          schema: { type: string, format: date }
        - name: min_duration_ms
          in: query
