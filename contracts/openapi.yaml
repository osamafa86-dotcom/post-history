          description: القوالب
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LicenseTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
