      operationId: completeSandboxCheckout
      x-roles: []
      security: []
      responses:
        "202": { description: أُرسل الإشعار أو جُدول }
        "404": { $ref: "#/components/responses/NotFound" }

  /buyer-invite-conflicts:
    get:
      tags: [commerce]
      summary: طابور تعارض دعوات المشترين (مدير النظام، #331)
      description: >-
        دعوات ببريد حساب قائم خارج المؤسسة، ردّت كالدعوة الناجحة فلم تكشف نوع الحساب. لمدير النظام وحده، وغيره
        `403 forbidden_role` كبقية النقاط المقيّدة بالدور (مصفوفة عزل المستأجرين).
      operationId: listBuyerInviteConflicts
      x-roles: [system_admin]
      parameters:
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/BuyerInviteConflictState" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: صفحة من التعارضات، الأقدم أولًا
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerInviteConflictPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /buyer-invite-conflicts/{conflict_id}/resolve:
    parameters:
      - name: conflict_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [commerce]
      summary: حسم تعارض دعوة بالحالة وحدها
      description: >-
        لمدير النظام وحده، وغيره `403 forbidden_role`؛ والتعارض المجهول `404`. يلزمه رمز TOTP حاضر في الجسم (`401 totp_required` لغيابه أو خطئه).
        **الحسم:** `suspended` يعلّق العضو المدعو البديل، و`dismissed` يغلقه نهائيًا ويحرر مقعده.
        **الانتقالات:** من `pending` إلى الحالتين، ومن `suspended` إلى `dismissed`. غيرها `409 invalid_transition`.
        **التوثيق:** لا حقل نص حر، ويُسجَّل في التدقيق بـ `buyer_member.invite_conflict_resolved` و`conflict_id`.
      operationId: resolveBuyerInviteConflict
      x-roles: [system_admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerInviteConflictResolve" }
      responses:
        "200":
          description: التعارض بعد الحسم
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerInviteConflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /me/earnings:
    get:
      tags: [earnings]
      summary: أرصدة أرباحي لكل عملة (ADR 0033)
      description: >-
        محسوبة من قيود حساباتي في الدفتر لحظة الطلب، ولا رصيد مخزَّن. `requestable` هو المتاح بعد الاحتياطي، وما يُطلب
        منه لا يقل عن `minimum`.
      operationId: getMyEarnings
      x-roles: [reporter]
      responses:
        "200":
          description: الأرصدة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarningsSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /me/earnings/entries:
    get:
      tags: [earnings]
      summary: كشف أرباحي (سطور القيود)
      description: >-
        سطر لكل قيد مس حساباتي، الأحدث أولًا: البيعة والاسترداد والتحرير والصرف والتصحيح. لا مشترٍ ولا مؤسسة ولا سعر بيع
        ولا قاعدة عمولة؛ المبلغ حصتي وحدها.
      operationId: listMyEarningsEntries
      x-roles: [reporter]
      parameters:
        - name: currency
          in: query
          schema: { $ref: "#/components/schemas/Currency" }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/PayableState" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: صفحة من السطور
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarningsEntryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{id}/earnings:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [earnings]
      summary: أرصدة أرباح مساهم (للمالية)
      operationId: getUserEarnings
      x-roles: [system_admin, finance]
      responses:
        "200":
          description: الأرصدة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EarningsSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/payout-requests:
    get:
      tags: [earnings]
      summary: طلبات صرفي
      operationId: listMyPayoutRequests
      x-roles: [reporter]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: صفحة من الطلبات، الأحدث أولًا
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutRequestPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [earnings]
      summary: طلب صرف تجريبي
      description: >-
        القناة `sandbox` وحدها، فلا مال حقيقي ولا بيانات حساب بنكي.
        **الرفض:** ما تحت الحد الأدنى للعملة `422 payout_below_minimum`، وما فوق المتاح بعد الاحتياطي
        `422 insufficient_available`.
        **الحجز:** في معاملة الإنشاء قيد `payout` ينقل المبلغ من «متاح» إلى «قيد الصرف»، والقاعدة ترفض ما يجعل المتاح مدينًا
        ولو تزامن طلبان.
        **الاعتماد:** عدده يُجمَّد من سياسة العملة، فطلب فوق `dual_approval_above` يلزمه معتمدان.
        يُكتب `payout.status_changed`، ويُسجَّل في التدقيق.
      operationId: createPayoutRequest
      x-roles: [reporter]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutRequestCreate" }
      responses:
        "201":
          description: الطلب بحالة `requested`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /payout-requests:
    get:
      tags: [earnings]
      summary: طلبات الصرف (للمالية)
      operationId: listPayoutRequests
      x-roles: [system_admin, finance]
      parameters:
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/PayoutState" }
        - name: user_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: صفحة من الطلبات، الأقدم انتظارًا أولًا للحالات المفتوحة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutRequestPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /payout-requests/{payout_request_id}:
    parameters:
      - $ref: "#/components/parameters/PayoutRequestId"
    get:
      tags: [earnings]
      summary: قراءة طلب صرف
      description: صاحب الطلب يقرأ طلبه وحده؛ غيره `404`.
      operationId: getPayoutRequest
      x-roles: [system_admin, finance, reporter]
      responses:
        "200":
          description: الطلب
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /payout-requests/{payout_request_id}/approve:
    parameters:
      - $ref: "#/components/parameters/PayoutRequestId"
    post:
      tags: [earnings]
      summary: اعتماد طلب صرف
      description: >-
        للطلب `requested` وحده (`409 payout_state_conflict`). المعتمد غير صاحب الطلب (`409 self_approval_forbidden`)
        ومرة واحدة (`409 already_approved`)، قيدًا في القاعدة. حين يكتمل العدد المطلوب يصير `approved`، وتكمله القناة
        التجريبية آليًا (`processing` ثم `paid`). يُسجَّل في التدقيق.
      operationId: approvePayoutRequest
      x-roles: [system_admin, finance]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: الطلب بعد الاعتماد
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /payout-requests/{payout_request_id}/reject:
    parameters:
      - $ref: "#/components/parameters/PayoutRequestId"
    post:
      tags: [earnings]
      summary: رفض طلب صرف
      description: >-
        من `requested` أو `approved` قبل التنفيذ (`409 payout_state_conflict`)، بسبب من القائمة لا نص حر. يعيد المبلغ إلى
        «متاح» بقيد معاكس في المعاملة نفسها. يُسجَّل في التدقيق.
      operationId: rejectPayoutRequest
      x-roles: [system_admin, finance]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutReject" }
      responses:
        "200":
          description: الطلب مرفوضًا
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /payout-requests/{payout_request_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PayoutRequestId"
    post:
      tags: [earnings]
      summary: إلغاء طلب صرفي قبل اعتماده
      description: صاحب الطلب وحده، و`requested` وحده (`409 payout_state_conflict`)؛ يعيد المبلغ إلى «متاح» بقيد معاكس.
      operationId: cancelPayoutRequest
      x-roles: [reporter]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: الطلب ملغى
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /payout-policies:
    get:
      tags: [earnings]
      summary: سياسات الصرف بإصداراتها
      description: لكل عملة الحد الأدنى، وحد الاعتماد الثنائي، والاحتياطي؛ السارية أحدثها `effective_from` لا يتجاوز الآن.
      operationId: listPayoutPolicies
      x-roles: [system_admin, finance]
      responses:
        "200":
          description: السياسات، الأحدث سريانًا أولًا
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PayoutPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [earnings]
      summary: إصدار جديد لسياسة صرف
      description: >-
        لا تُعدَّل سياسة ولا تُحذف: التغيير صف جديد بتاريخ سريان، والطلبات السابقة تحتفظ بعدد اعتمادها. العملة والتاريخ
        نفسيهما `409 payout_policy_exists`. يُسجَّل في التدقيق.
      operationId: createPayoutPolicy
      x-roles: [system_admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutPolicyInput" }
      responses:
        "201":
          description: السياسة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /events:
    get:
      tags: [events]
      summary: قراءة أحداث Outbox (لوحة الإدارة والمراقبة)
      operationId: listEvents
      x-roles: [system_admin]
      parameters:
        - name: after
          in: query
          description: معرّف آخر حدث مقروء؛ تعاد الأحداث التي تليه
          schema: { type: string }
        - name: type
          in: query
          description: تصفية بنوع الحدث
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: أحداث بترتيب تسلسلي
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    mediaWorkerToken:
      type: http
      scheme: bearer
      description: >-
        `MEDIA_WORKER_TOKEN` (≥ 32 حرفًا) لعامل الوسائط على `/internal/media/*` فقط؛ منفصل عن سر خطّاف tusd، مقارنة
        ثابتة الزمن، لا يُسجَّل (ADR 0006، SEC-05)
    bearerAuth:
      type: http
      scheme: bearer
      description: رمز وصول قصير العمر من `/auth/login` أو `/auth/refresh`

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        مفتاح منع التكرار؛ يولّده العميل مرة واحدة لكل عملية ويعيد استخدامه عند إعادة المحاولة.
        انظر «القواعد الحاكمة». غير مقبول على `/auth/*`: استجابات الهوية تحمل رموزًا ولا تُحفظ في جدول
        المفاتيح أبدًا.
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        قيمة `ETag` الأخيرة التي رآها العميل (`"<row_version>"` للمادة، `"<version>"` للنموذج الحالي). إن لم تطابق
        الحالة الراهنة يُرفض الطلب بـ `412 precondition_failed` دون أثر. اختيارية في v0.1 للتوافق مع عملاء v0.
      schema: { type: string, pattern: '^"[0-9]{1,19}"$', maxLength: 22 }
    MediaSessionId:
      name: upload_session_id
      in: path
      required: true
      description: معرّف جلسة الرفع
      schema: { type: string, format: uuid }
    OrganizationId:
      name: org_id
      in: path
      required: true
      description: معرّف المؤسسة المشترية
      schema: { type: string, format: uuid }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SandboxProviderRef:
      name: provider_ref
      in: path
      required: true
      description: مرجع جلسة الدفع التجريبية
      schema: { type: string, minLength: 1, maxLength: 128 }
    PayoutRequestId:
      name: payout_request_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LicenseId:
      name: license_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MaterialId:
      name: id
      in: path
      required: true
      description: معرّف المادة
      schema: { type: string, format: uuid }
    UploadId:
      name: id
      in: path
      required: true
      description: معرّف جلسة الرفع
      schema: { type: string, format: uuid }
    NotificationId:
      name: id
      in: path
      required: true
      description: معرّف الإشعار
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: مؤشر الصفحة التالية كما أعادته الاستجابة السابقة في `next_cursor`
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: حجم الصفحة
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  headers:
    ETag:
      description: '`"<row_version>"` للمادة؛ يُرسل في `If-Match` مع التعديل التالي'
      schema: { type: string, pattern: '^"[0-9]{1,19}"$' }
    RateLimiterDegraded:
      description: >-
        تظهر بقيمة `degraded` فقط حين يعمل حد المعدل في ذاكرة العملية بدل Redis (حدود أضعف عبر النسخ)؛ غيابها يعني
        الوضع الطبيعي. على `/health` الداخلي فقط: لا تُرسل على أي مسار عام لأنها تخبر المهاجم أن توزيع المحاولات عبر
        النسخ يتجاوز الحد.
      schema: { type: string, enum: [degraded] }

  responses:
    BadRequest:
      description: طلب غير صالح (معاملات استعلام أو مؤشر غير مفهوم)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: لا جلسة صالحة، أو رمز TOTP مطلوب أو خاطئ
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >-
        `forbidden_role`: دور المستدعي ليس في `x-roles` للعملية (لا يكشف وجود مورد). `forbidden_scope`: إجراء لا يملكه
        الدور على مورد داخل نطاقه. `admin_quorum_required`: الإجراء يمس حساب مدير نظام ويحتاج إجراء الشخصين.
        `credential_reset_required`: جلسة ما بعد الاستعادة قبل إعادة تعيين كلمة المرور والمصادقة الثنائية. ما خارج
        النطاق يعود 404 لا 403.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: غير موجود، أو موجود خارج النطاق (لا يُفرَّق بينهما لغير المخوّلين)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: تعارض حالة (انتقال غير مسموح، حجز قائم، إصدار نموذج متجاوز، طلب قيد التنفيذ بالمفتاح نفسه)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: '`challenge_expired`: التحدي منتهٍ أو مستهلَك؛ اطلب تحديًا جديدًا'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MediaResourceGone:
      description: >-
        `media_resource_gone`: الرمز صحيح لكن الجلسة أو الملف المصدر غير موجود؛ حدث متقادم لا خطأ تهيئة. العامل لا
        يعيد المحاولة وينقل الحدث إلى `media:dead`. أما `404` على `/internal/media/*` فيبقى للرمز غير المطابق أو
        العنوان (إخفاء النقطة)، فيعامله العامل خطأ تهيئة.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: '`attestation_unavailable`: مزوّد الشهادة (Google) غير متاح؛ أعد المحاولة لاحقًا'
      headers:
        Retry-After:
          description: ثوانٍ قبل إعادة المحاولة
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionFailed:
      description: '`If-Match` لا يطابق الحالة الراهنة (`precondition_failed`)؛ أعد القراءة ثم أعد المحاولة'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: فشل التحقق (الحقول الثابتة أو الديناميكية، مجموع الحصص، إعادة استخدام المفتاح بجسم مختلف)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: تجاوز حد المعدل؛ أعد المحاولة بعد `Retry-After`
      headers:
        Retry-After:
          description: ثوانٍ قبل إعادة المحاولة
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: رمز ثابت يتفرّع عليه العميل؛ الرسالة للبشر فقط. قائمة مفتوحة؛ الرمز المجهول = خطأ عام
          x-extensible-enum: true
          enum:
            - bad_request
            - unauthorized
            - totp_required
            - forbidden_scope
            - not_found
            - rate_limited
            - validation_failed
            - dynamic_fields_invalid
            - shares_not_100
            - idempotency_key_reused
            - idempotency_in_progress
            - invalid_transition
            - already_reserved
            - upload_state_conflict
            - checksum_mismatch
            - form_version_conflict
            - sensitive_fields_not_supported_v0
            - recovery_state_conflict
            - precondition_failed
            - forbidden_role
            - admin_quorum_required
            - credential_reset_required
            - attestation_failed
            - challenge_expired
            - assertion_replay
            - attestation_key_conflict
            - attestation_unavailable
            - media_resource_gone
            - export_not_ready
            - rights_not_sellable
            - listing_exists
            - preview_not_ready
            - seats_exhausted
            - last_buyer_admin
            - listing_unavailable
            - exclusive_unavailable
            - mixed_currency
            - price_changed
            - order_state_conflict
            - license_not_active
            - delivery_not_ready
            - download_limit_reached
            - webhook_signature_invalid
            - already_refunded
            - commission_rule_exists
            - live_payments_disabled
            - payout_below_minimum
            - insufficient_available
            - payout_state_conflict
            - self_approval_forbidden
            - already_approved
            - payout_policy_exists
            - internal_error
        message: { type: string }
        request_id: { type: string, description: لتتبع الطلب في السجلات }
        details:
          type: object
          additionalProperties: true
          description: تفاصيل آلية (مثل مسارات الحقول الفاشلة)؛ لا بيانات كاشفة
      example:
        code: invalid_transition
        message: الانتقال من inbox إلى published غير مسموح في المسار التحريري
        request_id: 01J9ZK2W5N6Q7R8S9T0V1W2X3Y
        details: { track: editorial, from: inbox, to: published }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, writeOnly: true }
        totp_code:
          type: string
          pattern: "^[0-9]{6}$"
          writeOnly: true
          description: مطلوب لكل الطاقم بعد التفعيل

    Session:
      type: object
      required: [access_token, refresh_token, expires_at, user_id, roles]
      properties:
        access_token:
          type: string
          description: >-
            JWT بعمر لا يتجاوز 15 دقيقة يحمل معرّف الجلسة؛ الإبطال يُفحص عند كل طلب بقائمة إبطال لا بانتظار
            الانتهاء (SEC-02)
        refresh_token: { type: string, description: يُدوَّر عند كل تحديث؛ يُحفظ مُجزَّأً فقط }
        expires_at: { type: string, format: date-time, description: انتهاء رمز الوصول }
        user_id: { type: string, format: uuid }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }

    Me:
      type: object
      required: [user_id, email, roles, permissions, totp_enabled]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        office_id: { type: [string, "null"], format: uuid, description: مكتب المستخدم }
        organization_id: { type: [string, "null"], format: uuid, description: مؤسسة المشتري (v0.3)؛ غيابه أو `null` لحساب طاقم }
        totp_enabled: { type: boolean }
        credential_reset_required:
          type: boolean
          description: الجلسة مقيّدة بعد استعادة الحساب حتى `/auth/totp/confirm`؛ غيابه = false (أُضيف في v0.1)
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          description: الصلاحيات المستقلة الممنوحة حاليًا؛ فارغة لمعظم المستخدمين
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }

    Permission:
      type: string
      description: >-
        صلاحية مستقلة تُمنح لمستخدم بعينه لا لدور (قرار المالك 2026-10-19، ADR SEC-03). `reporter_identity:read` للاسم
        الحقيقي للمراسل حين يكون الإعداد `separate` (ADR 0021).
      enum: [sensitive_location:read, protected_source:read, reporter_identity:read]

    Role:
      type: object
      required: [name, scopes]
      properties:
        name: { $ref: "#/components/schemas/RoleName" }
        scopes:
          type: array
          description: المكاتب أو المحافظات التي يراها الدور؛ فارغ = كل شيء (لمدير النظام ورئيس التحرير)
          items: { $ref: "#/components/schemas/Scope" }

    RoleName:
      type: string
      description: >-
        أدوار الطاقم، وأدوار المشترين (`buyer_admin` و`buyer_member`، v0.3، ADR 0025) التي نطاقها مؤسستهم وحدها
        (`Scope.kind = organization`). لا يجمع حساب واحد دور طاقم ودور مشترٍ.
      enum: [system_admin, editor_in_chief, supervisor, producer, finance, reporter, rights_officer, buyer_admin, buyer_member]

    Scope:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [office, governorate, organization] }
        id: { type: string, description: معرّف المكتب أو اسم المحافظة أو معرّف المؤسسة المشترية }

    RecoveryCompletion:
      type: object
      required: [session, totp_enrollment]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        totp_enrollment:
          type: object
          required: [secret_base32, otpauth_uri]
          description: >-
            يُعرض مرة واحدة ولا يُسجَّل؛ لا يتضمن اسم المستخدم الحقيقي في `otpauth_uri` بل معرّفًا داخليًا. العميل لا يحفظ
            `secret_base32` بعد العرض ولا يضعه في الحافظة ولا يسمح بلقطة شاشة لشاشته.
          properties:
            secret_base32: { type: string, pattern: "^[A-Z2-7]{16,64}$" }
            otpauth_uri: { type: string, format: uri }

    RecoveryAccepted:
      type: object
      description: استجابة ثابتة لا تدل على صحة الرمز
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }

    UserSession:
      type: object
      required: [id, created_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        installation_id: { type: [string, "null"], format: uuid, description: معرّف التثبيت الذي ولّده التطبيق؛ ليس معرّف جهاز }
        platform: { type: [string, "null"], enum: [ios, android, web, null] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean, description: هل هي الجلسة التي أرسلت الطلب }

    RecoveryApproval:
      allOf:
        - $ref: "#/components/schemas/RecoveryRequest"
        - type: object
          properties:
            reset_token:
              type: string
              minLength: 32
              maxLength: 256
              description: >-
                يُعاد مرة واحدة للمشرف المعتمِد ليسلّمه للمراسل خارج النظام؛ لا يُسجَّل ولا يُخزَّن إلا ببصمته (ولا في جدول مفاتيح
                منع التكرار)؛ لا يُعاد عند التكرار. العميل يعرضه مرة ولا يحفظه ولا يضعه في الحافظة ولا يسمح بلقطة شاشة له.
                حامله يستطيع إكمال الاستعادة بنفسه، فالمخاطرة مقبولة بضوابط ADR 0012: إشعار القناة المسجّلة للحساب عند الاعتماد
                وعند الإكمال، وتدقيق الإكمال بمعرّف الطلب والمعتمِد، وحد معدل على الإكمال بمفتاح الرمز. حسابات مديري النظام لا تصل هنا (`admin_quorum_required`): رمزها يصدره سطر الأوامر ثنائي الأشخاص.
            reset_token_expires_at: { type: string, format: date-time, description: ≤ 24 ساعة من الاعتماد }

    RecoveryRequest:
      type: object
      required: [id, state, created_at]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [pending_approval, approved, rejected, expired] }
        created_at: { type: string, format: date-time }
        approved_by: { type: [string, "null"], format: uuid }
        expires_at: { type: [string, "null"], format: date-time, description: انتهاء صلاحية الطلب أو الرابط }

    TechnicalState:
      type: string
      description: ماذا وصل — pending → proxy_received → original_received → verified؛ failed من أي حالة
      enum: [pending, proxy_received, original_received, verified, failed]

    EditorialState:
      type: string
      description: من وافق — inbox → acknowledged → reviewing → accepted → in_production → final_review → published
      enum: [inbox, acknowledged, reviewing, needs_changes, accepted, in_production, final_review, published, rejected]

    RightsState:
      type: string
      description: ما يُسمح به — unknown → documented → sellable؛ blocked و withdrawn يوقفان الإتاحة
      enum: [unknown, documented, sellable, blocked, withdrawn]

    Priority:
      type: string
      description: تحدد مسار التنبيه وزمن الاستجابة المطلوب
      enum: [urgent, important, normal]

    MaterialType:
      type: string
      enum: [breaking, report, interview, raw_footage, aerial, press_conference, eyewitness, photos]

    Sensitivity:
      type: object
      description: سؤال إلزامي؛ أي علم مفعَّل يفعّل التمويه والتحذير ويحوّل المعالجة الآلية إلى المسار المحلي
      required: [minors, injured, graphic]
      properties:
        minors: { type: boolean }
        injured: { type: boolean }
        graphic: { type: boolean }

    DisplayName:
      type: object
      description: اسم الظهور للعموم؛ الارتباط الداخلي بالمراسل ثابت لاحتساب عمولته
      required: [mode]
      properties:
        mode: { type: string, enum: [real_name, pseudonym, network] }
        pseudonym: { type: [string, "null"], minLength: 1, maxLength: 80 }

    GpsPoint:
      type: object
      description: >-
        إحداثيات اختيارية تُكتب فقط؛ تُخزَّن مشفرة على مستوى الحقل ولا تُقرأ من هذه الواجهة ولا تظهر في
        أي معاينة أو إشعار أو تصدير.
      required: [lat, lng]
      writeOnly: true
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: [number, "null"], minimum: 0 }

    Contributor:
      type: object
      required: [user_id, role, share_percent]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [photographer, reporter, editor, fixer] }
        share_percent:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          description: بدقة منزلتين عشريتين؛ مجموع المساهمين في المادة = 100.00

    ContributorsSet:
      type: object
      required: [contributors]
      properties:
        contributors:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Contributor" }

    MaterialCreate:
      type: object
      required: [title, material_types, governorate, city, priority, sensitivity, display_name, form_version, dynamic_fields]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 80
          description: الحدود تعدّلها الإدارة؛ هذه حدود v0
        material_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/MaterialType" }
        governorate: { type: string, minLength: 1, maxLength: 64 }
        city: { type: string, minLength: 1, maxLength: 64 }
        shot_at:
          type: [string, "null"]
          format: date-time
          description: تُقرأ من الملف وتُصحَّح يدويًا
        priority: { $ref: "#/components/schemas/Priority" }
        sensitivity: { $ref: "#/components/schemas/Sensitivity" }
        display_name: { $ref: "#/components/schemas/DisplayName" }
        gps: { $ref: "#/components/schemas/GpsPoint" }
        form_version: { type: integer, minimum: 1, description: إصدار النموذج الذي رُسمت به الحقول الديناميكية }
        dynamic_fields:
          type: object
          description: >-
            قيم الحقول الديناميكية مفتاحها `key` الحقل؛ يتحقق الخادم بمخطط النموذج ذي الإصدار. في v0 لا
            يحتوي أي نموذج حقلًا حساسًا أو حقل موقع (بوابة `POST /forms`)، فلا بيانات كاشفة هنا حتى SEC-04.
            قيمة حقل `attachment` بالشكل `schemas/attachment-value.json`.
          additionalProperties: true
        contributors:
          type: array
          description: إن أُرسلت وجب أن يكون المجموع 100؛ إن غابت فالمراسل مساهم وحيد بـ 100
          items: { $ref: "#/components/schemas/Contributor" }
        voice_note_upload_id:
          type: [string, "null"]
          format: uuid
          description: جلسة رفع الملاحظة الصوتية إن سبقت إنشاء المادة

    MaterialUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 5, maxLength: 80 }
        material_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/MaterialType" }
        governorate: { type: string, minLength: 1, maxLength: 64 }
        city: { type: string, minLength: 1, maxLength: 64 }
        shot_at: { type: [string, "null"], format: date-time }
        priority: { $ref: "#/components/schemas/Priority" }
        sensitivity: { $ref: "#/components/schemas/Sensitivity" }
        display_name: { $ref: "#/components/schemas/DisplayName" }
        form_version:
          type: integer
          minimum: 1
          description: يُرسل مع `dynamic_fields` عند إكمال مسودة قديمة بإصدار أحدث
        dynamic_fields:
          type: object
          additionalProperties: true

    Material:
      allOf:
        - $ref: "#/components/schemas/MaterialCreate"
        - type: object
          required: [id, version, reporter_id, office_id, technical_state, editorial_state, rights_state, files, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1, description: يرتفع مع كل تعديل بعد الاعتماد }
            reporter_id: { type: string, format: uuid, description: الارتباط الداخلي الثابت بالمراسل }
            office_id: { type: [string, "null"], format: uuid, description: مكتب المراسل عند الإنشاء (نطاق المادة) }
            technical_state: { $ref: "#/components/schemas/TechnicalState" }
            editorial_state: { $ref: "#/components/schemas/EditorialState" }
            rights_state: { $ref: "#/components/schemas/RightsState" }
            reserved_by: { type: [string, "null"], format: uuid, description: المنتج الذي حجز المادة }
            reserved_at: { type: [string, "null"], format: date-time }
            acknowledged_by:
              type: [string, "null"]
              format: uuid
              description: من ضغط «اطّلعت» (انتقال `inbox → acknowledged`)؛ يراه المراسل. أُضيف في v0.2 فقد يغيب
            acknowledged_at: { type: [string, "null"], format: date-time, description: متى؛ أُضيف في v0.2 فقد يغيب }
            reporter_legal_name:
              type: [string, "null"]
              maxLength: 200
              description: >-
                الاسم الحقيقي للمراسل (v0.2). الصلاحية التي تكشفه يحددها الإعداد الإداري `reporter_legal_name_access`
                (`/admin/settings/reporter-identity`، ADR 0021): `reporter_identity:read` حين يكون `separate` (الافتراضي)،
                و`protected_source:read` حين يكون `protected_source`. يغيب المفتاح عمّن لا يحمل الصلاحية الفعّالة. كل قراءة تُسجَّل
                في التدقيق (`material.sensitive_read`، `field_keys: [reporter_legal_name]`). لا يدخل إشعارًا ولا حدثًا ولا
                تصديرًا. `null` = غير مسجّل.
            files:
              type: array
              description: >-
                المشتقات النصية (`transcript` و`captions` و`shot_list`) تظهر لأدوار تعديل المادة وحدها، وتُحذف من القائمة لغيرهم
                فلا يُلمَّح إلى وجودها (threat-model §9.1).
              items: { $ref: "#/components/schemas/MaterialFile" }
            redacted_field_keys:
              type: array
              description: >-
                مفاتيح `dynamic_fields` التي حُذفت من هذه الاستجابة بقاعدة الحجب (حقول `sensitive` أو
                `location`) لأن المستدعي لا يحمل الصلاحية المقابلة؛ فارغة لحاملها.
              items: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            row_version:
              type: integer
              minimum: 1
              description: >-
                يرتفع مع كل كتابة على المادة (بخلاف `version` الذي يرتفع مع التعديل بعد الاعتماد)؛ قيمة `ETag`. أُضيف في
                v0.1 فقد يغيب عند خادم v0.
      example:
        id: 7b4a1f6e-3c2d-4e8f-9a1b-2c3d4e5f6a7b
        version: 1
        reporter_id: 1e2d3c4b-5a69-4788-9796-a5b4c3d2e1f0
        office_id: 0f1e2d3c-4b5a-4697-8877-665544332211
        title: مؤتمر صحفي للدفاع المدني في مدينة غزة
        material_types: [press_conference]
        governorate: غزة
        city: غزة
        shot_at: "2026-10-19T09:30:00Z"
        priority: important
        sensitivity: { minors: false, injured: false, graphic: false }
        display_name: { mode: network, pseudonym: null }
        form_version: 1
        dynamic_fields: { guest_name: المتحدث باسم الدفاع المدني, guest_title: متحدث }
        contributors:
          - { user_id: 1e2d3c4b-5a69-4788-9796-a5b4c3d2e1f0, role: photographer, share_percent: 100 }
        voice_note_upload_id: null
        technical_state: proxy_received
        editorial_state: acknowledged
        rights_state: unknown
        reserved_by: null
        reserved_at: null
        files:
          - id: 9c8b7a6f-5e4d-4c3b-a2a1-0f9e8d7c6b5a
            kind: proxy
            state: received
            proxy_mode: normal
            size_bytes: 68157440
            sha256: null
            mime_type: video/mp4
            duration_ms: 540000
            start_pts_us: 0
            width: 960
            height: 540
            receipt_number: null
            created_at: "2026-10-19T09:41:12Z"
            verified_at: null
        redacted_field_keys: []
        created_at: "2026-10-19T09:40:03Z"
        updated_at: "2026-10-19T09:41:12Z"

    MaterialPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Material" }
        next_cursor: { type: [string, "null"] }

    ReceiptNumber:
      type: [string, "null"]
      description: رقم إيصال الاستلام للمراسل؛ يصدر عند مطابقة بصمة الأصل. الصيغة R-YYYYMM-NNNNNN
      pattern: "^R-[0-9]{6}-[0-9]{6}$"

    MaterialFile:
      type: object
      required: [id, kind, state, created_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: الأصل لا يُمس؛ كل معالجة تنتج ملفًا جديدًا
          enum: [original, proxy, hls, audio, thumbnail, voice_note, transcript, captions, shot_list]
        state: { type: string, enum: [uploading, received, verified, failed] }
        proxy_mode: { type: [string, "null"], enum: [urgent, normal, null], description: وضع النسخة الخفيفة }
        alignment:
          description: لـ `proxy` وحده (v0.3)؛ `null` أو غائب قبل القياس أو لغير النسخة الخفيفة
          oneOf:
            - $ref: "#/components/schemas/MediaAlignment"
            - type: "null"
        size_bytes: { type: [integer, "null"], minimum: 0 }
        sha256:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: تُحسب على الخادم بعد التجميع
        mime_type: { type: [string, "null"] }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        start_pts_us:
          type: [integer, "null"]
          description: نقطة البداية الزمنية للأصل؛ تحفظها النسخة الخفيفة لمحاذاة نقاط القص
        width: { type: [integer, "null"], minimum: 1 }
        height: { type: [integer, "null"], minimum: 1 }
        receipt_number: { $ref: "#/components/schemas/ReceiptNumber" }
        created_at: { type: string, format: date-time }
