  /uploads:
    get:
      tags: [uploads]
      summary: جلسات رفع المستخدم نفسه (للاستئناف بعد إغلاق التبويب أو التطبيق)
      description: >-
        جلسات المستدعي وحده، الأحدث أولًا، بالمؤشر. الافتراضي الجلسات غير النهائية (`created` و`in_progress` و`completed`)،
        فيستأنف العميل منها بعد إغلاق التبويب أو التطبيق (مع إعادة اختيار الملف إن لزم). لا يعيد رمز الرفع أبدًا؛ يطلب
        العميل جلسة جديدة إن انتهى الرمز.
      operationId: listMyUploadSessions
      x-roles: [reporter, supervisor, producer, editor_in_chief]
      parameters:
        - name: state
          in: query
          description: تصفية بالحالة؛ يتكرر. الغياب = غير النهائية
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, enum: [created, in_progress, completed, verified, failed, deduplicated] }
        - name: material_id
          in: query
          description: جلسات مادة واحدة
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: صفحة جلسات
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSessionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [uploads]
      summary: إنشاء جلسة رفع لملف يخص مادة (أصل أو نسخة خفيفة أو ملاحظة صوتية)
      description: >-
        تعيد نقطة tus ورمزًا قصير العمر وحجم الجزء الثابت لهذه الجلسة. يرسل العميل
        `tus_metadata` كما هي في ترويسة `Upload-Metadata` عند إنشاء رفع tus. النسخة الخفيفة لها الأولوية
        على الأصل في قائمة انتظار العميل. `client_fingerprint` يرشّح المكررات فقط ولا يمنح أي حق؛ الربط
        الفعلي بملف موجود لا يتم إلا بتطابق `sha256` الكاملة على الخادم. الجلسة لمنشئ المادة وحده (غيره `404`)؛ ويرفع
        الطاقم من الويب الأصل وحده (`kind: original`)، والنسخة الخفيفة يولّدها عامل الوسائط.
      operationId: createUploadSession
      x-roles: [reporter, supervisor, producer, editor_in_chief]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadSessionCreate" }
      responses:
        "201":
          description: جلسة الرفع ومعلومات الاتصال بخادم tus؛ رمز الرفع يظهر هنا فقط
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSessionCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /uploads/{id}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    get:
      tags: [uploads]
      summary: حالة جلسة الرفع
      operationId: getUploadSession
      x-roles: [reporter, supervisor, producer, editor_in_chief, system_admin]
      responses:
        "200":
          description: الجلسة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [uploads]
      summary: إلغاء جلسة رفع جارية
      description: >-
        يلغيها صاحبها وحده: تنتقل إلى `failed` بسبب `aborted`، ويُبطَل رمز الرفع ورموز ingest، ويُكتب حدث `upload.failed`
        في المعاملة نفسها، ويُحذف ما وصل منها من التخزين المؤقت. الأصل المكتمل لا يُلغى بهذا (`409 upload_state_conflict`
        لـ `verified` و`deduplicated`). ذاتي التكرار: جلسة ملغاة تعيد `204`.
      operationId: abortUploadSession
      x-roles: [reporter, supervisor, producer, editor_in_chief]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: أُلغيت (أو كانت ملغاة) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /uploads/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [uploads]
      summary: إعلان العميل اكتمال رفعه (مسار الرفع المباشر إلى التخزين فقط)
      description: >-
        لمسار الرفع المباشر (بند القرارات 3) يعلن العميل أنه أنهى الرفع؛ في مسار tusd لا يُستدعى هذا
        المسار لأن الاكتمال يصل من خطّاف `post-finish` إلى `/internal/tusd-hooks/{hook_token}`.
        الخادم لا يثق بأي شيء من المستدعي: يشتق مفتاح التخزين من جلسة الرفع، ويقرأ الحجم من التخزين،
        ويحسب SHA-256 دائمًا بعد التجميع. ما يرسله العميل (`reported_sha256`) معلوماتي يُقارن فقط ولا يُحفظ؛
        الاختلاف بينه وبين بصمة الخادم ينقل الجلسة إلى `failed` بسبب `checksum_mismatch`.
        لا يُقبل مفتاح تخزين من العميل بأي حال. المستدعي يجب أن يكون منشئ الجلسة (`created_by`) وإلا `404`.
        الاستدعاء المكرر لجلسة مكتملة يعيد `202` نفسها. عند تحقق الأصل يصدر رقم إيصال ويصل المراسلَ
        إشعار «تم الاستلام بنجاح».
      operationId: completeUpload
      x-roles: [reporter, supervisor, producer, editor_in_chief]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadComplete" }
      responses:
        "202": { description: قُبل؛ المعالجة غير متزامنة }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /device-attestations/challenge:
    post:
      tags: [uploads]
      summary: تحدٍّ لشهادة الجهاز (App Attest أو Play Integrity) — SEC-07
      description: تحدٍّ عشوائي 32 بايتًا، يُستهلك مرة واحدة، عمره 300 ث، مربوط بالمستخدم.
      operationId: createAttestationChallenge
      x-roles: [reporter]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: التحدي
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttestationChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /device-attestations:
    post:
      tags: [uploads]
      summary: تسجيل مفتاح App Attest للتثبيت (iOS فقط، مرة لكل تثبيت) — SEC-07
      description: >-
        يتحقق الخادم من سلسلة Apple المثبّتة والتحدي و`rpIdHash`، ويحفظ المفتاح العام وعدّاده. `key_id` معرّف تثبيت
        (بيانات كاشفة): يُخزَّن ببصمته ولا يُسجَّل ولا يُعاد. المفتاح المسجَّل لمستخدم آخر `409`.
      operationId: registerAttestationKey
      x-roles: [reporter]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttestationKeyRegistration" }
      responses:
        "201":
          description: مُسجَّل
          content:
            application/json:
              schema:
                type: object
                required: [key_ref]
                properties:
                  key_ref: { type: string, format: uuid, description: مرجع داخلي للمفتاح؛ ليس key_id }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /uploads/{id}/ingest-token:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [uploads]
      summary: رمز بوابة ingest لجلسة رفع بعد التحقق من شهادة الجهاز — SEC-07
      description: >-
        `clientData = challenge ‖ upload_session_id` (وهو `requestHash` على أندرويد). يعيد JWT ES256 بعمر ≤ 15 دقيقة
        مربوطًا بالجلسة (`aud: "ingest"`، `sid`، `iat`، `exp`، `jti`، `plat`)، تتحقق منه البوابة بالمفتاح العام وحده.
        فشل الشهادة `403 attestation_failed`، العدّاد غير المتزايد `409 assertion_replay`، التحدي المنتهي أو المستهلك
        `410 challenge_expired`، وتعذّر Google `503 attestation_unavailable` (يبقى العميل على النطاق الرئيسي إن عرضه
        الخادم). جلسة غيره أو غير موجودة `404`.
      operationId: createIngestToken
      x-roles: [reporter]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestTokenRequest" }
      responses:
        "200":
          description: الرمز
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /uploads/{id}/web-ingest-token:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [uploads]
      summary: رمز بوابة ingest لرفع الويب، يطلبه الـBFF وحده — SEC-07
      description: >-
        للمتصفح، ولا شهادة جهاز له: الـBFF يطلب الرمز باسم المستخدم المسجّل، ويُقبل من عناوين `BFF_SOURCE_ADDRESSES` وحدها
        (غيرها `404`). الرمز JWT ES256 بعمر ≤ 10 دقائق، بمطالبات رمز الجهاز نفسها مع `plat: "web"` و`ses`، أي معرّف جلسة
        الدخول. تفحصه البوابة بـ `/internal/ingest/session-status`، فإبطال جلسة الدخول يوقف الرفع. جلسة غيره أو غير
        موجودة `404`، وجلسة لا تقبل رفعًا `409`. بلا جسم.
      operationId: createWebIngestToken
      x-roles: [reporter, supervisor, producer, editor_in_chief]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: الرمز
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/ingest/session-status:
    servers:
      - url: http://api.internal:3000
        description: شبكة داخلية فقط، كخطّاف tusd؛ تستدعيه بوابة ingest
    get:
      tags: [uploads]
      summary: هل جلسة الرفع (وجلسة الدخول للويب) ما تزال تقبل الرفع؟ (داخلي، SEC-07)
      description: >-
        تسأل البوابة قبل تمرير طلبات tus. `204` = الجلسة حية ويقبل صاحبها الرفع. `403` بلا جسم لكل ما عدا ذلك: منتهية أو
        مكتملة أو فاشلة، أو رمز رفعها مبطل، أو صاحبها معلّق، أو جلسة الدخول مبطلة، أو غير موجودة. لا تمييز بينها حتى لا
        يُستدل على وجود جلسة. خارج `INTERNAL_ALLOWED_CIDRS` `404` كبقية `/internal/*`.
      operationId: ingestSessionStatus
      x-internal: true
      x-roles: []
      security: []
      parameters:
        - name: sid
          in: query
          required: true
          description: جلسة الرفع (مطالبة `sid` في الرمز)
          schema: { type: string, format: uuid }
        - name: ses
          in: query
          required: false
          description: جلسة الدخول (مطالبة `ses`)، لرموز الويب وحدها
          schema: { type: string, format: uuid }
        - name: key_class
          in: query
          required: false
          description: >-
            فئة مفتاح التوقيع الذي تحقّقت به البوابة من الرمز: `production` (الافتراضي حين يغيب) أو `qa` لمفتاح اختبار معرّفه
            (`kid`) ببادئة `qa-`. مع `qa` يرد الخادم `204` فقط إن كانت جلسة الرفع مملوكة لحساب القبول المسمّى في إعداده،
            وإلا `403` كبقية الحالات.
          schema: { type: string, enum: [production, qa], default: production }
      responses:
        "204": { description: الجلسة حية ويقبل صاحبها الرفع }
        "403": { description: لا تقبل رفعًا (بلا جسم ولا تمييز للسبب) }
        "404": { description: الطلب من خارج الشبكة الداخلية }

  /internal/tusd-hooks/{hook_token}:
    servers:
      - url: http://api.internal:3000
        description: شبكة داخلية فقط؛ لا يمر عبر Cloudflare ولا يُكشف على الإنترنت
    parameters:
      - name: hook_token
        in: path
        required: true
        description: >-
          رمز عشوائي من متغير البيئة `TUSD_HOOK_SECRET` يحقنه الإعداد في عنوان الخطّاف
          (`-hooks-http=…/internal/tusd-hooks/$TUSD_HOOK_SECRET`)؛ يُقارن بزمن ثابت ويُحجب من سجلات الوصول.
        schema: { type: string, minLength: 32, maxLength: 128 }
    post:
      tags: [uploads]
      summary: مُستقبِل خطّافات tusd (داخلي؛ pre-create وpost-finish) — ADR SEC-06
      x-internal: true
      description: >-
        نقطة واحدة تستقبل أحداث tusd بصيغته (نوع الحدث في الجسم). `pre-create`: يتحقق الخادم من رمز
        الرفع في ترويسة `Authorization` المُمرَّرة من tusd، ومن أن `upload_session_id` في البيانات الوصفية
        يخص جلسة بحالة `created`/`in_progress` لم تنتهِ صلاحيتها وحجمها يطابق `Upload.Size`، وإلا يرفض
        الرفع. `post-finish`: يسجّل الاكتمال ويكتب حدث Outbox داخل المعاملة نفسها ويطلق التجميع والتحقق؛
        مفتاح التخزين يُقرأ من `Upload.Storage` ويُطابَق مع ما تتوقعه الجلسة، ولا تُحفظ أي بصمة من الخطّاف.
        التكرار (tusd يعيد المحاولة) يعيد `200` نفسها بمعرّف الرفع. مصادقة المستدعي: الرمز في المسار
        + العزل الشبكي؛ mTLS عبر وسيط خيار للإنتاج (وكيل الرفع والبنية).
      operationId: tusdHook
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TusdHookRequest" }
      responses:
        "200":
          description: استجابة الخطّاف بصيغة tusd (قد ترفض الرفع في pre-create)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TusdHookResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /health:
    servers:
      - url: http://api.internal:3000
        description: فحص تشغيلي خارج /v1؛ لا يكشف إصدارات ولا تفاصيل أخطاء
    get:
      tags: [events]
      summary: صحة الخادم وحالة حد المعدل (داخلي)
      x-internal: true
      operationId: getHealth
      x-roles: []
      security: []
      responses:
        "200":
          description: يعمل (قد يكون حد المعدل في الوضع المتدهور)
          headers:
            X-Rate-Limiter: { $ref: "#/components/headers/RateLimiterDegraded" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "404":
          description: الطلب من خارج الشبكة الداخلية حين يُقصر المسار عليها عند النشر
        "503":
