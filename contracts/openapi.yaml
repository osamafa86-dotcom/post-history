        description: النسخة الخفيفة
        schema: { type: string, format: uuid }
    put:
      tags: [uploads]
      summary: تسجيل المحاذاة الصوتية بين النسخة الخفيفة والأصل (داخلي، v0.3)
      x-internal: true
      description: >-
        يستبدل محاذاة النسخة الخفيفة بما قاسه العامل؛ الطلب نفسه يعيد الأثر نفسه. الملف غير `proxy`، أو `original_file_id` ليس
        أصل المادة نفسها، `422`. الملف غير الموجود برمز صحيح `410 media_resource_gone`.
      operationId: mediaPutAlignment
      x-roles: []
