        المشتري: نسخة منخفضة بعلامة مائية مرئية، زمنية كـ `proxy`، لا تظهر في `Material.files` ولا يعطيها غير رابط الكتالوج. `shot_list` (`application/json`، قائمة اللقطات
        من عامل الذكاء الاصطناعي) زمني وحساس كالتفريغ والترجمة (threat-model §9.1): يقرؤه من يعدّل المادة وحده، ولا يدخل تصديرًا
        ولا إشعارًا ولا حدثًا ولا فهرس بحث، و`ai.draft_ready` لا تتغير حمولته.
        `delivery` (v0.3، ADR 0025 الجزء 9) حزمة تسليم المشتري لترخيص بعينه: `application/zip`، و`technical` هو `technical`
        الأصل كـ `export`، و`license_id` إلزامي معه وممنوع لغيره. متساوٍ الأثر على (`derived_from_id`، `license_id`): لكل
        ترخيص حزمته. لا تظهر في `Material.files`، ويُنزّلها المشتري من الترخيص وحده، ولا تضم التفريغ (R11).
        `produced` (v0.3، ADR 0025 الجزء 9) التصدير النهائي: `video/mp4` زمني كـ `proxy` بـ `technical` الناتج، يكتبه عامل
        الوسائط وحده من `render` (نقاط قص المصدر). لا نقطة محرر ولا واجهة تحرير، ولا ترجمة ولا تفريغ محروق فيه (R11)، وهو
        وحده ما يقبله `produced_file_id` في `license.delivery_requested`.
      properties:
        kind: { type: string, enum: [proxy, thumbnail, hls, audio, export, transcript, captions, watermarked_preview, shot_list, delivery, produced] }
        license_id: { type: string, format: uuid, description: لـ `delivery` وحده }
        storage_key: { type: string, minLength: 1, maxLength: 1024, pattern: "^[A-Za-z0-9/_.-]+$" }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        size_bytes: { type: integer, minimum: 1 }
        mime_type:
          type: string
          description: "`application/json` لموجة الصوت (`audio`، #93)"
          enum: [image/jpeg, image/webp, video/mp4, application/vnd.apple.mpegurl, audio/mp4, application/json, application/zip, text/vtt]
        technical: { $ref: "#/components/schemas/MediaTechnical" }
      allOf:
        - if: { properties: { kind: { const: thumbnail } } }
          then:
            required: [mime_type]
            properties:
              mime_type: { enum: [image/jpeg, image/webp] }
              technical:
                required: [width, height]
                properties: { width: { type: integer }, height: { type: integer } }
          else: { properties: { technical: { required: [duration_ms, start_pts_us] } } }
        - if: { properties: { kind: { const: export } } }
          then: { required: [mime_type], properties: { mime_type: { const: application/zip } } }
        - if: { properties: { kind: { const: delivery } }, required: [kind] }
          then: { required: [mime_type, license_id], properties: { mime_type: { const: application/zip } } }
          else: { not: { required: [license_id] } }
        - if: { properties: { kind: { const: transcript } } }
          then: { required: [mime_type], properties: { mime_type: { const: application/json } } }
        - if: { properties: { kind: { const: captions } } }
          then: { required: [mime_type], properties: { mime_type: { const: text/vtt } } }
        - if: { properties: { kind: { const: shot_list } } }
          then: { required: [mime_type], properties: { mime_type: { const: application/json } } }
        - if: { properties: { kind: { const: produced } } }
          then: { required: [mime_type], properties: { mime_type: { const: video/mp4 } } }

