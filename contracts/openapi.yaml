        التصعيد متتالية من 1 بلا فجوات و`after_seconds` متزايد، وإلا `422 validation_failed`.
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: اسم إداري؛ لا يظهر في أي إشعار }
        event_type:
          type: string
          description: أحداث المواد والرفع ومسودة الذكاء الاصطناعي وحدها (schemas/outbox-event.json)
          enum:
            - material.created
            - material.urgent_received
            - material.updated
            - material.version_created
            - material.technical_transition
            - material.editorial_transition
            - material.rights_transition
            - material.acknowledged
            - material.change_requested
            - material.accepted_for_production
            - material.reserved
            - material.released
            - material.contributors_set
            - material.published
            - upload.started
            - upload.proxy_received
            - upload.original_received
            - upload.verified
            - upload.deduplicated
            - upload.failed
            - ai.draft_ready
        priorities:
          type: [array, "null"]
          minItems: 1
          uniqueItems: true
          description: "`null` = كل الأولويات"
          items: { $ref: "#/components/schemas/Priority" }
        material_types:
          type: [array, "null"]
          minItems: 1
          uniqueItems: true
          description: "`null` = كل الأنواع"
          items: { $ref: "#/components/schemas/MaterialType" }
        scope_kind:
          type: string
          enum: [all, office, governorate]
          default: all
          description: كنطاق الأدوار؛ القاعدة تنطبق على مواد هذا المكتب أو هذه المحافظة وحدها
        scope_id: { type: string, maxLength: 200, default: "", description: معرّف المكتب أو اسم المحافظة؛ فارغ مع `all` }
        recipient_roles:
          type: array
          uniqueItems: true
          default: []
          items: { $ref: "#/components/schemas/RoleName" }
        recipient_permissions:
          type: array
          uniqueItems: true
          default: []
          items: { $ref: "#/components/schemas/Permission" }
        channels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/NotificationChannel" }
        delay_seconds: { type: integer, minimum: 0, maximum: 86400, default: 0 }
        quiet_hours:
          type: [object, "null"]
          additionalProperties: false
          required: [start, end, timezone]
          description: لا تنطبق على `urgent`؛ ما يقع فيها يُؤجَّل إلى نهايتها أو يدخل الملخص
          properties:
