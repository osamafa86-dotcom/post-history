        "404": { $ref: "#/components/responses/NotFound" }

  /uploads/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [uploads]
      summary: إعلان العميل اكتمال رفعه (مسار الرفع المباشر إلى التخزين فقط)
      description: >-
        لمسار الرفع المباشر (بند القرارات 3) يعلن العميل أنه أنهى الرفع؛ في مسار tusd لا يُستدعى هذا
        المسار لأن الاكتمال يصل من خطّاف `post-finish` إلى `/internal/tusd-hooks/{hook_token}`.
        الخادم لا يثق بأي شيء من المستدعي: يشتق مفتاح التخزين من جلسة الرفع، ويقرأ الحجم من التخزين،
        ويحسب SHA-256 دائمًا بعد التجميع. ما يرسله العميل (`reported_sha256`) معلوماتي يُقارن فقط ولا يُحفظ؛
        الاختلاف بينه وبين بصمة الخادم ينقل الجلسة إلى `failed` بسبب `checksum_mismatch`.
        لا يُقبل مفتاح تخزين من العميل بأي حال. المستدعي يجب أن يكون منشئ الجلسة (`created_by`) وإلا `404`.
        الاستدعاء المكرر لجلسة مكتملة يعيد `202` نفسها. عند تحقق الأصل يصدر رقم إيصال ويصل المراسلَ
        إشعار «تم الاستلام بنجاح».
      operationId: completeUpload
      x-roles: [reporter]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadComplete" }
      responses:
        "202": { description: قُبل؛ المعالجة غير متزامنة }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /internal/tusd-hooks/{hook_token}:
    servers:
      - url: http://api.internal:3000
        description: شبكة داخلية فقط؛ لا يمر عبر Cloudflare ولا يُكشف على الإنترنت
    parameters:
      - name: hook_token
        in: path
        required: true
        description: >-
          رمز عشوائي من متغير البيئة `TUSD_HOOK_SECRET` يحقنه الإعداد في عنوان الخطّاف
          (`-hooks-http=…/internal/tusd-hooks/$TUSD_HOOK_SECRET`)؛ يُقارن بزمن ثابت ويُحجب من سجلات الوصول.
        schema: { type: string, minLength: 32, maxLength: 128 }
    post:
      tags: [uploads]
      summary: مُستقبِل خطّافات tusd (داخلي؛ pre-create وpost-finish) — ADR SEC-06
      x-internal: true
      description: >-
        نقطة واحدة تستقبل أحداث tusd بصيغته (نوع الحدث في الجسم). `pre-create`: يتحقق الخادم من رمز
        الرفع في ترويسة `Authorization` المُمرَّرة من tusd، ومن أن `upload_session_id` في البيانات الوصفية
        يخص جلسة بحالة `created`/`in_progress` لم تنتهِ صلاحيتها وحجمها يطابق `Upload.Size`، وإلا يرفض
        الرفع. `post-finish`: يسجّل الاكتمال ويكتب حدث Outbox داخل المعاملة نفسها ويطلق التجميع والتحقق؛
        مفتاح التخزين يُقرأ من `Upload.Storage` ويُطابَق مع ما تتوقعه الجلسة، ولا تُحفظ أي بصمة من الخطّاف.
        التكرار (tusd يعيد المحاولة) يعيد `200` نفسها بمعرّف الرفع. مصادقة المستدعي: الرمز في المسار
        + العزل الشبكي؛ mTLS عبر وسيط خيار للإنتاج (وكيل الرفع والبنية).
      operationId: tusdHook
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TusdHookRequest" }
      responses:
        "200":
          description: استجابة الخطّاف بصيغة tusd (قد ترفض الرفع في pre-create)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TusdHookResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /health:
