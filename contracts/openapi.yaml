  /orders:
    get:
      tags: [commerce]
      summary: الطلبات (v0.3، ADR 0025 الجزء 4)
      description: >-
        `buyer_admin` يرى طلبات مؤسسته، و`buyer_member` ما أنشأه منها وحده؛ طلب مؤسسة أخرى لا يظهر (عزل المستأجرين).
        المالية ومدير النظام يرون الكل ويصفّون بالمؤسسة.
      operationId: listOrders
      x-roles: [system_admin, finance, buyer_admin, buyer_member]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: organization_id
          in: query
          description: للطاقم وحده؛ يُتجاهل للمشتري (نطاقه مؤسسته)
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: صفحة من الطلبات، الأحدث أولًا
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [commerce]
      summary: إنشاء طلب من عروض الكتالوج
      description: >-
        السلة حالة في العميل، والطلب يُنشأ منها مرة واحدة. كل بند يجمّد إصدار المادة المعروض، والإصدار الحالي لقالب
        الترخيص بشروطه، والسعر (الخاص أو الأساسي) — قيدًا في القاعدة. الطلب بعملة واحدة (`422 mixed_currency`)، وبند واحد
        لكل إدراج. الإدراج غير المعروض أو العرض الغائب أو القالب المعطّل `409 listing_unavailable`. `expected_total` إن
        أُرسل ولم يطابق المجموع `409 price_changed` بلا أثر.
