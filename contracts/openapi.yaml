openapi: 3.1.0
info:
  title: post-history API
  version: 0.3.0
  summary: واجهة منصة المكتبة المرئية — الإصدار v0 لمرحلة التأسيس
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    واجهة منصة المكتبة المرئية لشبكة فلسطين بوست — الإصدار v0 لمرحلة التأسيس (الرفع، المواد بحالاتها
    الثلاث، النماذج الديناميكية، الوارد الحي، الإشعارات). لا متجر ولا دفتر أستاذ ولا محرر في هذا الإصدار.

    ## القواعد الحاكمة

    - **الحالات الثلاث مستقلة:** لكل مادة `technical_state` (ماذا وصل) و`editorial_state` (من وافق)
      و`rights_state` (ما يُسمح به). لا حقل حالة واحد، وكل انتقال يُسجَّل بمن نفّذه ومتى ولماذا.
    - **مفتاح منع التكرار على كل كتابة منشئة للموارد:** كل طلب `POST`/`PUT`/`PATCH`/`DELETE` خارج `/auth/*` يحمل ترويسة `Idempotency-Key`
      (نص عشوائي من 8 إلى 128 حرفًا، يولّده العميل مرة واحدة لكل عملية ويعيد استخدامه عند إعادة المحاولة).
      المفتاح مقيّد بالمستخدم ويُحفظ 24 ساعة. التكرار بالمفتاح نفسه والجسم نفسه يعيد الاستجابة الأولى
      نفسها (الحالة والجسم). المفتاح نفسه بجسم مختلف يُرفض بـ `422 idempotency_key_reused`، والطلب الذي
      ما زال قيد التنفيذ بالمفتاح نفسه يُرفض بـ `409 idempotency_in_progress`. مسارات الهوية (`/auth/*`)
      مستثناة: استجاباتها تحمل رموزًا ولا يجوز حفظها في جدول المفاتيح، وتكرارها آمن بطبيعته (الدخول يصدر
      جلسة جديدة، والتحديث يدوّر الرمز، والإبطال والخروج والاسترداد ذاتية التكرار).
    - **Outbox:** كل تغيير حالة يكتب حدثًا بمخطط `schemas/outbox-event.json` في جدول Outbox داخل معاملة
      الحفظ نفسها؛ مُرسل مستقل يقرأه ويوزّعه على القنوات. التحديثات اللحظية تصل عبر WebSocket على
      `/v1/ws` بالأحداث نفسها.
    - **النماذج الديناميكية بإصدار:** الحقول الديناميكية تُحفظ مع `form_version` ولا تُفسَّر دون نسخة
      النموذج. النموذج بمخطط `schemas/upload-form.json`.
    - **لا بيانات كاشفة:** الإحداثيات الدقيقة (`gps`) تُكتب ولا تُقرأ من هذه الواجهة، وتُخزَّن مشفرة.
      حمولات الإشعارات والأحداث تحمل رقم المادة وحالتها فقط.
    - **الإصدار في المسار** (`/v1`). كسر التوافق يعني `/v2`، لا تعديل صامت.
    - **الأدوار على كل مسار (`x-roles`):** كل عملية تحمل قائمة الأدوار المسموح لها؛ `authenticated` = أي
      دور بجلسة صالحة، والقائمة الفارغة = بلا مصادقة. النطاق يُطبَّق في طبقة الاستعلام: المراسل يرى
      مواده، والمشرف مواد مراسلي نطاقه (مكتب أو محافظة)، والإنتاج المواد المقبولة للإنتاج،
      ورئيس التحرير ومدير النظام ومسؤول الحقوق كل المواد. ما خارج النطاق يعود `404`.
    - **الصلاحيات المستقلة (`x-permissions`، ADR SEC-03):** رؤية القيم الكاشفة ليست دورًا بل صلاحية تُمنح
      لمستخدم بعينه وتُسحب: `sensitive_location:read` لحقول الموقع، و`protected_source:read` للحقول الموسومة
      `sensitive`. لا منح افتراضي لأي دور ولا لمدير النظام تلقائيًا (يمنح نفسه صراحة). العملية التي تحمل
      `x-permissions` تعيد القيم غير المحجوبة لحامل الصلاحية فقط، وكل منح وسحب وكل قراءة فعلية لقيمة
      غير محجوبة تُسجَّل في سجل التدقيق. الصلاحيات الحالية للمستخدم في `Me.permissions`.
    - **قاعدة الحجب:** قيم `dynamic_fields` التي حقلها في إصدار النموذج موسوم `sensitive` أو من نوع
      `location` تُحذف من كل استجابة (المفتاح غائب ويُذكر في `redacted_field_keys`) إلا لمن يحمل الصلاحية
      المقابلة، ولا تدخل أي إشعار أو حدث أو تصدير أو قناة خارجية بأي صلاحية. في v0 يرفض `POST /forms`
      هذه الحقول أصلًا (بوابة v0 حتى SEC-04). الإحداثيات `gps` لا تعود لأحد من هذه الواجهة.
    - **خطّافات tusd داخلية (ADR SEC-06):** تصل إلى `/internal/tusd-hooks/{hook_token}` خارج `/v1`،
      معزولة شبكيًا وبرمز من البيئة؛ العام لا يرى هذه النقطة.

    - **v0.1 (بعد تجميد الدورة الأولى، ADR 0012):** إضافات لا تكسر عملاء v0 فقط. الحقل الجديد في استجابة
      اختياري للعميل، والترويسة الجديدة في طلب اختيارية؛ ما يكسر يذهب إلى `/v2`. قيم `Error.code` قائمة مفتوحة:
      على العميل معاملة الرمز المجهول كخطأ عام بحسب حالة HTTP.
    - **التزامن المتفائل:** `GET` للمادة يعيد `ETag: "<row_version>"`، وتعديلاتها (`PATCH`، الانتقال، المساهمون،
      الحجز) تقبل `If-Match` اختياريًا؛ عدم المطابقة `412 precondition_failed` دون أي أثر. نشر النموذج يقبل
      `If-Match: "<الإصدار الحالي>"` بالمعنى نفسه إضافة إلى شرط `version = الحالي + 1`.
    - **نطاق ingest (SEC-07، ADR 0011):** حين `UploadSession.ingest_token_required` يرسل العميل ترويسة
      `Ingest-Token: <JWT>` على كل طلب tus مع `Authorization: Bearer <upload token>`. ردود البوابة بلا جسم: `401` (مفقود
      أو تالف أو منتهٍ: رمز جديد ثم HEAD)، `403` (رمز لجلسة أخرى)، `429` (حد المعدل).
    - **الأحجام** بالبايت في الحقول، وحيث يُذكر «ميغابايت» فالمقصود MiB = 1,048,576 بايت.

    ## الأخطاء

    كل استجابة `4xx`/`5xx` جسمها `Error` برمز ثابت (`code`) يمكن للعملاء التفرّع عليه، ورسالة بشرية،
    و`request_id` لتتبع الطلب في السجلات.
servers:
  - url: https://api.example.invalid/v1
    description: يُستبدل بنطاق الشبكة عند النشر


tags:
  - name: auth
    description: الهوية — الدخول بكلمة المرور ورمز TOTP، تحديث الجلسة، واستعادة الحساب بمساعدة المشرف.
  - name: materials
    description: المواد بحالاتها الثلاث المستقلة، وسجل انتقالاتها، والمساهمون وحصصهم، وحجز الإنتاج.
  - name: uploads
    description: جلسات الرفع المجزّأ القابل للاستئناف (tus) للأصل والنسخة الخفيفة والملاحظة الصوتية.
  - name: forms
    description: نموذج الرفع الديناميكي الذي تضبطه الإدارة، بإصدارات غير قابلة للتعديل.
  - name: notifications
    description: صندوق الوارد والإشعارات وتسجيل أجهزة الهاتف؛ التمييز بين «أُسند» و«أقرّ الاستلام».
  - name: events
    description: قراءة أحداث Outbox للوحة الإدارة والمراقبة.
  - name: admin
    description: إعدادات مؤسسية يضبطها مدير النظام.
  - name: dashboard
    description: قراءات مجمّعة للوحة غرفة الأخبار، بلا بيانات كاشفة (v0.2).
  - name: earnings
    description: أرباح المساهمين وطلبات الصرف التجريبية (v0.3، ADR 0033) — الرصيد من الدفتر، ولا قناة صرف حقيقية.
  - name: commerce
    description: المرحلة التجارية بمزوّد دفع تجريبي (v0.3، ADR 0025) — قوالب التراخيص، والإدراج، والكتالوج، والطلبات والدفع، والتراخيص الصادرة.

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: دخول بكلمة المرور ثم رمز TOTP
      description: >-
        المصادقة الثنائية إلزامية لكل الطاقم بعد التفعيل؛ غياب `totp_code` لحساب مفعَّل يعيد
        `401 totp_required` (لا يُعاد إلا بعد التحقق من كلمة المرور وضمن حد المعدل). البريد غير الموجود
        وكلمة المرور الخاطئة يعيدان `401 unauthorized` نفسه بالرسالة نفسها. الجلسة تحمل رمز وصول قصير العمر
        ورمز تحديث.
      operationId: login
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: جلسة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: تحديث الجلسة برمز التحديث
      description: يبطل رمز التحديث المستخدم ويصدر زوجًا جديدًا (تدوير). الرمز المبطَل مسبقًا يعيد `401`.
      operationId: refreshSession
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: جلسة جديدة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /auth/logout:
    post:
      tags: [auth]
      summary: إنهاء الجلسة الحالية أو كل جلسات المستخدم (عند فقد الهاتف)
      operationId: logout
      x-roles: [authenticated]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                all_sessions:
                  type: boolean
                  default: false
                  description: إبطال كل جلسات المستخدم ورموز تحديثه ورموز الرفع المفتوحة على كل الأجهزة
      responses:
        "204": { description: أُنهيت }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      tags: [auth]
      summary: المستخدم الحالي وأدواره ونطاقاته
      operationId: getMe
      x-roles: [authenticated]
      responses:
        "200":
          description: المستخدم
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/sessions:
    get:
      tags: [auth]
      summary: جلسات المستخدم الحالي على كل أجهزته
      description: لعرض «أين أنا مسجَّل» وإبطال ما ليس له؛ لا معرّفات أجهزة، فقط معرّف التثبيت الذي ولّده التطبيق.
      operationId: listSessions
      x-roles: [authenticated]
      responses:
        "200":
          description: الجلسات النشطة
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UserSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: معرّف الجلسة
        schema: { type: string, format: uuid }
    delete:
      tags: [auth]
      summary: إبطال جلسة عن بُعد (فقد الهاتف)
      description: >-
        يبطل رمز التحديث ويُسقط رمز الوصول المرتبط عند أول طلب تالٍ (الإبطال يُفحص عند كل طلب).
        المستخدم يبطل جلساته، ومشرف النطاق أو مدير النظام يبطل جلسات مراسل في نطاقه بعد بلاغ فقد الهاتف؛
        يُسجَّل في سجل التدقيق.
      operationId: revokeSession
      x-roles: [authenticated, supervisor, system_admin]
      responses:
        "204": { description: أُبطلت }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/recovery:
    post:
      tags: [auth]
      summary: بدء استعادة الحساب عند فقد الهاتف (رمز احتياطي ثم اعتماد المشرف)
      description: >-
        يتحقق الخادم من الرمز الاحتياطي ويفتح طلب استعادة بانتظار اعتماد مشرف نطاق المراسل، الذي يصله
        معرّف الطلب عبر إشعار داخلي لا عبر هذه الاستجابة. الاستجابة `202` نفسها سواء صحّ الرمز أم لا
        (لا كشف لصحة الرموز الاحتياطية)، مع حد معدل لكل بريد ولكل عنوان IP وإقفال بعد محاولات متكررة.
        لا يصدر رمز وصول قبل الاعتماد، ولا تُبطل الجلسات القائمة إلا عند اعتماد المشرف (رمز مسرّب لا يكفي
        لإخراج المراسل من أجهزته)؛ الطلب الصحيح يُسجَّل في التدقيق ويصل المراسلَ تنبيه على أجهزته القائمة.
      operationId: startRecovery
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, backup_code]
              properties:
                email: { type: string, format: email }
                backup_code: { type: string, minLength: 10, pattern: "^[A-Z2-7]{10,}$", writeOnly: true, description: base32 بطول 10 فأكثر }
      responses:
        "202":
          description: قُبل الطلب (الاستجابة نفسها لأي رمز؛ لا تدل على صحته)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryAccepted" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/recovery/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        description: معرّف طلب الاستعادة
        schema: { type: string, format: uuid }
    post:
      tags: [auth]
      summary: اعتماد المشرف لطلب استعادة حساب في نطاقه
      description: >-
        يعتمد المشرف الطلب بعد التحقق خارج النظام من هوية المراسل. الاعتماد يبطل كل جلسات الحساب ورموز
        رفعه المفتوحة، ويعيد رمز إعادة التعيين **مرة واحدة** في هذه الاستجابة للمشرف المعتمِد، الذي يسلّمه للمراسل خارج
        النظام. الرمز حساس: لا يدخل سجلًا ولا Outbox ولا إشعارًا، ويُخزَّن ببصمته فقط، وصلاحيته ≤ 24 ساعة، ومربوط بالحساب
        المستعاد. لا `Idempotency-Key` هنا (مسارات `/auth/*`) كي لا يُحفظ الرمز في جدول المفاتيح؛ إعادة اعتماد طلب معتمد ترد `409 recovery_state_conflict` ولا تعيد الرمز. الحساب في حالة
        «إعادة تعيين إلزامية» حتى `/auth/recovery/complete` و`/auth/totp/confirm`، والاعتماد يُسجَّل في التدقيق.
        حساب مدير نظام لا يُعتمد من هنا أبدًا: `403 admin_quorum_required` (إجراء الشخصين من سطر الأوامر، ADR 0005
        ودليل التشغيل). حساب مساوٍ لدور المقرِّر أو أعلى: `403 forbidden_scope`.
      operationId: approveRecovery
      x-roles: [supervisor, system_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_note]
              properties:
                verification_note:
                  type: string
                  minLength: 1
                  description: كيف تحقق المشرف من الهوية (يُسجَّل في التدقيق)
      responses:
        "200":
          description: الطلب بعد الاعتماد، ومعه رمز إعادة التعيين في الاستجابة الأولى فقط
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryApproval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/recovery/complete:
    post:
      tags: [auth]
      summary: إكمال الاستعادة — كلمة مرور جديدة وبدء تسجيل مصادقة ثنائية جديدة
      description: >-
        يستهلك رمز إعادة التعيين (مرة واحدة) ويضع كلمة المرور الجديدة ويولّد سر TOTP جديدًا، ويبطل السر القديم فورًا
        (فلا دخول عاديًا بعدها حتى `/auth/totp/confirm`). الجلسة الناتجة مقيّدة: المسموح فقط `/auth/totp/confirm`
        و`/auth/logout` و`/auth/me` و`/auth/refresh`، وكل مسار آخر يرد `403 credential_reset_required`. تحديث الجلسة
        المقيّدة مسموح حتى `reset_token_expires_at` للطلب ثم يُرفض `401`؛ ما بعد هذه المهلة دون تأكيد يستلزم استعادة
        جديدة من أولها. الرمز المستهلك أو المنتهي `401`. حد المعدل بمفتاح بصمة الرمز (لا بالعنوان وحده). الإكمال يُسجَّل في
        التدقيق (`recovery_request_id`، `approved_by`) ويُطلق حدث `auth.recovery_completed` الذي يُشعر القناة المسجّلة للحساب.
      operationId: completeRecovery
      x-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, new_password]
              properties:
                reset_token: { type: string, minLength: 32, maxLength: 256, writeOnly: true }
                new_password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
      responses:
        "200":
          description: جلسة مقيّدة وبيانات تسجيل TOTP الجديدة (تُعرض مرة واحدة)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCompletion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/totp/confirm:
    post:
      tags: [auth]
      summary: تأكيد تسجيل المصادقة الثنائية الجديدة ورفع قيد الجلسة
      operationId: confirmTotp
      x-roles: [authenticated]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totp_code]
              properties:
                totp_code: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }
      responses:
        "200":
          description: جلسة كاملة جديدة (تبطل المقيّدة)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        description: معرّف المستخدم
        schema: { type: string, format: uuid }
    put:
      tags: [auth]
      summary: تعليق حساب أو إعادة تفعيله (مدير النظام)
      description: >-
        التعليق يبطل كل جلسات الحساب ورموز رفعه فورًا؛ إعادة التفعيل لا تعيد الجلسات. لا يعلّق المدير حسابه، وحساب مدير
        نظام آخر لا يُعلَّق من هنا: `403 admin_quorum_required`. ذاتي التكرار. يُسجَّل في التدقيق بـ `reason_code`
        (`suspended` أو `reactivated`) وحده؛ لا نص حر (SEC-03).
      operationId: setUserStatus
      x-roles: [system_admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        "204": { description: طُبِّق (أو كان مطبَّقًا) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /users/{id}/permissions/history:
    parameters:
      - name: id
        in: path
        required: true
        description: معرّف المستخدم
        schema: { type: string, format: uuid }
    get:
      tags: [auth]
      summary: سجل منح الصلاحيات المستقلة وسحبها لمستخدم (مدير النظام)
      description: |-
        من سجل التدقيق، الأحدث أولًا، بالمؤشر:
        - منح هذا المستخدم صلاحياته المستقلة وسحبها.
        - تغييرات الإعداد `reporter_legal_name_access` (ADR 0021)، لأنها تغيّر الصلاحية الفعّالة للاسم الحقيقي لكل المستخدمين.

        معرّفات وأكواد فقط. سبب المنح الحر في `user_permissions.reason` لا يعود هنا. `reason_code` يعود حيث سُجّل
        مرمّزًا، وهو `null` لغيره.
      operationId: listPermissionHistory
      x-roles: [system_admin]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: صفحة من السجل
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionHistoryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}/permissions/{permission}:
    parameters:
      - name: id
        in: path
        required: true
        description: معرّف المستخدم
        schema: { type: string, format: uuid }
      - name: permission
        in: path
        required: true
        description: الصلاحية
        schema: { $ref: "#/components/schemas/Permission" }
    put:
      tags: [auth]
      summary: منح صلاحية مستقلة لمستخدم بعينه (مدير النظام)
      description: >-
        المنح لا يأتي من الدور؛ مدير النظام يمنحه صراحة حتى لنفسه. ذاتي التكرار: المنح القائم يعيد `204`
        نفسها. يُسجَّل في سجل التدقيق من منح ولمن ومتى ولماذا.
      operationId: grantPermission
      x-roles: [system_admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, description: سبب المنح؛ يُحفظ في سجل الصلاحيات لا في تفاصيل التدقيق }
      responses:
        "204": { description: مُنحت (أو كانت ممنوحة) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    delete:
      tags: [auth]
      summary: سحب صلاحية مستقلة (مدير النظام)
      description: السحب يسري عند الطلب التالي. ذاتي التكرار. يُسجَّل في سجل التدقيق.
      operationId: revokePermission
      x-roles: [system_admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: سُحبت (أو لم تكن ممنوحة) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /materials:
    get:
      tags: [materials]
      summary: قائمة المواد ضمن نطاق المستخدم
      description: >-
        النطاق يُطبَّق في طبقة الاستعلام: المراسل يرى مواده فقط، والمشرف مواد مراسلي نطاقه،
        والإنتاج المواد المقبولة للإنتاج. الترتيب الافتراضي الأحدث أولًا.
      operationId: listMaterials
      x-roles: [reporter, supervisor, producer, editor_in_chief, rights_officer, system_admin]
      x-permissions: [sensitive_location:read, protected_source:read, reporter_identity:read]
      parameters:
        - name: editorial_state
          in: query
          description: تصفية بالحالة التحريرية
          schema: { $ref: "#/components/schemas/EditorialState" }
        - name: technical_state
          in: query
          description: تصفية بالحالة الفنية
          schema: { $ref: "#/components/schemas/TechnicalState" }
        - name: rights_state
          in: query
          description: تصفية بحالة الحقوق
          schema: { $ref: "#/components/schemas/RightsState" }
        - name: priority
          in: query
          description: تصفية بالأولوية
          schema: { $ref: "#/components/schemas/Priority" }
        - name: governorate
          in: query
          description: محافظة التصوير
          schema: { type: string }
        - name: reporter_id
          in: query
          description: المراسل (ضمن نطاق المستخدم)
          schema: { type: string, format: uuid }
        - name: shot_after
          in: query
          description: تاريخ التصوير من (شامل)
          schema: { type: string, format: date-time }
        - name: shot_before
          in: query
          description: تاريخ التصوير إلى (غير شامل)
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          description: >-
            الترتيب (v0.2): الأحدث إنشاءً (الافتراضي)، الأقدم إنشاءً، الأحدث تصويرًا، الأحدث تعديلًا. لكل قيمة فهرس مؤشر
            (ADR 0002)؛ المؤشر يخص الترتيب الذي صدر به، وتغيير `sort` مع مؤشر قديم `400`.
          schema:
            type: string
            enum: [created_desc, created_asc, shot_desc, updated_desc]
            default: created_desc
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: صفحة مواد
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [materials]
      summary: إنشاء سجل مادة قبل بدء الرفع (يطلق إشعار «مادة واردة»)
      description: >-
        تُنشأ المادة بحالاتها الابتدائية `pending`/`inbox`/`unknown` وبحدث `material.created`
        (و`material.urgent_received` إن كانت الأولوية عاجلة) في Outbox داخل المعاملة نفسها.
        يتحقق الخادم من `dynamic_fields` بمخطط النموذج ذي الإصدار `form_version`. إن أُرسل `contributors`
        وجب أن يكون مجموع الحصص 100 بالضبط وإلا `422 shares_not_100`. ينشئها المراسل من التطبيق، أو الطاقم والإنتاج
        من الويب لملفات الكاميرات (#88). `reporter_id` هو المنشئ في الحالتين، والمادة تقع في نطاقه وفي نطاق مكتبه.
      operationId: createMaterial
      x-roles: [reporter, supervisor, producer, editor_in_chief]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialCreate" }
      responses:
        "201":
          description: المادة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /materials/{id}:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      tags: [materials]
      summary: قراءة مادة
      operationId: getMaterial
      x-roles: [reporter, supervisor, producer, editor_in_chief, rights_officer, system_admin]
      x-permissions: [sensitive_location:read, protected_source:read, reporter_identity:read]
      responses:
        "200":
          description: المادة
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [materials]
      summary: تعديل الحقول الوصفية (لا الحالات)
      description: >-
        تعديل مادة بعد الاعتماد (`accepted` فما بعد) يرفع `version` ويعيد الحالة التحريرية إلى
        `final_review` لأن ما يُعتمد هو إصدار محدد. الحالات لا تُعدَّل هنا بل عبر `transitions`.
      operationId: updateMaterial
      x-roles: [reporter, supervisor, editor_in_chief, system_admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialUpdate" }
      responses:
        "200":
          description: المادة بعد التعديل
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /materials/{id}/transitions:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      tags: [materials]
      summary: سجل انتقالات المادة في المسارات الثلاثة
      operationId: listTransitions
      x-roles: [reporter, supervisor, producer, editor_in_chief, rights_officer, system_admin]
      responses:
        "200":
          description: الانتقالات بترتيب وقوعها
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TransitionRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [materials]
      summary: انتقال في أحد المسارات الثلاثة (تحريري، فني، حقوق) مع السبب
      description: |
        الانتقالات المسموحة في v0 (ما ليس هنا يُرفض بـ `409 invalid_transition`):

        | المسار | من | إلى | من يملكه |
        | --- | --- | --- | --- |
        | technical | pending | proxy_received, original_received, failed | الخادم (hook الرفع) |
        | technical | proxy_received | original_received, failed | الخادم |
        | technical | original_received | verified, failed | الخادم (بعد مطابقة البصمة) |
        | technical | failed | pending | المراسل (إعادة الرفع) |
        | editorial | inbox | acknowledged, rejected | المشرف |
        | editorial | acknowledged | reviewing, rejected | المشرف |
        | editorial | reviewing | needs_changes, accepted, rejected | المشرف |
        | editorial | needs_changes | reviewing | المراسل (بعد الرد) |
        | editorial | accepted | in_production | الإنتاج (عبر الحجز) |
        | editorial | in_production | final_review, accepted | الإنتاج |
        | editorial | final_review | published, in_production | رئيس التحرير |
        | editorial | published | final_review | رئيس التحرير (إصدار جديد) |
        | rights | unknown | documented | مسؤول الحقوق |
        | rights | documented | sellable, blocked | مسؤول الحقوق (sellable في المرحلة التجارية) |
        | rights | sellable | blocked, withdrawn | مسؤول الحقوق / رئيس التحرير |
        | rights | blocked | documented | مسؤول الحقوق |

        الانتقالات الفنية يكتبها الخادم من أحداث الرفع ولا يستدعيها العميل إلا لإعادة المحاولة بعد الفشل.
      operationId: transitionMaterial
      x-roles: [reporter, supervisor, producer, editor_in_chief, rights_officer, system_admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Transition" }
      responses:
        "200":
          description: المادة بعد الانتقال
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Material" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /materials/{id}/files/{file_id}/download-url:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
      - name: file_id
        in: path
        required: true
        description: ملف مشتق من ملفات المادة
        schema: { type: string, format: uuid }
    get:
      tags: [materials]
      summary: رابط قراءة موقّع قصير العمر لمشتق من المادة (v0.1)
      description: >-
        للمشتقات وحدها (`proxy` و`hls` و`audio` و`thumbnail` و`transcript` و`captions` و`shot_list`) في حالة `verified`. الأصل والملاحظة الصوتية وحزمة التصدير
        لا تُعطى رابطًا هنا (`404`؛ الحزمة من `/materials/{id}/export/download-url`)، وكذلك ملف لا يخص المادة أو مادة خارج نطاق المستدعي، بلا تفريق. الرابط موقّع من التخزين
        ومدته ≤ 10 دقائق (`expires_at`)، يخص هذا الملف وحده، ولا يحمل بيانات كاشفة: لا اسم ملف أصلي ولا اسم مراسل ولا
        معرّف جهاز، ومفتاح التخزين بالمعرّفات وحدها. يُعاد طلبه عند الانتهاء ولا يُخزَّن (`Cache-Control: no-store`).
        **المشتقات النصية حساسة افتراضيًا (`transcript` و`captions` و`shot_list`، threat-model §9.1):** رابطها لأدوار تعديل
        المادة وحدها، أي `x-roles` على `PATCH /materials/{id}` ضمن النطاق (`reporter` مالك المادة، و`supervisor`
        و`editor_in_chief` و`system_admin`). غيرهم يُرد `404` بالشكل نفسه للملف المفقود، لا `403`. وكل إصدار رابط لها
        يُسجَّل في التدقيق قراءةً حساسة `material.sensitive_read` (`material_id` و`file_id` و`field_keys: [<النوع>]`).
      operationId: getMaterialFileDownloadUrl
      x-roles: [reporter, supervisor, producer, editor_in_chief, rights_officer, system_admin]
      responses:
        "200":
          description: الرابط
          headers:
            Cache-Control:
              description: "`no-store`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDownloadUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /materials/{id}/export:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      tags: [materials]
      summary: حالة حزمة التصدير لبرامج المونتاج (v0.2)
      operationId: getMaterialExport
      x-roles: [producer, editor_in_chief, rights_officer, system_admin]
      responses:
        "200":
          description: الحالة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [materials]
      summary: طلب حزمة التصدير (الأصل، النسخة الخفيفة، الجانبيات، FCPXML/EDL، SHA256SUMS)
      description: >-
        تُبنى عند الطلب لا عند الاستيعاب (#99): يُكتب الطلب وحدث `export.requested` (المادة، والأصل، والطالب) في معاملة
        واحدة، ويبنيها عامل الوسائط ويسجّلها مشتقًا `export`. طلب لكل أصل: إن كانت جاهزة أو قيد البناء أُعيدت حالتها
        (`200`) دون حدث جديد، وإن فشلت أُعيد طلبها (`202`). **لا بيانات كاشفة في الحزمة أبدًا** مهما كانت صلاحيات الطالب
        (CLAUDE.md §5): لا إحداثيات ولا معرّف جهاز ولا مصدر محمي ولا اسم حقيقي، فلا يحمل الحدث صلاحيات. بأدوار من يحق له
        تنزيل الأصل، وضمن نطاقه.
      operationId: requestMaterialExport
      x-roles: [producer, editor_in_chief, rights_officer, system_admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: طلب قائم (جاهز أو قيد البناء)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialExport" }
        "202":
          description: سُجّل الطلب
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /materials/{id}/export/download-url:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      tags: [materials]
      summary: رابط تنزيل موقّع لحزمة التصدير
      description: >-
        كرابط المشتقات (`FileDownloadUrl`، ≤ 10 دقائق، `no-store`، بالمعرّفات وحدها) لكن بأدوار تنزيل الأصل لأن الحزمة
        تضم الأصل. قبل الجاهزية `409 export_not_ready`. يُسجَّل كل إصدار رابط في التدقيق (`material_id`، `file_id`).
      operationId: getMaterialExportDownloadUrl
      x-roles: [producer, editor_in_chief, rights_officer, system_admin]
      responses:
        "200":
          description: الرابط
          headers:
            Cache-Control:
              description: "`no-store`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDownloadUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /materials/{id}/duplicates:
    parameters:
      - $ref: "#/components/parameters/MaterialId"
    get:
      tags: [materials]
      summary: مواد قد تكون مكررة لهذه المادة (v0.2)
      description: >-
        مرشّحون من نطاق المستدعي وحده، بثلاث درجات: `sha256` (الأصل نفسه بايتًا ببايت)، `cheap_hash` (الحجم وأول وآخر
        MiB)، و`perceptual` (متوسط مسافة هامنغ لبصمات الإطارات ≤ 10، ADR 0018). ترشيح لا حكم: لا يغيّر حالة ولا حقًا.
        لا يعيد عنوانًا ولا اسمًا ولا موقعًا؛ معرّفات وحالات فقط. مادة خارج النطاق لا تظهر ولا يُلمَّح إليها.
      operationId: listMaterialDuplicates
      x-roles: [supervisor, producer, editor_in_chief, rights_officer, system_admin]
      parameters:
        - name: limit
          in: query
          description: الحد الأقصى للمرشّحين
