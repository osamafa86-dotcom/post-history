      x-internal: true
      description: >-
        الخادم يقفل الجلسة ويتحقق من الحجم مقابل الجلسة والتخزين ويقارن `client_sha256` بنفسه (`checksum_mismatch`
        قراره لا قرار العامل) ثم يسجّل التحقق والإيصال وحدث Outbox في معاملة واحدة. متساوٍ الأثر: جلسة قُضي فيها
        تعيد `200` بالنتيجة المسجلة إن وافقت و`409` إن خالفت.
      operationId: mediaPostVerification
      x-roles: []
      security: [{ mediaWorkerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaVerification" }
      responses:
        "200":
          description: النتيجة المسجلة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaVerificationResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /internal/media/files/{file_id}/derivatives:
    servers:
      - url: http://api.internal:3000
        description: شبكة media الداخلية فقط (ADR 0006)
    parameters:
      - name: file_id
        in: path
        required: true
        description: الملف المصدر
        schema: { type: string, format: uuid }
    post:
      tags: [uploads]
      summary: تسجيل مشتق أنتجه العامل (داخلي، ADR 0006)
      x-internal: true
      description: >-
        ينشئ ملفًا جديدًا `kind=proxy` و`proxy_mode=normal` و`derived_from_id=file_id` و`state=verified`. متساوٍ الأثر
        على (`derived_from_id`، `kind`): الطلب نفسه يعيد الملف نفسه، ومشتق مختلف للمصدر والنوع نفسيهما `409`.
        `storage_key` يجب أن يبدأ بالبادئة المشتقة للمادة (`derived/<material_id>/`) وإلا `422`.
      operationId: mediaPostDerivative
      x-roles: []
      security: [{ mediaWorkerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaDerivative" }
      responses:
        "200":
          description: الملف المشتق
          content:
            application/json:
              schema:
                type: object
                required: [file_id]
                properties:
                  file_id: { type: string, format: uuid }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /forms:
    get:
      tags: [forms]
      summary: قائمة إصدارات النموذج (الإدارة)
      operationId: listForms
      x-roles: [system_admin, editor_in_chief]
      responses:
        "200":
          description: الإصدارات من الأحدث إلى الأقدم
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FormVersionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [forms]
      summary: نشر إصدار جديد من النموذج (الإدارة)
      description: >-
        الإصدارات غير قابلة للتعديل: كل تغيير إصدار جديد كامل (لقطة لا فرق). يرسل العميل `version`
        مساويًا للإصدار الحالي + 1 وإلا `409 form_version_conflict` (يمنع نشرين متزامنين). حذف حقل
        يعني أنه لا يظهر في الإصدار الجديد؛ بيانات المواد القديمة تبقى مقروءة بإصدارها. يتحقق الخادم
        من الجسم بمخطط `schemas/upload-form.json` ومن أن كل `condition.field` يشير إلى حقل موجود.
        **بوابة v0:** أي حقل بـ `sensitive: true` أو من نوع `location` يُرفض بـ
        `422 sensitive_fields_not_supported_v0` (وقيد مقابل في قاعدة البيانات) إلى أن يُنفَّذ التشفير على
        مستوى الحقل والحجب بالصلاحيات (SEC-03/SEC-04).
      operationId: publishForm
      x-roles: [system_admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadForm" }
      responses:
        "201":
          description: الإصدار المنشور
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadForm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /forms/current:
    get:
      tags: [forms]
      summary: نموذج الرفع الحالي لنوع مادة معيّن
      description: >-
        يعيد أحدث إصدار منشور. مع `material_type` تُحذف الحقول التي لا تنطبق على هذا النوع، ويبقى
        `version` هو نفسه. العميل يحفظ الإصدار مع المسودة ويرسله في `form_version` عند الإنشاء.
      operationId: getCurrentForm
      x-roles: [authenticated]
      parameters:
        - name: material_type
          in: query
          description: نوع المادة لتصفية الحقول
          schema: { $ref: "#/components/schemas/MaterialType" }
      responses:
        "200":
          description: النموذج
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadForm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /forms/{version}:
    get:
      tags: [forms]
      summary: نموذج بإصدار محدد (لقراءة المواد القديمة ومسودات الهاتف)
      operationId: getFormVersion
      x-roles: [authenticated]
      parameters:
        - name: version
          in: path
          required: true
          description: رقم الإصدار
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: النموذج
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadForm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications:
    get:
      tags: [notifications]
      summary: صندوق الوارد (يبقى الإشعار حتى لو فشلت قناة الهاتف)
      operationId: listNotifications
      x-roles: [authenticated]
      parameters:
        - name: unread_only
          in: query
          description: غير المقروء فقط
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: صفحة إشعارات، الأحدث أولًا
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications/{id}/read:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    post:
      tags: [notifications]
      summary: وسم الإشعار مقروءًا (قُرئ)
      operationId: readNotification
      x-roles: [authenticated]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: تم }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /notifications/{id}/ack:
    parameters:
      - $ref: "#/components/parameters/NotificationId"
    post:
      tags: [notifications]
      summary: إقرار الاستلام («اطّلعت» للمشرف، «أقرّ الاستلام» للمنتج)
      description: >-
        يوقف سلسلة التصعيد لهذا الإشعار. «اطّلعت» على إشعار «مادة واردة» ينقل المادة إلى
        `acknowledged` ويُعلم المراسل أن مادته شوهدت.
      operationId: ackNotification
      x-roles: [authenticated]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: تم }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /push-devices:
    put:
      tags: [notifications]
      summary: تسجيل جهاز لإشعارات الهاتف أو المتصفح (أو تحديث رمزه)
      description: >-
        `installation_id` يولّده التطبيق عند أول تشغيل ولا يُشتق من معرّفات الجهاز. رمز الدفع يُحفظ
        مشفرًا ولا يُعاد في أي استجابة ولا يدخل أي حمولة إشعار.
      operationId: registerPushDevice
      x-roles: [authenticated]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeviceRegistration" }
      responses:
        "204": { description: سُجِّل }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /push-devices/{installation_id}:
    parameters:
      - name: installation_id
        in: path
        required: true
        description: معرّف التثبيت الذي ولّده التطبيق
        schema: { type: string, format: uuid }
    delete:
      tags: [notifications]
      summary: إلغاء تسجيل جهاز (تسجيل الخروج أو فقد الهاتف)
      operationId: unregisterPushDevice
      x-roles: [authenticated]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: أُلغي }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events:
    get:
      tags: [events]
      summary: قراءة أحداث Outbox (لوحة الإدارة والمراقبة)
      operationId: listEvents
      x-roles: [system_admin]
      parameters:
        - name: after
          in: query
          description: معرّف آخر حدث مقروء؛ تعاد الأحداث التي تليه
          schema: { type: string }
        - name: type
          in: query
          description: تصفية بنوع الحدث
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: أحداث بترتيب تسلسلي
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    mediaWorkerToken:
      type: http
      scheme: bearer
      description: >-
        `MEDIA_WORKER_TOKEN` (≥ 32 حرفًا) لعامل الوسائط على `/internal/media/*` فقط؛ منفصل عن سر خطّاف tusd، مقارنة
        ثابتة الزمن، لا يُسجَّل (ADR 0006، SEC-05)
    bearerAuth:
      type: http
      scheme: bearer
      description: رمز وصول قصير العمر من `/auth/login` أو `/auth/refresh`

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        مفتاح منع التكرار؛ يولّده العميل مرة واحدة لكل عملية ويعيد استخدامه عند إعادة المحاولة.
        انظر «القواعد الحاكمة». غير مقبول على `/auth/*`: استجابات الهوية تحمل رموزًا ولا تُحفظ في جدول
        المفاتيح أبدًا.
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        قيمة `ETag` الأخيرة التي رآها العميل (`"<row_version>"` للمادة، `"<version>"` للنموذج الحالي). إن لم تطابق
        الحالة الراهنة يُرفض الطلب بـ `412 precondition_failed` دون أثر. اختيارية في v0.1 للتوافق مع عملاء v0.
      schema: { type: string, pattern: '^"[0-9]{1,19}"$', maxLength: 22 }
    MediaSessionId:
      name: upload_session_id
      in: path
      required: true
      description: معرّف جلسة الرفع
      schema: { type: string, format: uuid }
    MaterialId:
      name: id
      in: path
      required: true
      description: معرّف المادة
      schema: { type: string, format: uuid }
    UploadId:
      name: id
      in: path
      required: true
      description: معرّف جلسة الرفع
      schema: { type: string, format: uuid }
    NotificationId:
      name: id
      in: path
      required: true
      description: معرّف الإشعار
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: مؤشر الصفحة التالية كما أعادته الاستجابة السابقة في `next_cursor`
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: حجم الصفحة
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  headers:
    ETag:
      description: '`"<row_version>"` للمادة؛ يُرسل في `If-Match` مع التعديل التالي'
      schema: { type: string, pattern: '^"[0-9]{1,19}"$' }
    RateLimiterDegraded:
      description: >-
        تظهر بقيمة `degraded` فقط حين يعمل حد المعدل في ذاكرة العملية بدل Redis (حدود أضعف عبر النسخ)؛ غيابها يعني
        الوضع الطبيعي. معلوماتية للمراقبة والعملاء، ولا تغيّر دلالة الاستجابة.
      schema: { type: string, enum: [degraded] }

  responses:
    BadRequest:
      description: طلب غير صالح (معاملات استعلام أو مؤشر غير مفهوم)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: لا جلسة صالحة، أو رمز TOTP مطلوب أو خاطئ
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >-
        `forbidden_role`: دور المستدعي ليس في `x-roles` للعملية (لا يكشف وجود مورد). `forbidden_scope`: إجراء لا يملكه
        الدور على مورد داخل نطاقه. `admin_quorum_required`: الإجراء يمس حساب مدير نظام ويحتاج إجراء الشخصين.
        `credential_reset_required`: جلسة ما بعد الاستعادة قبل إعادة تعيين كلمة المرور والمصادقة الثنائية. ما خارج
        النطاق يعود 404 لا 403.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: غير موجود، أو موجود خارج النطاق (لا يُفرَّق بينهما لغير المخوّلين)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: تعارض حالة (انتقال غير مسموح، حجز قائم، إصدار نموذج متجاوز، طلب قيد التنفيذ بالمفتاح نفسه)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PreconditionFailed:
      description: '`If-Match` لا يطابق الحالة الراهنة (`precondition_failed`)؛ أعد القراءة ثم أعد المحاولة'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: فشل التحقق (الحقول الثابتة أو الديناميكية، مجموع الحصص، إعادة استخدام المفتاح بجسم مختلف)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: تجاوز حد المعدل؛ أعد المحاولة بعد `Retry-After`
      headers:
        Retry-After:
          description: ثوانٍ قبل إعادة المحاولة
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: رمز ثابت يتفرّع عليه العميل؛ الرسالة للبشر فقط. قائمة مفتوحة؛ الرمز المجهول = خطأ عام
          x-extensible-enum: true
          enum:
            - bad_request
            - unauthorized
            - totp_required
            - forbidden_scope
            - not_found
            - rate_limited
            - validation_failed
            - dynamic_fields_invalid
            - shares_not_100
            - idempotency_key_reused
            - idempotency_in_progress
            - invalid_transition
            - already_reserved
            - upload_state_conflict
            - checksum_mismatch
            - form_version_conflict
            - sensitive_fields_not_supported_v0
            - recovery_state_conflict
            - precondition_failed
            - forbidden_role
            - admin_quorum_required
            - credential_reset_required
            - internal_error
        message: { type: string }
        request_id: { type: string, description: لتتبع الطلب في السجلات }
        details:
          type: object
          additionalProperties: true
          description: تفاصيل آلية (مثل مسارات الحقول الفاشلة)؛ لا بيانات كاشفة
      example:
        code: invalid_transition
        message: الانتقال من inbox إلى published غير مسموح في المسار التحريري
        request_id: 01J9ZK2W5N6Q7R8S9T0V1W2X3Y
        details: { track: editorial, from: inbox, to: published }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, writeOnly: true }
        totp_code:
          type: string
          pattern: "^[0-9]{6}$"
          writeOnly: true
          description: مطلوب لكل الطاقم بعد التفعيل

    Session:
      type: object
      required: [access_token, refresh_token, expires_at, user_id, roles]
      properties:
        access_token:
          type: string
          description: >-
            JWT بعمر لا يتجاوز 15 دقيقة يحمل معرّف الجلسة؛ الإبطال يُفحص عند كل طلب بقائمة إبطال لا بانتظار
            الانتهاء (SEC-02)
        refresh_token: { type: string, description: يُدوَّر عند كل تحديث؛ يُحفظ مُجزَّأً فقط }
        expires_at: { type: string, format: date-time, description: انتهاء رمز الوصول }
        user_id: { type: string, format: uuid }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }

    Me:
      type: object
      required: [user_id, email, roles, permissions, totp_enabled]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        office_id: { type: [string, "null"], format: uuid, description: مكتب المستخدم }
        totp_enabled: { type: boolean }
        credential_reset_required:
          type: boolean
          description: الجلسة مقيّدة بعد استعادة الحساب حتى `/auth/totp/confirm`؛ غيابه = false (أُضيف في v0.1)
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          description: الصلاحيات المستقلة الممنوحة حاليًا؛ فارغة لمعظم المستخدمين
          uniqueItems: true
          items: { $ref: "#/components/schemas/Permission" }

    Permission:
      type: string
      description: صلاحية مستقلة تُمنح لمستخدم بعينه لا لدور (قرار المالك 2026-10-19، ADR SEC-03)
      enum: [sensitive_location:read, protected_source:read]

    Role:
      type: object
      required: [name, scopes]
      properties:
        name: { $ref: "#/components/schemas/RoleName" }
        scopes:
          type: array
          description: المكاتب أو المحافظات التي يراها الدور؛ فارغ = كل شيء (لمدير النظام ورئيس التحرير)
          items: { $ref: "#/components/schemas/Scope" }

    RoleName:
      type: string
      description: أدوار الطاقم في مرحلة التأسيس؛ أدوار المشترين والمؤسسات في المرحلة التجارية
      enum: [system_admin, editor_in_chief, supervisor, producer, finance, reporter, rights_officer]

    Scope:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [office, governorate] }
        id: { type: string, description: معرّف المكتب أو اسم المحافظة }

    RecoveryCompletion:
      type: object
      required: [session, totp_enrollment]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        totp_enrollment:
          type: object
          required: [secret_base32, otpauth_uri]
          description: يُعرض مرة واحدة ولا يُسجَّل؛ لا يتضمن اسم المستخدم الحقيقي في `otpauth_uri` بل معرّفًا داخليًا
          properties:
            secret_base32: { type: string, pattern: "^[A-Z2-7]{16,64}$" }
            otpauth_uri: { type: string, format: uri }

    RecoveryAccepted:
      type: object
      description: استجابة ثابتة لا تدل على صحة الرمز
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }

    UserSession:
      type: object
      required: [id, created_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        installation_id: { type: [string, "null"], format: uuid, description: معرّف التثبيت الذي ولّده التطبيق؛ ليس معرّف جهاز }
        platform: { type: [string, "null"], enum: [ios, android, web, null] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean, description: هل هي الجلسة التي أرسلت الطلب }

    RecoveryRequest:
      type: object
      required: [id, state, created_at]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [pending_approval, approved, rejected, expired] }
        created_at: { type: string, format: date-time }
        approved_by: { type: [string, "null"], format: uuid }
        expires_at: { type: [string, "null"], format: date-time, description: انتهاء صلاحية الطلب أو الرابط }

    TechnicalState:
      type: string
      description: ماذا وصل — pending → proxy_received → original_received → verified؛ failed من أي حالة
      enum: [pending, proxy_received, original_received, verified, failed]

    EditorialState:
      type: string
      description: من وافق — inbox → acknowledged → reviewing → accepted → in_production → final_review → published
      enum: [inbox, acknowledged, reviewing, needs_changes, accepted, in_production, final_review, published, rejected]

    RightsState:
      type: string
      description: ما يُسمح به — unknown → documented → sellable؛ blocked و withdrawn يوقفان الإتاحة
      enum: [unknown, documented, sellable, blocked, withdrawn]

    Priority:
      type: string
      description: تحدد مسار التنبيه وزمن الاستجابة المطلوب
      enum: [urgent, important, normal]

    MaterialType:
      type: string
      enum: [breaking, report, interview, raw_footage, aerial, press_conference, eyewitness, photos]

    Sensitivity:
      type: object
      description: سؤال إلزامي؛ أي علم مفعَّل يفعّل التمويه والتحذير ويحوّل المعالجة الآلية إلى المسار المحلي
      required: [minors, injured, graphic]
      properties:
        minors: { type: boolean }
        injured: { type: boolean }
        graphic: { type: boolean }

    DisplayName:
      type: object
      description: اسم الظهور للعموم؛ الارتباط الداخلي بالمراسل ثابت لاحتساب عمولته
      required: [mode]
      properties:
        mode: { type: string, enum: [real_name, pseudonym, network] }
        pseudonym: { type: [string, "null"], minLength: 1, maxLength: 80 }

    GpsPoint:
      type: object
      description: >-
        إحداثيات اختيارية تُكتب فقط؛ تُخزَّن مشفرة على مستوى الحقل ولا تُقرأ من هذه الواجهة ولا تظهر في
        أي معاينة أو إشعار أو تصدير.
      required: [lat, lng]
      writeOnly: true
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: [number, "null"], minimum: 0 }

    Contributor:
      type: object
      required: [user_id, role, share_percent]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [photographer, reporter, editor, fixer] }
        share_percent:
          type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.01
          description: بدقة منزلتين عشريتين؛ مجموع المساهمين في المادة = 100.00

    ContributorsSet:
      type: object
      required: [contributors]
      properties:
        contributors:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Contributor" }

    MaterialCreate:
      type: object
      required: [title, material_types, governorate, city, priority, sensitivity, display_name, form_version, dynamic_fields]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 80
          description: الحدود تعدّلها الإدارة؛ هذه حدود v0
        material_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/MaterialType" }
        governorate: { type: string, minLength: 1, maxLength: 64 }
        city: { type: string, minLength: 1, maxLength: 64 }
        shot_at:
          type: [string, "null"]
          format: date-time
          description: تُقرأ من الملف وتُصحَّح يدويًا
        priority: { $ref: "#/components/schemas/Priority" }
        sensitivity: { $ref: "#/components/schemas/Sensitivity" }
        display_name: { $ref: "#/components/schemas/DisplayName" }
        gps: { $ref: "#/components/schemas/GpsPoint" }
        form_version: { type: integer, minimum: 1, description: إصدار النموذج الذي رُسمت به الحقول الديناميكية }
        dynamic_fields:
          type: object
          description: >-
            قيم الحقول الديناميكية مفتاحها `key` الحقل؛ يتحقق الخادم بمخطط النموذج ذي الإصدار. في v0 لا
            يحتوي أي نموذج حقلًا حساسًا أو حقل موقع (بوابة `POST /forms`)، فلا بيانات كاشفة هنا حتى SEC-04.
            قيمة حقل `attachment` بالشكل `schemas/attachment-value.json`.
          additionalProperties: true
        contributors:
          type: array
          description: إن أُرسلت وجب أن يكون المجموع 100؛ إن غابت فالمراسل مساهم وحيد بـ 100
          items: { $ref: "#/components/schemas/Contributor" }
        voice_note_upload_id:
          type: [string, "null"]
          format: uuid
          description: جلسة رفع الملاحظة الصوتية إن سبقت إنشاء المادة

    MaterialUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 5, maxLength: 80 }
        material_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/MaterialType" }
        governorate: { type: string, minLength: 1, maxLength: 64 }
        city: { type: string, minLength: 1, maxLength: 64 }
        shot_at: { type: [string, "null"], format: date-time }
        priority: { $ref: "#/components/schemas/Priority" }
        sensitivity: { $ref: "#/components/schemas/Sensitivity" }
        display_name: { $ref: "#/components/schemas/DisplayName" }
        form_version:
          type: integer
          minimum: 1
          description: يُرسل مع `dynamic_fields` عند إكمال مسودة قديمة بإصدار أحدث
        dynamic_fields:
          type: object
          additionalProperties: true

    Material:
      allOf:
        - $ref: "#/components/schemas/MaterialCreate"
        - type: object
          required: [id, version, reporter_id, office_id, technical_state, editorial_state, rights_state, files, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1, description: يرتفع مع كل تعديل بعد الاعتماد }
            reporter_id: { type: string, format: uuid, description: الارتباط الداخلي الثابت بالمراسل }
            office_id: { type: [string, "null"], format: uuid, description: مكتب المراسل عند الإنشاء (نطاق المادة) }
            technical_state: { $ref: "#/components/schemas/TechnicalState" }
            editorial_state: { $ref: "#/components/schemas/EditorialState" }
            rights_state: { $ref: "#/components/schemas/RightsState" }
            reserved_by: { type: [string, "null"], format: uuid, description: المنتج الذي حجز المادة }
            reserved_at: { type: [string, "null"], format: date-time }
            files:
              type: array
              items: { $ref: "#/components/schemas/MaterialFile" }
            redacted_field_keys:
              type: array
              description: >-
                مفاتيح `dynamic_fields` التي حُذفت من هذه الاستجابة بقاعدة الحجب (حقول `sensitive` أو
                `location`) لأن المستدعي لا يحمل الصلاحية المقابلة؛ فارغة لحاملها.
              items: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            row_version:
              type: integer
              minimum: 1
              description: >-
                يرتفع مع كل كتابة على المادة (بخلاف `version` الذي يرتفع مع التعديل بعد الاعتماد)؛ قيمة `ETag`. أُضيف في
                v0.1 فقد يغيب عند خادم v0.
      example:
        id: 7b4a1f6e-3c2d-4e8f-9a1b-2c3d4e5f6a7b
        version: 1
        reporter_id: 1e2d3c4b-5a69-4788-9796-a5b4c3d2e1f0
        office_id: 0f1e2d3c-4b5a-4697-8877-665544332211
        title: مؤتمر صحفي للدفاع المدني في مدينة غزة
        material_types: [press_conference]
        governorate: غزة
        city: غزة
        shot_at: "2026-10-19T09:30:00Z"
        priority: important
        sensitivity: { minors: false, injured: false, graphic: false }
        display_name: { mode: network, pseudonym: null }
        form_version: 1
        dynamic_fields: { guest_name: المتحدث باسم الدفاع المدني, guest_title: متحدث }
        contributors:
          - { user_id: 1e2d3c4b-5a69-4788-9796-a5b4c3d2e1f0, role: photographer, share_percent: 100 }
        voice_note_upload_id: null
        technical_state: proxy_received
        editorial_state: acknowledged
        rights_state: unknown
        reserved_by: null
        reserved_at: null
        files:
          - id: 9c8b7a6f-5e4d-4c3b-a2a1-0f9e8d7c6b5a
            kind: proxy
            state: received
            proxy_mode: normal
            size_bytes: 68157440
            sha256: null
            mime_type: video/mp4
            duration_ms: 540000
            start_pts_us: 0
            width: 960
            height: 540
            receipt_number: null
            created_at: "2026-10-19T09:41:12Z"
            verified_at: null
        redacted_field_keys: []
        created_at: "2026-10-19T09:40:03Z"
        updated_at: "2026-10-19T09:41:12Z"

    MaterialPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Material" }
        next_cursor: { type: [string, "null"] }

    ReceiptNumber:
      type: [string, "null"]
      description: رقم إيصال الاستلام للمراسل؛ يصدر عند مطابقة بصمة الأصل. الصيغة R-YYYYMM-NNNNNN
      pattern: "^R-[0-9]{6}-[0-9]{6}$"

    MaterialFile:
      type: object
      required: [id, kind, state, created_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: الأصل لا يُمس؛ كل معالجة تنتج ملفًا جديدًا
          enum: [original, proxy, hls, audio, thumbnail, voice_note]
        state: { type: string, enum: [uploading, received, verified, failed] }
        proxy_mode: { type: [string, "null"], enum: [urgent, normal, null], description: وضع النسخة الخفيفة }
        size_bytes: { type: [integer, "null"], minimum: 0 }
        sha256:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: تُحسب على الخادم بعد التجميع
        mime_type: { type: [string, "null"] }
        duration_ms: { type: [integer, "null"], minimum: 0 }
        start_pts_us:
          type: [integer, "null"]
          description: نقطة البداية الزمنية للأصل؛ تحفظها النسخة الخفيفة لمحاذاة نقاط القص
        width: { type: [integer, "null"], minimum: 1 }
        height: { type: [integer, "null"], minimum: 1 }
        receipt_number: { $ref: "#/components/schemas/ReceiptNumber" }
        created_at: { type: string, format: date-time }
        verified_at: { type: [string, "null"], format: date-time }

    UploadSessionCreate:
      type: object
      required: [material_id, kind, size_bytes, filename]
      properties:
        material_id: { type: string, format: uuid }
        kind: { type: string, enum: [original, proxy, voice_note] }
        size_bytes: { type: integer, minimum: 1 }
        filename: { type: string, minLength: 1, maxLength: 255, description: اسم الملف على الجهاز؛ لا يُعرض خارج النطاق }
        mime_type: { type: [string, "null"] }
        proxy_mode:
          type: [string, "null"]
          enum: [urgent, normal, null]
          description: لـ proxy فقط
        client_sha256:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: >-
            بصمة SHA-256 للملف كاملًا يحسبها العميل قبل الإنشاء. على كل عميل إرسالها (ADR 0012): الخادم يقارنها ببصمته بعد
            التجميع فيخرج عامل الوسائط من قاعدة الثقة، والقرار `checksum_mismatch` للخادم وحده. تبقى اختيارية في المخطط
            حتى تُحدَّث اختبارات الخادم والقبول التي تنشئ جلسات بدونها، ثم تصير إلزامية بتغيير عقد منسّق.
        client_fingerprint:
          type: [object, "null"]
          description: بصمة رخيصة لترشيح المكررات فقط (لا تمنح أي حق)
          required: [size_bytes, head_sha256, tail_sha256]
          properties:
            size_bytes: { type: integer, minimum: 1 }
            head_sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 لأول 1 MiB (1,048,576 بايت)؛ الملف الأصغر = الملف كله" }
            tail_sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 لآخر 1 MiB؛ الملف الأصغر = الملف كله" }
            shot_at: { type: [string, "null"], format: date-time }

    UploadSession:
      type: object
      required: [id, material_id, kind, state, size_bytes, tus_endpoint, tus_metadata, part_size_bytes, bytes_received, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        material_id: { type: string, format: uuid }
        kind: { type: string, enum: [original, proxy, voice_note] }
        state:
          type: string
          description: created → in_progress → completed → verified؛ failed أو deduplicated نهائيتان
          enum: [created, in_progress, completed, verified, failed, deduplicated]
        size_bytes: { type: integer, minimum: 1 }
        tus_endpoint: { type: string, format: uri, description: نقطة إنشاء الرفع (tus 1.0) }
        tus_metadata:
          type: object
          description: أزواج تُرسل كما هي في `Upload-Metadata`؛ تحمل معرّف الجلسة ليربطها الـ hook بالمادة
          required: [upload_session_id]
          properties:
            upload_session_id: { type: string, format: uuid }
          additionalProperties: { type: string }
        part_size_bytes:
          type: integer
          minimum: 1048576
          description: حجم الجزء الثابت بالبايت لهذه الجلسة بين الخادم والتخزين (1 MiB حدًا أدنى)؛ يُثبَّت عند البدء ولا يتغير
        bytes_received: { type: integer, minimum: 0 }
        ietf_resumable:
          type: boolean
          default: false
          description: هل يعرض الخادم مسار المسودة التجريبي (تجربة iOS، بند القرارات 14)
        checksum_algorithm:
          type: string
          enum: [sha256, crc32c]
          default: sha256
          description: خوارزمية checksum للجزء الواحد التي يقبلها خادم الرفع
        expires_at: { type: string, format: date-time, description: انتهاء الجلسة إن لم تكتمل؛ انتهاء رمز الرفع في `UploadSessionCreated.upload_token_expires_at` وقد يسبقه }
        file_id:
          type: [string, "null"]
          format: uuid
          description: ملف المادة الناتج بعد الاكتمال
        duplicate_of_file_id:
          type: [string, "null"]
          format: uuid
          description: "عند `deduplicated`: الملف الموجود المطابق بالبصمة الكاملة"
        failure_reason:
          type: [string, "null"]
          enum: [checksum_mismatch, invalid_file, expired, aborted, storage_error, null]
        receipt_number: { $ref: "#/components/schemas/ReceiptNumber" }
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
      example:
        id: 5d6c7b8a-9f0e-4d1c-8b2a-3c4d5e6f7a8b
        material_id: 7b4a1f6e-3c2d-4e8f-9a1b-2c3d4e5f6a7b
        kind: original
        state: in_progress
        size_bytes: 2147483648
        tus_endpoint: https://ingest.example.invalid/files/
        tus_metadata: { upload_session_id: 5d6c7b8a-9f0e-4d1c-8b2a-3c4d5e6f7a8b, filename: IMG_0421.MOV }
        part_size_bytes: 16777216
        bytes_received: 335544320
        ietf_resumable: false
        checksum_algorithm: sha256
        expires_at: "2026-10-26T09:40:03Z"
        file_id: null
        duplicate_of_file_id: null
        failure_reason: null
        receipt_number: null
        created_at: "2026-10-19T09:40:03Z"
        updated_at: "2026-10-19T10:02:44Z"

    UploadSessionCreated:
      description: استجابة الإنشاء فقط؛ رمز الرفع لا يُعاد في أي قراءة لاحقة
      allOf:
        - $ref: "#/components/schemas/UploadSession"
        - type: object
          required: [upload_token, upload_token_expires_at]
          properties:
            upload_token:
              type: string
              description: "رمز قصير العمر يرسله العميل في `Authorization: Bearer` إلى خادم الرفع؛ يُحفظ مُجزَّأً على الخادم"
            upload_token_expires_at: { type: string, format: date-time }

    UploadComplete:
      type: object
      description: كل ما هنا معلوماتي؛ الخادم يحسب البصمة والحجم بنفسه ويشتق مفتاح التخزين من الجلسة
      properties:
        reported_sha256:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: بصمة يبلّغ عنها العميل للمقارنة فقط؛ لا تُحفظ ولا تُعتمد

    TusdHookRequest:
      type: object
      description: جسم خطّاف tusd (الإصدار 2) كما يرسله؛ المفاتيح بحالة tusd نفسها
      required: [Type, Event]
      properties:
        Type:
          type: string
          enum: [pre-create, post-finish, post-create, post-receive, post-terminate, pre-finish]
        Event:
          type: object
          required: [Upload, HTTPRequest]
          properties:
            Upload:
              type: object
              required: [Size, MetaData]
              properties:
                ID: { type: [string, "null"], description: فارغ في pre-create }
                Size: { type: integer, minimum: 0 }
                Offset: { type: integer, minimum: 0 }
                MetaData:
                  type: object
                  description: ما أرسله العميل في `Upload-Metadata`؛ يلزم `upload_session_id`
                  required: [upload_session_id]
                  properties:
                    upload_session_id: { type: string, format: uuid }
                  additionalProperties: { type: string }
                Storage:
                  type: [object, "null"]
                  description: يملؤه tusd بعد الإنشاء؛ يُطابَق مع ما تتوقعه الجلسة ولا يُعتمد وحده
                  properties:
                    Type: { type: string }
                    Bucket: { type: string }
                    Key: { type: string }
                  additionalProperties: true
              additionalProperties: true
            HTTPRequest:
              type: object
              description: ترويسة `Authorization` المُمرَّرة تحمل رمز الرفع؛ لا تُسجَّل في السجلات
              properties:
                Method: { type: string }
                URI: { type: string }
                RemoteAddr: { type: string }
                Header:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string }
              additionalProperties: true
          additionalProperties: true

    TusdHookResponse:
      type: object
      description: صيغة استجابة خطّاف tusd؛ `RejectUpload` في pre-create يوقف الرفع برسالة للعميل
      properties:
        RejectUpload: { type: boolean, default: false }
        HTTPResponse:
          type: object
          properties:
            StatusCode: { type: integer, minimum: 100, maximum: 599 }
            Body: { type: string }
            Header:
              type: object
              additionalProperties: { type: string }
        ChangeFileInfo:
          type: object
          description: pre-create فقط؛ يسمح بتثبيت `ID` ومسار التخزين على ما تحدده الجلسة
          properties:
            ID: { type: string }
            MetaData:
              type: object
              additionalProperties: { type: string }
            Storage:
              type: object
              additionalProperties: { type: string }

    Transition:
      type: object
      required: [track, to, reason]
      properties:
        track: { type: string, enum: [editorial, technical, rights] }
        to:
          type: string
          description: الحالة الهدف ضمن قيم المسار؛ انظر جدول الانتقالات في وصف العملية
        reason: { type: string, minLength: 1, maxLength: 2000 }
        note_timecode_ms:
          type: [integer, "null"]
          minimum: 0
          description: تعليق مثبت على ثانية محددة (مثل طلب تعديل عند 00:42)

    TransitionRecord:
      type: object
      required: [id, track, from, to, reason, actor_id, occurred_at]
      properties:
        id: { type: string }
        track: { type: string, enum: [editorial, technical, rights] }
        from: { type: string }
        to: { type: string }
        reason: { type: string }
        note_timecode_ms: { type: [integer, "null"], minimum: 0 }
        actor_id: { type: [string, "null"], format: uuid, description: فارغ للانتقالات التي يكتبها الخادم }
        occurred_at: { type: string, format: date-time }

    Reservation:
      type: object
      required: [material_id, reserved_by, reserved_at, releases_at]
      properties:
        material_id: { type: string, format: uuid }
        reserved_by: { type: string, format: uuid }
        reserved_at: { type: string, format: date-time }
        releases_at: { type: string, format: date-time, description: التحرير التلقائي بعد الخمول }

    UploadForm:
      $ref: "./schemas/upload-form.json"

    Health:
