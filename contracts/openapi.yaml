          type: [string, "null"]
          enum: [urgent, normal, null]
          description: لـ proxy فقط
        client_sha256:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: >-
            بصمة SHA-256 للملف كاملًا يحسبها العميل قبل الإنشاء؛ إلزامية منذ v0.1 (ADR 0012): الخادم يقارنها ببصمته بعد
            التجميع فيخرج عامل الوسائط من قاعدة الثقة، والقرار `checksum_mismatch` للخادم وحده. المفتاح إلزامي، والقيمة
            `null` تُرفض بـ `422 validation_failed`. النوع يبقى قابلًا لـ null في v0.1 فقط كي لا تنكسر شيفرة Swift وKotlin
            المولّدة التي تمرر قيمة اختيارية؛ يصير `string` غير قابل لـ null في v0.2.
