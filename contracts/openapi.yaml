  /payments/webhooks/{provider}:
    servers:
      - url: https://api.example.invalid
        description: خارج `/v1`؛ يستدعيه مزوّد الدفع وحده (والمزوّد التجريبي في غير الإنتاج)
    parameters:
      - name: provider
        in: path
        required: true
        description: المحوّل المفعَّل؛ غيره `404`. `sandbox` يُرفض في الإنتاج (ADR 0032)، و`stripe` بوضع الاختبار وحده
        schema: { $ref: "#/components/schemas/PaymentProvider" }
    post:
      tags: [commerce]
      summary: إشعار مزوّد الدفع الموقّع (ADR 0032)
      x-internal: true
      description: >-
        المصدر الوحيد لتأكيد الدفع. يُتحقق من التوقيع على الجسم الخام قبل تحليله: HMAC-SHA256 على
        `<X-Timestamp>.<body>` بسر المحوّل من البيئة، بمقارنة ثابتة الزمن، ويُرفض التوقيع غير الصالح وما خرج عن ±5 دقائق بـ `400 webhook_signature_invalid`. ثم
        يُسجَّل `(provider, event_id)` فريدًا، وتُطبَّق النتيجة في معاملة واحدة مع حالة الطلب والترخيص وقيد الدفتر وحدث
        Outbox. التكرار (عشر مرات أو بترتيب مختلف) يعيد `200` بلا أثر ثانٍ. المرجع المجهول أو الحالة المحسومة `200` بلا أثر،
        والمبلغ الذي لا يطابق الطلب `200` بلا ترخيص ويُكتب للمراجعة. الدفع الواصل لطلب منتهٍ يُقبل إن أعاد الخادم التحقق
        (الحجز قائم والحقوق قابلة للبيع)، وإلا يُلغى الطلب (`exclusivity_lost` أو `rights_changed`) ويُسترد المبلغ. الجسم
        بصيغة المحوّل، وكل محوّل يترجمها إلى `PaymentProviderEvent` قبل التطبيق.
        **`sandbox`:** الجسم `PaymentProviderEvent` نفسه، بترويستي `X-Signature` و`X-Timestamp`.
        **`stripe`:** الجسم حدث Stripe (`StripeWebhookEvent`)، والتوقيع ترويسة `Stripe-Signature` (`t=<ثوانٍ>,v1=<hex>`):
        HMAC-SHA256 على `<t>.<الجسم الخام>` بسر نقطة الإشعار من البيئة، والمهلة ±5 دقائق نفسها. `event_id` هو `id`
        الحدث، و`provider_ref` معرّف جلسة الدفع. الحدث بـ `livemode: true` يُرفض `400 live_payments_disabled` حتى قرار
        المالك بالمال الحقيقي. الترجمة:
        `checkout.session.completed` (بـ `payment_status = paid`) و`checkout.session.async_payment_succeeded` إلى
        `payment.succeeded`؛ و`checkout.session.async_payment_failed` و`checkout.session.expired` إلى `payment.failed`؛
        و`refund.updated` بحالة `succeeded` إلى `refund.succeeded`، وبحالة `failed` أو `canceled` يصير الاسترداد `failed`،
        و`pending` و`requires_action` تبقيه `pending`؛ و`charge.dispute.created` إلى `dispute.opened`. غير ذلك `200` بلا أثر.
      operationId: receivePaymentWebhook
      x-roles: []
      security: []
      parameters:
        - name: X-Signature
          in: header
          required: false
          description: "`sandbox` وحده (وإلزامي له): `v1=<hex>`، HMAC-SHA256 على `<X-Timestamp>.<الجسم الخام>`"
          schema: { type: string, pattern: "^v1=[0-9a-f]{64}$" }
        - name: X-Timestamp
          in: header
          required: false
          description: "`sandbox` وحده (وإلزامي له): ثوانٍ منذ epoch؛ خارج ±5 دقائق `400 webhook_signature_invalid`"
          schema: { type: string, pattern: "^[0-9]{10}$" }
        - name: Stripe-Signature
          in: header
          required: false
          description: "`stripe` وحده (وإلزامي له): `t=<ثوانٍ>,v1=<hex>[,v1=…]`؛ يكفي أن يطابق توقيع `v1` واحد"
          schema: { type: string, maxLength: 1024, pattern: "^t=[0-9]{10}(,v[0-9]=[0-9a-f]{64})+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PaymentProviderEvent"
                - $ref: "#/components/schemas/StripeWebhookEvent"
      responses:
        "200":
          description: استُلم (طُبّق أو كان مكررًا أو بلا أثر)؛ المزوّد يتوقف عن الإعادة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentWebhookAck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

