        - name: max_duration_ms
          in: query
          schema: { type: integer, minimum: 0 }
        - name: min_height
          in: query
          description: أدنى ارتفاع للأصل بالبكسل (مثل 1080)
          schema: { type: integer, minimum: 1 }
        - name: license_type
          in: query
          schema: { $ref: "#/components/schemas/LicenseType" }
