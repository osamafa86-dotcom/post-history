# المراقبة ذاتية الاستضافة على المضيف (ADR 0027): Prometheus وGrafana وLoki ومجمّع OpenTelemetry وnode-exporter، مشروع
# compose مستقل عن البيئة (لا يسقط معها ولا تسقط معه):
#   docker compose -f infra/observability/compose.monitoring.yml --env-file <ملف فيه GRAFANA_ADMIN_PASSWORD> up -d --wait
# لا منفذ عام: Grafana وحده على 127.0.0.1:${GRAFANA_PORT:-3300} للوصول بنفق SSH، والباقي على الشبكة الداخلية monitoring.
# السجلات: المجمّع يقرأ ملفات json-file لـ Docker (الوسم tag = اسم الحاوية، daemon.json) وينقّيها قبل Loki.
# الفحوص الصحية: healthcheck.sh --prom يكتب post_history_check_ok في مجلد textfile يقرؤه node-exporter.
# كل خدمة محدودة الذاكرة بلا swap؛ المجموع 1072 MB، والاستهلاك الفعلي مقيس في docs/measurements/infra/.
name: post-history-monitoring

x-hardened: &hardened
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [monitoring]

services:
  prometheus:
    <<: *hardened
    image: quay.io/prometheus/prometheus:v3.7.0@sha256:29c1e0b48ad816750245dea3d65ac3ce57dda30547e67b1e9a5176e2953cc4dc
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=15d", "--storage.tsdb.retention.size=2GB", "--web.listen-address=:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 20

  loki:
    <<: *hardened
    image: grafana/loki:3.5.5@sha256:31628519045e7f28692a7ae73b4a3fd293dccb425585ed5d16ceea3b5c9592e6
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./monitoring/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 30

  # Root (uid 0) only to read Docker's log files (root 0640); no capability, read-only root, logs mounted read-only.
  otel-collector:
    <<: *hardened
    image: otel/opentelemetry-collector-contrib:0.137.0@sha256:886722fe0f37af9d1fe24d29529253ec59fbf263b3b1df4facaf221373e19d23
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ${DOCKER_CONTAINERS_DIR:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
    read_only: true
    depends_on:
      loki:
        condition: service_healthy
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.5

  node-exporter:
    <<: *hardened
    image: quay.io/prometheus/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/host/root",
              "--collector.textfile.directory=/textfile",
              "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - ${HEALTH_TEXTFILE_DIR:-/var/lib/post-history/textfile}:/textfile:ro
    read_only: true
    mem_limit: 48m
    memswap_limit: 48m
    cpus: 0.25

  grafana:
    <<: *hardened
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?generated by bootstrap, in the secrets file}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_LEVEL: warn
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    # A port is published only from a non-internal network: "published" carries that port alone.
    networks: [monitoring, published]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 30

networks:
  monitoring:
    internal: true
  published: {}

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
