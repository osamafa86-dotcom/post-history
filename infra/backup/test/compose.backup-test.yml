# Backup failure handling (infra/backup/test/test-backup.sh, ADR 0013): the backup image against a real Postgres and a real
# MinIO (with the read-only backup user from infra/minio/init.sh), hardened as in the trial. The stubs in ./stubs wrap the
# real pg_dump and mc to cut a stream short on demand; with no FAIL_* variable set they pass through unchanged.
name: ph-backup-test

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: backuptest
      POSTGRES_USER: backuptest
      POSTGRES_PASSWORD: "${BT_PG_PASSWORD:?}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backuptest -d backuptest"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: "${BT_S3_ROOT:?}"
      MINIO_ROOT_PASSWORD: "${BT_S3_ROOT_SECRET:?}"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z@sha256:6ecdaec70bc5e8cf9d0e9a70c190f3beb1c83f11617ff4333f1fcd71ab1daf18
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "/init.sh"]
    environment:
      S3_ACCESS_KEY: "${BT_S3_ROOT}"
      S3_SECRET_KEY: "${BT_S3_ROOT_SECRET}"
      S3_BUCKET_UPLOADS: uploads
      S3_BUCKET_MEDIA: media
      TUSD_OBJECT_PREFIX: tus/
      S3_BACKUP_ACCESS_KEY: backup-test
      S3_BACKUP_SECRET_KEY: "${BT_BACKUP_SECRET:?}"
    volumes:
      - ../../minio/init.sh:/init.sh:ro

  backup:
    build: ..
    image: post-history-backup:test
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: backuptest
      PGPASSWORD: "${BT_PG_PASSWORD}"
      PGDATABASE: backuptest
      S3_ENDPOINT: http://minio:9000
      S3_BACKUP_ACCESS_KEY: backup-test
      S3_BACKUP_SECRET_KEY: "${BT_BACKUP_SECRET}"
      S3_BUCKET_UPLOADS: uploads
      S3_BUCKET_MEDIA: media
      PATH: /stubs:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      FAIL_PG_DUMP: "${FAIL_PG_DUMP:-}"
      FAIL_CAT_KEY: "${FAIL_CAT_KEY:-}"
      FAIL_CAT_VANISH: "${FAIL_CAT_VANISH:-}"
      # The vanish case removes the object as the root user would (a cancelled upload); the backup user cannot.
      MC_HOST_admin: "${BT_MC_ADMIN:-}"
    volumes:
      - "${BT_WORK:?}/backups:/backups"
      - "${BT_WORK}/recipient.crt:/run/backup/recipient.crt:ro"
      - ./stubs:/stubs:ro
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
