# الوكيل الوحيد أمام tusd (SEC-06): tusd بلا منفذ منشور، ولا يُمرَّر إلا /files/.
# /metrics وغيره لا يُكشف. محليًا يحاكي حد جسم الطلب في Cloudflare (100 MB).
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 100m;

    location /files/ {
        proxy_pass http://tusd:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $http_host;
        # استبدال لا إلحاق: لا تُمرَّر ترويسات توجيه من العميل.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";

        # tusd puts Go transport errors in its 500 body, which include the hook URL and thus the
        # token (SEC-06) when the API is unreachable. Clients get the status code only.
        proxy_intercept_errors on;
        error_page 500 = @tusd_internal_error;
    }

    location @tusd_internal_error {
        default_type text/plain;
        return 500 "ERR_INTERNAL_SERVER_ERROR\n";
    }

    location / {
        return 404;
    }
}
