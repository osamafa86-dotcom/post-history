# الوكيل الوحيد أمام tusd (SEC-06): tusd بلا منفذ منشور، ولا يُمرَّر إلا /files/.
# /metrics وغيره لا يُكشف. محليًا يحاكي حد جسم الطلب في Cloudflare (100 MB).
# سجل بلا عنوان العميل ولا معرّف الرفع (قدرة حاملة، SEC-06)؛ يحل محل سجل الصورة الافتراضي (combined).
map $uri $tusd_log_uri {
    "~^/files/[^/]+" /files/-;
    default $uri;
}
log_format tusd_proxy '$time_iso8601 $request_method $tusd_log_uri $status $body_bytes_sent $request_time';

server {
    listen 8080;
    access_log /dev/stdout tusd_proxy;
    server_tokens off;
    # Re-resolve tusd through Docker's DNS: a recreated tusd may get a new address, and a static
    # proxy_pass host is resolved once at startup (502 until nginx restarts).
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 100m;

    location /files/ {
        set $tusd_upstream http://tusd:8080;
        proxy_pass $tusd_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $http_host;
        # استبدال لا إلحاق: لا تُمرَّر ترويسات توجيه من العميل.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";

        # tusd puts Go transport errors in its 500 body, which include the hook URL and thus the
        # token (SEC-06) when the API is unreachable. Clients get the status code only.
        proxy_intercept_errors on;
        error_page 500 = @tusd_internal_error;
    }

    location @tusd_internal_error {
        default_type text/plain;
        return 500 "ERR_INTERNAL_SERVER_ERROR\n";
    }

    # Everything else, /internal/ included, is 404: hooks never go through this proxy.
    location / {
        return 404;
    }
}
