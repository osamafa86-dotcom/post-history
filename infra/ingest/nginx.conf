# بوابة نطاق ingest. غير المُوكَّل (ADR 0011): TLS هنا مباشرة (لا Cloudflare أمامه)، ثم رمز الرفع القصير
# (ingest_token.js)، ثم tusd-proxy كما في النطاق الرئيسي. خطّاف pre-create يبقى يتحقق من رمز الرفع نفسه.
load_module modules/ngx_http_js_module.so;

# المفتاح العام وحده (SPKI بـ base64)؛ المفتاح الخاص عند الخادم الذي يصدر الرموز.
env INGEST_TOKEN_PUBLIC_KEY;

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    js_path /etc/nginx/njs/;
    js_import ingest from ingest_token.js;

    # النطاق مكشوف بلا وكيل: حدود لكل عنوان قبل أي عمل تشفيري.
    limit_req_zone $binary_remote_addr zone=ingest_req:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=ingest_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # بلا ترويسات (فيها الرمزان) وبلا عنوان العميل الكامل: المسار والحالة والحجم والمدة.
    # ومعرّف الرفع في /files/<id> قدرة حاملة (SEC-06): يُكتب /files/- مكانه.
    map $uri $log_uri {
        "~^/files/[^/]+" /files/-;
        default $uri;
    }
    log_format ingest '$time_iso8601 $request_method $log_uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout ingest;

    # جذر للقراءة فقط: كل مسارات الكتابة المؤقتة في tmpfs.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        # المستمع: TLS هنا مباشرة (listen-tls.conf، النموذج الأولي)، أو HTTP خلف وكيل أمامي يُنهي TLS
        # (listen-plain.conf، بيئة التجربة: Caddy على عنوان ingest).
        include /etc/nginx/ingest-listen.conf;
        client_max_body_size 100m;

        location /files/ {
            limit_req zone=ingest_req burst=40 nodelay;
            limit_conn ingest_conn 10;
            # الرمز يُفحص في طلب فرعي بلا جسم؛ js_content هنا مباشرة كان سيقرأ الجزء كله إلى القرص قبل الفحص.
            auth_request /_ingest_gate;
            set $tusd_proxy http://tusd-proxy:8080;
            proxy_pass $tusd_proxy;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Host $http_host;
            proxy_set_header Ingest-Token "";
            # tusd يبني Location بـ http من Host؛ العميل هنا على https.
            proxy_redirect ~^http://[^/]+/files/(.*)$ https://$http_host/files/$1;
        }

        location = /_ingest_gate {
            internal;
            js_content ingest.gate;
        }

        location / {
            return 404;
        }
    }
}
