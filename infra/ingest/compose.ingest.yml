# النموذج الأولي لنطاق ingest. غير المُوكَّل (ADR 0011)، طبقة فوق compose الأساسي:
#   INGEST_TOKEN_PUBLIC_KEYS=<kid>:<SPKI base64>[,<kid>:<SPKI base64>] INGEST_TLS_DIR=<dir with tls.crt/tls.key only> \
#     docker compose -f infra/compose/docker-compose.yml -f infra/ingest/compose.ingest.yml up -d --wait
# مفاتيح الاختبار والشهادة تولّدها infra/ingest/test-gate.sh؛ في الإنتاج المفتاح العام من SOPS والشهادة من ACME.
services:
  ingest-gate:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on:
      tusd-proxy:
        condition: service_healthy
    environment:
      # Two keys during a rotation (ADR 0011); the server puts kid in every token.
      INGEST_TOKEN_PUBLIC_KEYS: "${INGEST_TOKEN_PUBLIC_KEYS:?kid:SPKI base64 pairs of the ingest token verification keys}"
      # Session state from the API (SEC-01). "off" only for test-gate.sh, which runs the gate with no sessions.
      INGEST_SESSION_CHECK: "${INGEST_SESSION_CHECK:-on}"
      INGEST_GATE_TOKEN: "${INGEST_GATE_TOKEN:-}"
    volumes:
      - ../ingest/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../ingest/ingest_token.js:/etc/nginx/njs/ingest_token.js:ro
      - ../ingest/listen-tls.conf:/etc/nginx/ingest-listen.conf:ro
      - "${INGEST_TLS_DIR:?directory with tls.crt and tls.key}:/run/ingest:ro"
    ports:
      - "127.0.0.1:${INGEST_PORT:-8443}:8443"
    # الوجه المكشوف للإنترنت: مستخدم nginx غير الجذر، جذر للقراءة فقط، بلا صلاحيات نواة.
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8443"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      default: {}
      uploads: {}
      hooks:
        ipv4_address: 172.30.250.3
