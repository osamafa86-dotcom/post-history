# خلف وكيل أمامي يُنهي TLS (بيئة التجربة، infra/field-trial). الوكيل يصل عبر منفذ مربوط بـ 127.0.0.1 على المضيف،
# فيأتي الاتصال من بوابة شبكة Docker: عنوان العميل الحقيقي من X-Forwarded-For الذي يضعه الوكيل، لتعمل حدود المعدل
# لكل عميل لا للوكيل كله.
listen 8080;
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
