name: post-history

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # The password goes through the environment into a config file, not argv: an argv value shows in
    # `docker inspect` Cmd and the rendered compose file (SEC-05). $$ = literal $ for the container shell.
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?set in .env}"
    command:
      - sh
      - -c
      - umask 077 && printf 'requirepass "%s"\nappendonly yes\n' "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    networks: [default, media]

  minio:
    # minio/minio and minio/mc are no longer published on Docker Hub; community fork build, tag + digest (ADR 0004).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${S3_PORT}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    networks: [default, uploads, media]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z@sha256:6ecdaec70bc5e8cf9d0e9a70c190f3beb1c83f11617ff4333f1fcd71ab1daf18
    depends_on:
      minio:
        condition: service_healthy
    # Buckets, and the media worker's own least-privilege user (ADR 0006).
    entrypoint: ["sh", "/init.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA}
      TUSD_OBJECT_PREFIX: ${TUSD_OBJECT_PREFIX}
      S3_MEDIA_ACCESS_KEY: ${S3_MEDIA_ACCESS_KEY:-}
      S3_MEDIA_SECRET_KEY: ${S3_MEDIA_SECRET_KEY:-}
      S3_BACKUP_ACCESS_KEY: ${S3_BACKUP_ACCESS_KEY:-}
      S3_BACKUP_SECRET_KEY: ${S3_BACKUP_SECRET_KEY:-}
    volumes:
      - ../minio/init.sh:/init.sh:ro

  tusd:
    image: tusproject/tusd:v2.10.1@sha256:7b1c552a8b42f4b36cb01f2a3bd49f82ab078b2eefd191459e716141dd50376c
    depends_on:
      minio-init:
        condition: service_completed_successfully
    # The entrypoint appends /${TUSD_HOOK_SECRET} to TUSD_HOOK_URL and redacts it from tusd's log (ADR SEC-06).
    entrypoint: ["sh", "/usr/local/bin/tusd-entrypoint.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION}
      TUSD_HOOK_URL: ${TUSD_HOOK_URL}
      TUSD_HOOK_SECRET: "${TUSD_HOOK_SECRET:?set in .env (openssl rand -hex 32)}"
    volumes:
      - ../tusd/entrypoint.sh:/usr/local/bin/tusd-entrypoint.sh:ro
    # R2 requires all non-trailing parts to have the same size: min part size == preferred part size.
    # Part size is fixed per upload session; the phone-side chunk size is independent (tusd buffers to .part).
    # Bucket and object prefix must match what the API reads (S3_BUCKET_UPLOADS, TUSD_OBJECT_PREFIX).
    # -disable-download: anyone holding an upload URL could otherwise GET the original (ADR SEC-06).
    # Authorization is forwarded for pre-create (upload token); the API must never log it.
    # TUSD_EXTRA_FLAGS is empty locally; set "-behind-proxy" only behind a real proxy.
    command: >
      -port=8080
      -base-path=/files/
      -s3-endpoint=${S3_ENDPOINT}
      -s3-bucket=${S3_BUCKET_UPLOADS}
      -s3-object-prefix=${TUSD_OBJECT_PREFIX}
      -s3-part-size=${TUSD_PART_SIZE_BYTES}
      -s3-min-part-size=${TUSD_PART_SIZE_BYTES}
      -s3-disable-content-hashes=${TUSD_DISABLE_CONTENT_HASHES}
      -hooks-http-forward-headers=Authorization
      -hooks-enabled-events=pre-create,post-create,post-finish
      -hooks-http-retry=5
      -hooks-http-backoff=2s
      -show-greeting=false
      -disable-download
      ${TUSD_EXTRA_FLAGS}
    # No published port: reachable only through tusd-proxy. "hooks" is where the API listens for hooks;
    # tusd has a fixed address there so the API can allow /internal/* from it alone (INTERNAL_ALLOWED_CIDRS).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/metrics"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      uploads: {}
      hooks:
        ipv4_address: 172.30.250.2

  tusd-proxy:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on:
      tusd:
        condition: service_healthy
    volumes:
      - ../proxy/tusd.conf:/etc/nginx/conf.d/default.conf:ro
    # Healthy only when a request crosses the proxy to tusd: GET /files/ is 405 from tusd
    # (-disable-download), 502/504 while tusd is unreachable.
    healthcheck:
      test: ["CMD-SHELL", "wget -S -q -O /dev/null http://127.0.0.1:8080/files/ 2>&1 | grep -q 'HTTP/1.1 405'"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${TUSD_PORT}:8080"
    networks: [default, uploads]

  # The API from source, opt-in: docker compose --profile api up -d --wait
  # Joins "hooks" (dynamic address from .4/30) to receive tusd hooks; /internal/* only from tusd (172.30.250.2).
  api:
    profiles: [api]
    image: node:22.23.3-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    working_dir: /repo/apps/api
    command: ["bash", "-c", "npm ci --no-audit --no-fund && src/db/migrate.sh up && npm run build && exec node dist/main.js"]
    volumes:
      - ../..:/repo
      - api-node-modules:/repo/apps/api/node_modules
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # عامل الوسائط (ADR 0006): external = أحداث الاستلام إلى media:events بدل التحقق داخل الخادم.
      # فارغ = in_process. مع profile media يُضبط UPLOAD_VERIFIER=external وMEDIA_WORKER_TOKEN في .env.
      UPLOAD_VERIFIER: ${UPLOAD_VERIFIER:-}
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      # Rotation and break-glass (docs/ops/runbook.md); empty = unset for the API.
      FIELD_ENCRYPTION_KEY_VERSION: ${FIELD_ENCRYPTION_KEY_VERSION:-}
      FIELD_ENCRYPTION_KEY_PREVIOUS: ${FIELD_ENCRYPTION_KEY_PREVIOUS:-}
      FIELD_ENCRYPTION_KEY_PREVIOUS_VERSION: ${FIELD_ENCRYPTION_KEY_PREVIOUS_VERSION:-}
      TUSD_HOOK_SECRET_PREVIOUS: ${TUSD_HOOK_SECRET_PREVIOUS:-}
      TUSD_HOOK_SECRET_PREVIOUS_UNTIL: ${TUSD_HOOK_SECRET_PREVIOUS_UNTIL:-}
      BREAK_GLASS_TOKEN_SHA256: ${BREAK_GLASS_TOKEN_SHA256:-}
      INTERNAL_ALLOWED_CIDRS: ${INTERNAL_ALLOWED_CIDRS}
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET}
      TUSD_OBJECT_PREFIX: ${TUSD_OBJECT_PREFIX}
      TUSD_POST_CREATE_HOOK: ${TUSD_POST_CREATE_HOOK:-true}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 300s  # npm ci + migrate + build on first start
    ports:
      - "127.0.0.1:${API_PORT}:3000"
    networks: [default, hooks, media]

  media-worker:
    # عامل الوسائط (ADR 0006): يستهلك media:events ويستدعي /internal/media/* على الخادم. لا منفذ منشور.
    profiles: [media]
    build:
      context: ../../workers/media
      target: runtime
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEDIA_API_URL: http://api:3000
      # فارغ = العامل يرفض البدء (≥ 32 حرفًا). لا يُفرض هنا كي لا يتعطل compose بلا profile media.
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      # مستخدم MinIO الخاص بالعامل (infra/minio/init.sh): قراءة بادئة الرفع وكتابة media/derived/ فقط
      S3_ACCESS_KEY: ${S3_MEDIA_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_MEDIA_SECRET_KEY:-}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA}
      MEDIA_SCRATCH_DIR: /scratch
    # يعالج ملفات غير موثوقة (مراجعة الأمن على #41): جذر للقراءة فقط، بلا صلاحيات نواة ولا رفع امتيازات،
    # مستخدم الصورة غير الجذر، وحدود ذاكرة ومعالج وعمليات تحصر أثر ملف يستنزف FFmpeg.
    # مجلد العمل /scratch حجم لا tmpfs: الأصل قد يبلغ غيغابايتات، وtmpfs يحسبه من الذاكرة المحدودة هنا.
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${MEDIA_WORKER_MEM_LIMIT:-2g}
    memswap_limit: ${MEDIA_WORKER_MEM_LIMIT:-2g}
    cpus: ${MEDIA_WORKER_CPUS:-2}
    pids_limit: 256
    restart: unless-stopped
    volumes:
      - media-scratch:/scratch
    # شبكة media الداخلية وحدها (لا خروج): الخادم وRedis وMinIO. العنوان الثابت هو ما في INTERNAL_ALLOWED_CIDRS.
    networks:
      media:
        ipv4_address: 172.30.251.2

volumes:
  postgres-data:
  redis-data:
  minio-data:
  api-node-modules:
  media-scratch:

networks:
  default: {}
  # internal: no published ports and no egress. Production tusd needs egress to R2 only (ADR SEC-06 infra notes).
  uploads:
    internal: true
  # Media worker <-> API, MinIO, Redis (ADR 0006). The worker gets the fixed 172.30.251.2 (INTERNAL_ALLOWED_CIDRS);
  # dynamic addresses (API, MinIO, Redis, ...) come from .8-.15 only, so nothing can take .2 first.
  media:
    internal: true
    ipam:
      config:
        - subnet: 172.30.251.0/28
          ip_range: 172.30.251.8/29
  hooks:
    internal: true
    ipam:
      config:
        - subnet: 172.30.250.0/29  # fixed: INTERNAL_ALLOWED_CIDRS=172.30.250.2/32 depends on it
          # Dynamic addresses (API, others) come from .4-.7 only, so nothing can take tusd's .2 first.
          ip_range: 172.30.250.4/30
