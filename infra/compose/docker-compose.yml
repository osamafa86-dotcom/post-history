name: post-history

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data

  minio:
    # minio/minio and minio/mc are no longer published on Docker Hub; community fork build, tag + digest (ADR 0004).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${S3_PORT}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    networks: [default, uploads]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z@sha256:6ecdaec70bc5e8cf9d0e9a70c190f3beb1c83f11617ff4333f1fcd71ab1daf18
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET_UPLOADS} &&
      mc mb --ignore-existing local/${S3_BUCKET_MEDIA} &&
      echo buckets ready"

  tusd:
    image: tusproject/tusd:v2.10.1
    depends_on:
      minio-init:
        condition: service_completed_successfully
    # The entrypoint appends /${TUSD_HOOK_SECRET} to TUSD_HOOK_URL and redacts it from tusd's log (ADR SEC-06).
    entrypoint: ["sh", "/usr/local/bin/tusd-entrypoint.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION}
      TUSD_HOOK_URL: ${TUSD_HOOK_URL}
      TUSD_HOOK_SECRET: "${TUSD_HOOK_SECRET:?set in .env (openssl rand -hex 32)}"
    volumes:
      - ../tusd/entrypoint.sh:/usr/local/bin/tusd-entrypoint.sh:ro
    # R2 requires all non-trailing parts to have the same size: min part size == preferred part size.
    # Part size is fixed per upload session; the phone-side chunk size is independent (tusd buffers to .part).
    # Bucket and object prefix must match what the API reads (S3_BUCKET_UPLOADS, TUSD_OBJECT_PREFIX).
    # -disable-download: anyone holding an upload URL could otherwise GET the original (ADR SEC-06).
    # Authorization is forwarded for pre-create (upload token); the API must never log it.
    # TUSD_EXTRA_FLAGS is empty locally; set "-behind-proxy" only behind a real proxy.
    command: >
      -port=8080
      -base-path=/files/
      -s3-endpoint=${S3_ENDPOINT}
      -s3-bucket=${S3_BUCKET_UPLOADS}
      -s3-object-prefix=${TUSD_OBJECT_PREFIX}
      -s3-part-size=${TUSD_PART_SIZE_BYTES}
      -s3-min-part-size=${TUSD_PART_SIZE_BYTES}
      -s3-disable-content-hashes=${TUSD_DISABLE_CONTENT_HASHES}
      -hooks-http-forward-headers=Authorization
      -hooks-enabled-events=pre-create,post-finish
      -hooks-http-retry=5
      -hooks-http-backoff=2s
      -show-greeting=false
      -disable-download
      ${TUSD_EXTRA_FLAGS}
    # No published port: reachable only through tusd-proxy. "hooks" is where the API listens for hooks;
    # tusd has a fixed address there so the API can allow /internal/* from it alone (INTERNAL_ALLOWED_CIDRS).
    networks:
      uploads: {}
      hooks:
        ipv4_address: 172.30.250.2

  tusd-proxy:
    image: nginx:1.28.3-alpine
    depends_on: [tusd]
    volumes:
      - ../proxy/tusd.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${TUSD_PORT}:8080"
    networks: [default, uploads]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  default: {}
  # internal: no published ports and no egress. Production tusd needs egress to R2 only (ADR SEC-06 infra notes).
  uploads:
    internal: true
  hooks:
    internal: true
    ipam:
      config:
        - subnet: 172.30.250.0/29  # fixed: INTERNAL_ALLOWED_CIDRS=172.30.250.2/32 depends on it
          # Dynamic addresses (API, others) come from .4-.7 only, so nothing can take tusd's .2 first.
          ip_range: 172.30.250.4/30
