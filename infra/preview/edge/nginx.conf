# واجهة المعاينة على شبكة الخادم المشترك (ADR 0023): الوحيدة على deploy_default. جذر للقراءة فقط، والمؤقت في /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    # بلا عنوان العميل ولا ترويسات: الطريقة والمسار بلا استعلام والحالة والمدة.
    log_format preview '$time_iso8601 $request_method $uri $status $request_time';
    access_log /dev/stdout preview;
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    include /tmp/edge.conf;
}
