# معاينة خفيفة على خادم مشترك (ADR 0023): Postgres وRedis وMinIO والخادم والويب، وtusd وبوابة ingest للرفع من الحاسوب،
# وعامل الوسائط بحدود صارمة (ADR 0092: نسخة خفيفة ومصغّرات فقط، بلا تفريغ ولا HLS ولا تسليم ولا C2PA)، ونسخ قالب
# «مواد متداولة» للتقييم في حاوية media-render (ADR 0091، ملحق ADR 0092)، بصور مبنية في CI (preview-images.yml، لا بناء
# هنا). على الخادم، من هذا المجلد:
#   ./gen-env.sh            # مرة: .env بأسرار عشوائية وشهادة داخلية في tls/، لا يطبع شيئًا سريًا
#                           # (.env قائم: --add-upload لمفاتيح الرفع، و--add-media لمفاتيح عامل الوسائط، و--add-render
#                           # لمستخدم media-render في MinIO وعنوانه، و--add-storage لمستخدمي tusd والخادم في MinIO،
#                           # و--add-media-tls لشهادة الحافة باسم المعاينة نفسه: tls/ قائم من قبل معاينات الويب)
#   ./fetch-images.sh       # الصور الأربع من الإصدار preview-latest (تُتحقق ببصمة sha256 أولًا) ثم docker load
#   docker compose -f docker-compose.preview.yml up -d --wait
#   ./seed-preview.sh       # مرة: حسابات تجريبية ومواد اصطناعية؛ كلمات السر في .env لا في المخرج
#   ./backfill-media.sh     # الأصول المتحققة قبل العامل: الأعداد وحدها (--wait حتى تنتهي)
# لا منفذ على المضيف: الوكيل الأمامي للخادم (Caddy) يصل إلى "web" وحده عبر الشبكة الخارجية deploy_default باسم lib-web.
# بناء iOS التجريبي (ADR 0077): الحافة تمرر /v1/ علنًا إلى الخادم عبر شبكة داخلية ثانية (public-api) عنوان الحافة عليها ليس في BFF_SOURCE_ADDRESSES.
# الحدود: mem_limit لكل خدمة وmemswap_limit مساوٍ له (بلا swap)، والمجموع 6952 MB تحت سقف 6952 MB (ملحق ADR 0092؛ كان 2856
# قبل النسخ، و960 في 0023)، منها 1472 لعامل الوسائط و4096 لـ media-render، وكلاهما يمسك ذاكرته وقت المهمة وحدها.
name: post-history-preview

x-limits: &hardened
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  postgres:
    <<: *hardened
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    # The entrypoint drops to the postgres user itself, so it needs these back (cap_drop ALL above).
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    # Read-only root: the data is the volume, the socket and its lock go to tmpfs (a few KB, inside the limit below).
    read_only: true
    tmpfs: ["/var/run/postgresql:size=1m", "/tmp:size=4m"]
    command: ["postgres", "-c", "shared_buffers=16MB", "-c", "max_connections=30", "-c", "work_mem=2MB",
              "-c", "maintenance_work_mem=16MB", "-c", "effective_cache_size=48MB", "-c", "max_wal_size=96MB",
              "-c", "wal_buffers=1MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env (gen-env.sh)}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    networks: [internal]

  redis:
    <<: *hardened
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # Runs as redis directly (the shell command skips the image's own drop from root), so /data stays its own.
    user: redis
    # Read-only root: the append-only file is the volume, the config written below goes to tmpfs.
    read_only: true
    tmpfs: ["/tmp:size=1m"]
    # كلمة المرور من البيئة إلى ملف إعداد لا إلى سطر الأوامر (SEC-05)؛ سقف ذاكرة داخلي تحت حد الحاوية.
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?}"
    command:
      - sh
      - -c
      - umask 077 && printf 'requirepass "%s"\nappendonly yes\nmaxmemory 20mb\nmaxmemory-policy volatile-lru\n' "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 40m
    memswap_limit: 40m
    cpus: 0.25
    networks: [internal]

  minio:
    <<: *hardened
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    # MinIO runs as uid 1000, not root. A volume from before this is root's, so the entrypoint gives /data to 1000:1000 first
    # (chown -R changes the top directory last, so it is skipped once that is done), then drops with chroot --userspec. The
    # capabilities are for those two steps; minio itself holds none (no-new-privileges, and uid 1000 after the drop).
    cap_add: [CHOWN, SETGID, SETUID, SYS_CHROOT]
    entrypoint: ["sh", "-c", "[ \"$$(stat -c %u:%g /data)\" = 1000:1000 ] || chown -R 1000:1000 /data || exit 1; exec chroot --userspec=1000:1000 / minio server /data"]
    # Read-only root: the objects are the volume; /tmp holds the healthcheck's mc config (MC_CONFIG_DIR in the image).
    read_only: true
    tmpfs: ["/tmp:size=4m"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
      MINIO_BROWSER: "off"
      GOMEMLIMIT: 96MiB
      # Incomplete multipart uploads (an abandoned upload's parts) older than 24 h are deleted, checked every hour.
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 1h
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 20
    # 256 MB (was 128, ADR 0092): after two large uploads in 64 MiB PATCHes it went away at 128 MB, and at 256 MB it reached
    # the limit with reclaimable page cache and was not killed.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    # Unique name for the edge, which passes signed GETs of derived files here (ADR 0092) and also sits on deploy_default.
    networks:
      internal:
        aliases: [ph-preview-minio]

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z@sha256:6ecdaec70bc5e8cf9d0e9a70c190f3beb1c83f11617ff4333f1fcd71ab1daf18
    depends_on:
      minio:
        condition: service_healthy
    # Storage on the shared server (ADR 0023, 0092): hard quotas, uploads 10112 MiB and derived files 2048 MiB, and tusd's
    # temporary parts (at most the gate's 10 connections x 5 MiB) in 64 MiB outside them; and a least-privilege MinIO user
    # for each client: tusd (read and write the upload bucket only), the API (read both buckets, delete tus objects; no write,
    # no admin), the media worker (read the uploads but not their .info/.part, read and write media/derived/ only), and
    # media-render (the same uploads, read and write derived/*/*/renders/ only). The root user is for this container alone.
    # The admin calls were killed at 64 MB in CI.
    entrypoint: ["sh", "/minio-init.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:?}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:?}
      S3_TUSD_ACCESS_KEY: ${S3_TUSD_ACCESS_KEY:?gen-env.sh --add-storage}
      S3_TUSD_SECRET_KEY: ${S3_TUSD_SECRET_KEY:?gen-env.sh --add-storage}
      S3_API_ACCESS_KEY: ${S3_API_ACCESS_KEY:?gen-env.sh --add-storage}
      S3_API_SECRET_KEY: ${S3_API_SECRET_KEY:?gen-env.sh --add-storage}
      S3_MEDIA_ACCESS_KEY: ${S3_MEDIA_ACCESS_KEY:?gen-env.sh --add-media}
      S3_MEDIA_SECRET_KEY: ${S3_MEDIA_SECRET_KEY:?gen-env.sh --add-media}
      S3_RENDER_ACCESS_KEY: ${S3_RENDER_ACCESS_KEY:?gen-env.sh --add-render}
      S3_RENDER_SECRET_KEY: ${S3_RENDER_SECRET_KEY:?gen-env.sh --add-render}
      GOMEMLIMIT: 40MiB
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=4m"]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    networks: [internal]

  api:
    <<: *hardened
    image: post-history-preview-api:latest
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=144
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_MAX: "6"
      VERIFY_CONCURRENCY: "1"
      # One SHA-256 worker thread (ADR 0092): the API has 0.75 CPU, and each extra thread only holds memory.
      VERIFY_HASH_THREADS: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?}
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET:?}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      # The API's own MinIO user (minio-init.sh): read both buckets, delete tus objects; no write, no admin.
      S3_ACCESS_KEY: ${S3_API_ACCESS_KEY:?gen-env.sh --add-storage}
      S3_SECRET_KEY: ${S3_API_SECRET_KEY:?gen-env.sh --add-storage}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA}
      # معاينة فقط، لا تُنقل إلى التجربة. الرفع من الحاسوب ومن بناء iOS التجريبي (ADR 0077): tusd خلف بوابة ingest،
      # ورمز الويب يصدره الخادم للـBFF وحده (عنوان الحافة على الشبكة الداخلية)، ورمز التطبيق بشهادة الجهاز. شهادة الجهاز
      # لـ iOS مفتوحة بمعرّف التطبيق الحقيقي (بيئة الإنتاج، وهي ما يستعمله TestFlight؛ بيئة التطوير ممنوعة)، وأندرويد مغلق
      # (لا PLAY_INTEGRITY_PACKAGE_NAME). لا تفريغ، والإشعارات الخارجية معطّلة.
      ATTESTATION_MODE: production
      APP_ATTEST_APP_ID: Y4R9ZHWK9Y.net.palpost.posthistory
      INGEST_REQUIRED: "true"
      TUS_PUBLIC_ENDPOINT: https://${PREVIEW_DOMAIN}/files/
      INGEST_TUS_ENDPOINT: https://${PREVIEW_DOMAIN}/files/
      INGEST_TOKEN_SIGNING_KEY: ${INGEST_TOKEN_SIGNING_KEY:?gen-env.sh --add-upload}
      INGEST_TOKEN_KEY_ID: ${INGEST_TOKEN_KEY_ID:?}
      INGEST_GATE_TOKEN: ${INGEST_GATE_TOKEN:?}
      BFF_SOURCE_ADDRESSES: ${PREVIEW_EDGE_IP:-10.211.47.10}/32
      INTERNAL_ALLOWED_CIDRS: ${PREVIEW_TUSD_IP:-10.211.47.12}/32,${PREVIEW_GATE_IP:-10.211.47.13}/32
      # The ingest gate reaches /internal/ingest/ alone, and the media worker /internal/media/ alone (ADR 0092).
      # media-render reaches what a render needs alone: its render and the source file, then the derivative registration.
      INTERNAL_SOURCE_PATHS: "${PREVIEW_GATE_IP:-10.211.47.13}/32=/internal/ingest/;${PREVIEW_MEDIA_IP:-10.211.47.14}/32=/internal/media/;${PREVIEW_RENDER_IP:-10.211.47.15}/32=/internal/media/renders/|/internal/media/files/"
      # One file at most 2 GiB (ADR 0023): POST /uploads answers 422 above it (#238), and tusd -max-size matches.
      UPLOAD_MAX_BYTES: "2147483648"
      UPLOAD_RECONCILE_ENABLED: "false"
      # ADR 0092: the API still verifies every upload itself (in_process: photos included, and uploads never wait on the
      # worker). media-feeder hands verified video originals to the worker, which reports on /internal/media/* with this token.
      UPLOAD_VERIFIER: in_process
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:?gen-env.sh --add-media}
      # Circulated-template renders for evaluation (ADR 0091 §8: the free Remotion licence covers the preview and the trial, not
      # production; addendum to ADR 0092). Fixed here, not from .env, and set for this API and media-render alone.
      MEDIA_ENABLE_RENDERS: "true"
      # Signed read links for derived files are signed for the preview's own origin; the edge passes GET on
      # /<media bucket>/derived/<id>/<id>/{proxy-480p.mp4,poster.jpg} to MinIO with the Host unchanged (ADR 0092).
      S3_PUBLIC_ENDPOINT: https://${PREVIEW_DOMAIN}
      AI_WORKER_TOKEN: ""
      PUSH_DELIVERY_ENABLED: "false"
      # Web passkeys (ADR 0107, 0108) for the preview's own origin alone; the domain comes from .env, never the repository.
      WEBAUTHN_RP_ID: ${PREVIEW_DOMAIN}
      WEBAUTHN_ORIGINS: https://${PREVIEW_DOMAIN}
      # العودة من صفحة الدفع إلى طلب المشتري بلغته (ADR 0032، ملحق 2026-11-03) حين يُفعَّل مزوّد دفع؛ بلا مزوّد لا أثر له.
      SANDBOX_RETURN_URL: https://${PREVIEW_DOMAIN}/{locale}/store/orders/{order_id}?returned=1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.75
    # Unique upstream name for the edge: it also sits on deploy_default, where a short name may resolve elsewhere.
    # api-hooks: the name the ingest gate asks for session state (infra/ingest/nginx.conf); the gate is on this network only.
    # public-api (ADR 0077): the edge's public /v1/ location reaches the API here, from an address the API does not list in
    # BFF_SOURCE_ADDRESSES, so a public caller gets no web token and no say over the client address. Only the edge shares it.
    networks:
      internal:
        aliases: [ph-preview-api, api-hooks]
      public-api:
        aliases: [ph-preview-api-public]

  web-app:
    <<: *hardened
    image: post-history-preview-web:latest
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=16m", "/app/.next/cache:size=16m,uid=1000,gid=1000"]
    environment:
      NODE_OPTIONS: --max-old-space-size=160
      WEB_ORIGIN: https://${PREVIEW_DOMAIN:?the preview domain, in .env only (never in the repository)}
      # The BFF requires https to the API: "web" terminates an internal TLS listener for it (certificate from gen-env.sh).
      API_BASE_URL: https://api.lib.internal:8443/v1
      NODE_EXTRA_CA_CERTS: /tls/ca.crt
      WEB_SESSION_KEY: ${WEB_SESSION_KEY:?}
      WEB_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # The browser uploads to /files/ on the preview's own origin (the web edge, then the ingest gate and tusd).
      WEB_TUS_ORIGINS: https://${PREVIEW_DOMAIN}
      # Derived files in the workspace (addendum to ADR 0092): the BFF reads the link the API signed for the preview's own
      # origin, and that name resolves here to the edge's listener on the internal network (alias on "web"), not to the internet.
      WEB_MEDIA_ORIGINS: https://${PREVIEW_DOMAIN}
      # Privacy-policy contact email: read at request time, set in .env only (never in the repository); empty keeps the page banner.
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
    volumes:
      - ./tls/ca.crt:/tls/ca.crt:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.75
    # Unique upstream name for the edge: it also sits on deploy_default, where a short name may resolve elsewhere.
    networks:
      internal:
        aliases: [ph-preview-web-app]

  # الرفع: tusd خلف وكيله (حجب أجسام 500، infra/proxy/tusd.conf) وخلف بوابة ingest (رمز ES256 قصير وحالة الجلسة عند
  # الخادم، infra/ingest). الثلاثة على الشبكة الداخلية وحدها، والحافة تمرر /files/ إلى البوابة. المجموع 168 MB.
  # tusd 128 MB (كان 56، ADR 0092): قُتل عند 56 تحت PATCH من 32 MiB، وPATCH واحد من 64 MiB (جلسة iOS الخلفية، ADR 0009)
  # يبلغ 58.5 إلى 75.4 MiB، أغلبها ذاكرة صفحات أجزائه المؤقتة لا ذاكرة مجهولة (9.3 MiB).
  tusd:
    <<: *hardened
    image: tusproject/tusd:v2.10.1@sha256:7b1c552a8b42f4b36cb01f2a3bd49f82ab078b2eefd191459e716141dd50376c
    depends_on:
      minio-init:
        condition: service_completed_successfully
    # The entrypoint appends /${TUSD_HOOK_SECRET} to TUSD_HOOK_URL and redacts it from tusd's log (ADR SEC-06).
    entrypoint: ["sh", "/usr/local/bin/tusd-entrypoint.sh"]
    read_only: true
    environment:
      # tusd's own MinIO user (minio-init.sh): read and write the upload bucket only.
      AWS_ACCESS_KEY_ID: ${S3_TUSD_ACCESS_KEY:?gen-env.sh --add-storage}
      AWS_SECRET_ACCESS_KEY: ${S3_TUSD_SECRET_KEY:?gen-env.sh --add-storage}
      AWS_REGION: us-east-1
      TUSD_HOOK_URL: http://ph-preview-api:3000/internal/tusd-hooks
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET:?}
      GOMEMLIMIT: 40MiB
    # Parts below the S3 minimum wait in /tmp: a volume, not tmpfs. Their page cache still counts against the memory limit
    # until written back, which is what a fast 64 MiB PATCH fills (measured, ADR 0092).
    volumes:
      - ../tusd/entrypoint.sh:/usr/local/bin/tusd-entrypoint.sh:ro
      - tusd-tmp:/tmp
    command: >
      -port=8080
      -base-path=/files/
      -s3-endpoint=http://minio:9000
      -s3-bucket=${S3_BUCKET_UPLOADS}
      -s3-part-size=5242880
      -s3-min-part-size=5242880
      -hooks-http-forward-headers=Authorization
      -hooks-enabled-events=pre-create,post-create,post-finish
      -hooks-http-retry=5
      -hooks-http-backoff=2s
      -show-greeting=false
      -disable-download
      -max-size=2147483648
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/metrics"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    networks:
      internal:
        ipv4_address: ${PREVIEW_TUSD_IP:-10.211.47.12}

  tusd-proxy:
    <<: *hardened
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on:
      tusd:
        condition: service_healthy
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:size=4m"]
    entrypoint: ["nginx", "-c", "/etc/nginx/preview-proxy.conf", "-g", "daemon off;"]
    volumes:
      - ./edge/proxy-main.conf:/etc/nginx/preview-proxy.conf:ro
      - ../proxy/tusd.conf:/etc/nginx/tusd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -S -q -O /dev/null http://127.0.0.1:8080/files/ 2>&1 | grep -q 'HTTP/1.1 405'"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 16m
    memswap_limit: 16m
    cpus: 0.25
    networks: [internal]

  ingest-gate:
    <<: *hardened
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on:
      tusd-proxy:
        condition: service_healthy
    environment:
      INGEST_TOKEN_PUBLIC_KEYS: ${INGEST_TOKEN_PUBLIC_KEYS:?gen-env.sh --add-upload}
      INGEST_GATE_TOKEN: ${INGEST_GATE_TOKEN:?}
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    volumes:
      - ../ingest/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../ingest/ingest_token.js:/etc/nginx/njs/ingest_token.js:ro
      - ./edge/ingest-listen.conf:/etc/nginx/ingest-listen.conf:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 24m
    memswap_limit: 24m
    cpus: 0.25
    # Unique name for the edge (it also sits on deploy_default); a fixed address the API limits to /internal/ingest/.
    networks:
      internal:
        ipv4_address: ${PREVIEW_GATE_IP:-10.211.47.13}
        aliases: [ph-preview-ingest]

  # عامل الوسائط (ADR 0092): نسخة خفيفة 480p ومصغّرتان لكل أصل فيديو متحقق، وما سوى ذلك مطفأ صراحة (HLS والتفريغ والتصدير
  # ومعاينة المتجر والتسليم وC2PA والمحاذاة والبصمة الإدراكية). يعالج ملفات غير موثوقة: جذر للقراءة فقط، بلا صلاحيات ولا رفع
  # امتيازات، مستخدم غير الجذر، والشبكة الداخلية وحدها (لا خروج)، وعنوان ثابت يقصره الخادم على /internal/media/. حدود صارمة على
  # خادم مشترك: 1472 MB بلا swap، و1.5 معالج، وأولوية معالج منخفضة (cpu_shares 256 من 1024) فيتنازل للمواقع عند التزاحم، وهو
  # أول ما يقتله OOM المضيف إن ضاقت الذاكرة كلها. /scratch حجم لا tmpfs (الأصل حتى 2 GiB لا يُحسب من الذاكرة)؛ حارس القرص
  # في media-feeder.
  media-worker:
    <<: *hardened
    image: post-history-preview-media:latest
    pull_policy: never
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEDIA_API_URL: http://ph-preview-api:3000
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:?gen-env.sh --add-media}
      S3_ENDPOINT: http://ph-preview-minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_MEDIA_ACCESS_KEY:?gen-env.sh --add-media}
      S3_SECRET_KEY: ${S3_MEDIA_SECRET_KEY:?gen-env.sh --add-media}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA}
      MEDIA_SCRATCH_DIR: /scratch
      # Fixed here, not from .env: what never runs on the preview.
      MEDIA_ENABLE_HLS: "false"
      MEDIA_ENABLE_PHASH: "false"
      MEDIA_ENABLE_EXPORT: "false"
      MEDIA_ENABLE_STORE_PREVIEW: "false"
      MEDIA_ENABLE_DELIVERY: "false"
      MEDIA_ENABLE_ALIGNMENT: "false"
      MEDIA_ENABLE_C2PA: "false"
    volumes:
      - media-scratch:/scratch
    # Healthy while it holds its connection to the queue: an established TCP connection to Redis (6379 = 18EB in /proc/net/tcp),
    # which the worker keeps open between jobs and through one. grep alone, no interpreter: nothing to speak of next to a job.
    healthcheck:
      test: ["CMD-SHELL", "grep -sqE '^ *[0-9]+: [0-9A-F]+:[0-9A-F]{4} [0-9A-F]+:18EB 01 ' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    mem_limit: 1472m
    memswap_limit: 1472m
    cpus: 1.5
    cpu_shares: 256
    oom_score_adj: 500
    pids_limit: 128
    networks:
      internal:
        ipv4_address: ${PREVIEW_MEDIA_IP:-10.211.47.14}

  # يعطي العامل مهامه (ADR 0092): أصل فيديو متحقق بلا نسخة خفيفة، العاجل أولًا، مهمة تنتظر على الأكثر، ولا مهمة جديدة والمساحة
  # الحرة على قرص الحجوم دون PREVIEW_MEDIA_MIN_FREE_GIB (8 افتراضيًا): تبقى المادة معلّقة وتُعاد كل دورة. ويعطي media-render
  # نسخ القالب المطلوبة على media:renders (الخادم لا ينشرها مع in_process) بالقواعد نفسها، والقرص يتسع لحجم الأصل + 1 GiB
  # فوق ذلك الحد. الحجم disk-probe فارغ، يُركَّب ليقيس قرص الحجوم (حيث minio-data وmedia-scratch وrender-scratch) لا ليقرأ
  # شيئًا. السجل أعداد فقط.
  media-feeder:
    <<: *hardened
    image: post-history-preview-api:latest
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    entrypoint: ["node", "--max-old-space-size=32", "preview/media-feeder.mjs"]
    command: ["--loop"]
    # Healthy while its cycles succeed: each one touches MEDIA_FEED_HEARTBEAT (tmpfs), and a cycle runs every 10 s. The check is
    # sh and stat, no node: the service has 64 MB.
    tmpfs: ["/tmp:size=1m"]
    healthcheck:
      test: ["CMD-SHELL", "[ $$(( $$(date +%s) - $$(stat -c %Y /tmp/media-feeder.alive) )) -lt 60 ]"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      MEDIA_FEED_HEARTBEAT: /tmp/media-feeder.alive
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEDIA_MIN_FREE_GIB: ${PREVIEW_MEDIA_MIN_FREE_GIB:-8}
      MEDIA_DISK_PATH: /disk
      MEDIA_FEED_INTERVAL_S: "10"
    volumes:
      - disk-probe:/disk:ro
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.1
    networks: [internal]

  # نسخ قالب «مواد متداولة» للتقييم (ADR 0091، ملحق ADR 0092): هدف render من workers/media (العامل نفسه وNode وحزمة القالب
  # وChrome Headless Shell مثبّتًا مخبوزًا في الصورة؛ لا تنزيل وقت التشغيل ولا مفتاح ترخيص) على طابور media:renders، يعطيه
  # media-feeder نسخة واحدة على الأكثر بحارس قرص لكل مهمة (حجم الأصل + 1 GiB فوق PREVIEW_MEDIA_MIN_FREE_GIB). مهمة واحدة في
  # كل مرة، وRemotion بتوازٍ 1. تحصين عامل الوسائط نفسه: جذر للقراءة فقط، بلا صلاحيات ولا رفع امتيازات، مستخدم غير الجذر،
  # الشبكة الداخلية وحدها، وعنوان ثابت يصل إلى /internal/media/renders/ و/internal/media/files/ وحدهما، ومستخدم MinIO يكتب
  # derived/*/*/renders/ وحدها. 4096 MB بلا swap (ذروة القياس 3763 MB بتوازي Remotion الافتراضي على 4 vCPU)، ومعالجان،
  # وأولوية دون الخادم وعامل الوسائط (cpu_shares 128)، وأول ما يقتله OOM المضيف (oom_score_adj 800).
  media-render:
    <<: *hardened
    image: post-history-preview-render:latest
    pull_policy: never
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    command: ["serve", "--queue", "renders"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEDIA_API_URL: http://ph-preview-api:3000
      MEDIA_WORKER_TOKEN: ${MEDIA_WORKER_TOKEN:?gen-env.sh --add-media}
      S3_ENDPOINT: http://ph-preview-minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_RENDER_ACCESS_KEY:?gen-env.sh --add-render}
      S3_SECRET_KEY: ${S3_RENDER_SECRET_KEY:?gen-env.sh --add-render}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA}
      MEDIA_SCRATCH_DIR: /scratch
      # Fixed here, not from .env: renders on (evaluation, ADR 0091 §8), one Remotion tab, and nothing else.
      MEDIA_ENABLE_RENDERS: "true"
      MEDIA_RENDER_CONCURRENCY: "1"
      MEDIA_ENABLE_HLS: "false"
      MEDIA_ENABLE_PHASH: "false"
      MEDIA_ENABLE_EXPORT: "false"
      MEDIA_ENABLE_STORE_PREVIEW: "false"
      MEDIA_ENABLE_DELIVERY: "false"
      MEDIA_ENABLE_ALIGNMENT: "false"
      MEDIA_ENABLE_C2PA: "false"
    volumes:
      - render-scratch:/scratch
    # Healthy while it holds its connection to the queue: an established TCP connection to Redis (6379 = 18EB in /proc/net/tcp),
    # which the worker keeps open between jobs and through one. grep alone, no interpreter: nothing to speak of next to a job.
    healthcheck:
      test: ["CMD-SHELL", "grep -sqE '^ *[0-9]+: [0-9A-F]+:[0-9A-F]{4} [0-9A-F]+:18EB 01 ' /proc/net/tcp /proc/net/tcp6"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    mem_limit: 4096m
    memswap_limit: 4096m
    cpus: 2
    cpu_shares: 128
    oom_score_adj: 800
    pids_limit: 512
    networks:
      internal:
        ipv4_address: ${PREVIEW_RENDER_IP:-10.211.47.15}

  # The only service on the shared server's network: X-Robots-Tag noindex, the "preview" banner, and the internal TLS
  # listeners the BFF needs (bound to its address on the internal network alone): one for the API, and one under the
  # preview's own name for the signed links of derived files (addendum to ADR 0092).
  web:
    <<: *hardened
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on:
      web-app:
        condition: service_started
      ingest-gate:
        condition: service_started
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:size=8m"]
    # The signed link carries no port, so the listener for it is 443: nginx binds it as uid 101 with no capability.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    environment:
      PREVIEW_EDGE_IP: ${PREVIEW_EDGE_IP:-10.211.47.10}
      PREVIEW_MEDIA_BUCKET: ${S3_BUCKET_MEDIA:?}
    entrypoint: ["sh", "-c", "echo \"$$PREVIEW_MEDIA_BUCKET\" | grep -qxE '[a-z0-9][a-z0-9-]{1,61}[a-z0-9]' && sed -e \"s/@EDGE_IP@/$$PREVIEW_EDGE_IP/\" -e \"s/@MEDIA_BUCKET@/$$PREVIEW_MEDIA_BUCKET/\" /etc/nginx/edge.conf.in > /tmp/edge.conf && exec nginx -c /etc/nginx/nginx.conf -g 'daemon off;'"]
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./edge/edge.conf.in:/etc/nginx/edge.conf.in:ro
      - ./tls/api.crt:/tls/api.crt:ro
      - ./tls/api.key:/tls/api.key:ro
      # From gen-env.sh (--add-media-tls on a tls/ from before it). A missing file stops "up" here: it is never made a directory.
      - { type: bind, source: ./tls/media.crt, target: /tls/media.crt, read_only: true, bind: { create_host_path: false } }
      - { type: bind, source: ./tls/media.key, target: /tls/media.key, read_only: true, bind: { create_host_path: false } }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/robots.txt"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 24m
    memswap_limit: 24m
    cpus: 0.25
    networks:
      internal:
        ipv4_address: ${PREVIEW_EDGE_IP:-10.211.47.10}
        # The preview's own name too, on this network alone: the BFF's read of a signed link ends at the edge.
        aliases: [api.lib.internal, "${PREVIEW_DOMAIN}"]
      public-api: {}
      deploy_default:
        aliases: [lib-web]

networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: ${PREVIEW_SUBNET:-10.211.47.0/24}
  # The edge and the API alone (ADR 0077): no fixed subnet, nothing trusts an address here, and Docker picks one that is free.
  public-api:
    internal: true
  deploy_default:
    external: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
  tusd-tmp:
  media-scratch:
  render-scratch:
  disk-probe:
