# حافة «النطاق الرئيسي» في محاكاة الحجب (ADR 0011)، على العنوان A:
#   app.example            المسار الرئيسي (يمثّل النطاق خلف Cloudflare): بلا رمز ingest.
#   ingest-shared.example  نطاق ingest على العنوان نفسه: يقيس أثر مشاركة العنوان مع الرئيسي.
# نطاق ingest المستقل (ingest.example) هو بوابة infra/ingest على العنوان B.
load_module modules/ngx_http_js_module.so;
env INGEST_TOKEN_PUBLIC_KEY;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}

http {
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    js_path /etc/nginx/njs/;
    js_import ingest from ingest_token.js;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    ssl_certificate /run/ingest/tls.crt;
    ssl_certificate_key /run/ingest/tls.key;
    client_max_body_size 100m;

    server {
        listen 8443 ssl;
        server_name app.example;
        location /files/ {
            set $up http://tusd-proxy:8080;
            proxy_pass $up;
            proxy_set_header Host $http_host;
            proxy_redirect ~^http://[^/]+/files/(.*)$ https://$http_host/files/$1;
        }
    }

    server {
        listen 8443 ssl;
        server_name ingest-shared.example;
        location /files/ {
            auth_request /_ingest_gate;
            set $up http://tusd-proxy:8080;
            proxy_pass $up;
            proxy_set_header Host $http_host;
            proxy_set_header Ingest-Token "";
            proxy_redirect ~^http://[^/]+/files/(.*)$ https://$http_host/files/$1;
        }
        location = /_ingest_gate {
            internal;
            js_content ingest.gate;
        }
    }
}
