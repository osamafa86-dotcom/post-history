# طبقة netlab فوق compose الأساسي:
#   docker compose -f infra/compose/docker-compose.yml -f tools/netlab/compose.netlab.yml up -d --wait
# toxiproxy أمام tusd-proxy (المسار الحقيقي للعميل)، وبديل خطّاف (hook-stub، باسم api على شبكة hooks الداخلية).
services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    depends_on: [tusd-proxy]
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:18081-18083:18081-18083"

  # Named hook-stub (not api) so it never merges with the real api service; reachable as "api" on hooks.
  hook-stub:
    image: python:3.13-alpine
    command: ["python", "-u", "/netlab/hook_stub.py"]
    environment:
      TUSD_HOOK_SECRET: "${TUSD_HOOK_SECRET:?set in .env (openssl rand -hex 32)}"
    volumes:
      - ../../tools/netlab/hook_stub.py:/netlab/hook_stub.py:ro
    networks:
      hooks:
        aliases: [api]

  # Real IP-level packet loss (ADR 0005): tc netem (delay + loss) on toxiproxy's upstream leg where the
  # kernel has sch_netem, else iptables "statistic" drops. Shares toxiproxy's netns; netlab.py sets it.
  netlab-loss:
    image: nicolaka/netshoot:v0.13@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    network_mode: "service:toxiproxy"
    cap_add: [NET_ADMIN]
    command: ["sleep", "infinity"]
